{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omnira.fullname" . }}-api
  labels:
    {{- include "omnira.labels" . | nindent 4 }}
    component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "omnira.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.api.service.port }}"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "omnira.api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "omnira.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}

      containers:
      - name: api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}

        ports:
        - name: http
          containerPort: {{ .Values.api.service.targetPort }}
          protocol: TCP

        env:
        - name: OMNIRA_ENV
          value: {{ .Values.global.environment }}
        - name: OMNIRA_HTTP_ADDR
          value: "0.0.0.0:{{ .Values.api.service.targetPort }}"
        - name: OMNIRA_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "omnira.fullname" . }}-db
              key: url
        - name: OMNIRA_NATS_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "omnira.fullname" . }}-config
              key: nats-url
        - name: OMNIRA_OTEL_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: {{ include "omnira.fullname" . }}-config
              key: otel-endpoint

        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}

        {{- if .Values.healthChecks.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: /internal/health/live
            port: http
          initialDelaySeconds: {{ .Values.healthChecks.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthChecks.livenessProbe.periodSeconds }}
        {{- end }}

        {{- if .Values.healthChecks.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: /internal/health/ready
            port: http
          initialDelaySeconds: {{ .Values.healthChecks.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthChecks.readinessProbe.periodSeconds }}
        {{- end }}

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000

        volumeMounts:
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: tmp
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname

{{- end }}
