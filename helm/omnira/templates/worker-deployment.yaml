{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omnira.fullname" . }}-worker
  labels:
    {{- include "omnira.labels" . | nindent 4 }}
    component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "omnira.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.worker.service.metricsPort }}"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "omnira.worker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "omnira.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}

      containers:
      - name: worker
        image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
        imagePullPolicy: {{ .Values.worker.image.pullPolicy }}

        ports:
        - name: metrics
          containerPort: {{ .Values.worker.service.metricsPort }}
          protocol: TCP

        env:
        - name: OMNIRA_ENV
          value: {{ .Values.global.environment }}
        - name: OMNIRA_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "omnira.fullname" . }}-db
              key: url
        - name: OMNIRA_NATS_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "omnira.fullname" . }}-config
              key: nats-url
        - name: OMNIRA_OTEL_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: {{ include "omnira.fullname" . }}-config
              key: otel-endpoint

        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}

        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 5

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000

        volumeMounts:
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: tmp
        emptyDir: {}

{{- end }}
