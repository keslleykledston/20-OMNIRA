{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "omnira.fullname" . }}
  labels:
    {{- include "omnira.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "omnira.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}

  ingress:
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: nginx-ingress

  # Allow traffic between API and Worker
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ include "omnira.name" . }}

  # Allow Prometheus scraping
  - from:
    - namespaceSelector:
        matchLabels:
          name: prometheus

  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53

  # Allow traffic to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432

  # Allow traffic to NATS
  - to:
    - podSelector:
        matchLabels:
          app: nats
    ports:
    - protocol: TCP
      port: 4222

  # Allow traffic to OTel Collector
  - to:
    - podSelector:
        matchLabels:
          app: otel-collector
    ports:
    - protocol: TCP
      port: 4317

{{- end }}
