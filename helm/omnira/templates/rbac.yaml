{{- if .Values.rbac.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "omnira.serviceAccountName" . }}
  labels:
    {{- include "omnira.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "omnira.fullname" . }}
  labels:
    {{- include "omnira.labels" . | nindent 4 }}
rules:
  # Basic pod info (for debugging)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "omnira.fullname" . }}
  labels:
    {{- include "omnira.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "omnira.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "omnira.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

{{- end }}
