apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnira.fullname" . }}-db
  labels:
    {{- include "omnira.labels" . | nindent 4 }}
type: Opaque
stringData:
  # IMPORTANT: Set via --set during helm install
  # Example: helm install omnira ./helm/omnira --set postgresql.password=secretpass
  url: {{ .Values.postgresql.url | default "postgresql://omnira:changeme@postgres:5432/omnira" }}
