version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omnira
      POSTGRES_PASSWORD: omnira
      POSTGRES_DB: omnira_dev
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnira"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: 20-omnira-api
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      OMNIRA_DATABASE_URL: postgres://omnira_app:omnira_app@postgres:5432/omnira_dev?sslmode=disable
      OMNIRA_NATS_URL: nats://nats:4222
      OMNIRA_AUTH_MODE: mock
      OMNIRA_ENV: lab
      OMNIRA_CREDENTIALS_KEY: TUlSds2/+c+9Kx7mPNm5E5sZPf9nc0u6zW50k/c5YgE=
      OMNIRA_HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/internal/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
