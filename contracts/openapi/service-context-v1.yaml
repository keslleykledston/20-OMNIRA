openapi: 3.0.3
info:
  title: OMNIRA Service Context & Operations API
  version: 0.1.0
  description: |
    Service sessions (atendimentos) with a protocol per company, the company's own categories and result codes, and — in later phases of ADR-0049 — cases,
    tasks and external records. Kept as its own contract so the module ships without touching `omnira-v1.yaml`; a drift test
    (`internal/servicectx/adapters/contract_test.go`) fails the build when this file and the routes diverge, in both directions.

    Authentication is the session cookie; the tenant comes from the URL and is re-checked against the session's memberships (or a live Hub grant).
    Authorization is by permission KEY (never role name): `service.read`, `service.create`, `service.update`, `service.close`, `service.assign`,
    `service.link_external`, `service.request_external`. The database asks for the same keys again.

    Conventions: bodies refuse unknown fields (a `tenant_id` in a body is an error, never an override). Every mutation of an existing record needs
    `If-Match: "<version>"` (the `ETag` of the last read): missing = 428, stale = 412. `POST /service-sessions` takes an optional `Idempotency-Key`
    (8-128 characters): the same key with the same request returns the same session (200, `Idempotent-Replay: true`); with another request, 422.
    Errors are `{error, detail?}`.
servers:
  - url: /api/v1
paths:
  /tenants/{tenant_id}/service-sessions:
    post:
      operationId: openServiceSession
      tags: [Service sessions]
      summary: Open a service session (or return the one already standing for the request)
      description: |
        Needs `service.create`. With `conversation_id` the contact comes from the conversation and the conversation's ACTIVE session is returned when it already
        has one (at most one is active at a time; many follow one another). Without a conversation it logs an attendance by another channel (a phone call).
        The protocol (`AT-<n>`) is unique per company and allocated in the same transaction. A conversation that is closed, internal or not visible cannot have one.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OpenSessionRequest' } } }
      responses:
        '201': { description: Created, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '200': { description: Already standing (replay or active session), headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      operationId: listServiceSessions
      tags: [Service sessions]
      summary: List service sessions, newest first, by keyset cursor
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SessionStatus' } }
        - { name: conversation_id, in: query, schema: { type: string, format: uuid } }
        - { name: contact_id, in: query, schema: { type: string, format: uuid } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: queue_id, in: query, schema: { type: string, format: uuid } }
        - { name: protocol, in: query, schema: { type: string } }
        - { name: opened_from, in: query, schema: { type: string, format: date-time } }
        - { name: opened_to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: A page, content: { application/json: { schema: { $ref: '#/components/schemas/SessionPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-sessions/{session_id}:
    get:
      operationId: getServiceSession
      tags: [Service sessions]
      summary: Read a service session (with who holds its conversation now)
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '200': { description: The session, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: classifyServiceSession
      tags: [Service sessions]
      summary: Classify an active session (customer, department, category)
      description: Needs `service.update` and `If-Match`. Only the fields sent change; nothing is cleared in this version. A closed session is read-only.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClassifyRequest' } } }
      responses:
        '200': { description: Updated, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-sessions/{session_id}/status:
    post:
      operationId: setServiceSessionStatus
      tags: [Service sessions]
      summary: Move an active session between in_progress and waiting
      description: Needs `service.update` and `If-Match`. Closing, abandoning and reopening have their own operations (they ask for `service.close`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], additionalProperties: false, properties: { status: { type: string, enum: [in_progress, waiting] } } } } }
      responses:
        '200': { description: Updated, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-sessions/{session_id}/close:
    post:
      operationId: closeServiceSession
      tags: [Service sessions]
      summary: Close (or abandon) a session with a result
      description: |
        Needs `service.close` and `If-Match`. The result is the PRIMARY classification: one of the eight built-in codes or an active code of the company
        (which points to a built-in one; reports aggregate by `resolution_canonical`). Tasks, cases and service orders are links, not results.
        `abandon=true` ends it as `abandoned` (result `abandoned`); `abandoned` cannot be used with `abandon=false`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CloseRequest' } } }
      responses:
        '200': { description: Closed, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-sessions/{session_id}/reopen:
    post:
      operationId: reopenServiceSession
      tags: [Service sessions]
      summary: Reopen a closed or abandoned session (narrow exception)
      description: |
        Needs `service.close` and `If-Match`. Only when the conversation is still open (a closed conversation is final, ADR-0020), the session is the
        conversation's latest, no other one is active, and the reopen window (72 h) has not passed. The protocol is kept; a new episode starts, so the time
        spent closed is not absorbed. A reason is required.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, maxLength: 300 } } } } }
      responses:
        '200': { description: Reopened, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-sessions/{session_id}/messages:
    get:
      operationId: listServiceSessionMessages
      tags: [Service sessions]
      summary: The messages that belong to the session, BY REFERENCE (no body is copied)
      description: A message belongs to the session when its `created_at` falls inside one of the session's episodes (half-open). Read the content through the Inbox API.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/SessionId' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: A page, content: { application/json: { schema: { $ref: '#/components/schemas/MessageRefPage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/conversations/{conversation_id}/service-session:
    get:
      operationId: getConversationServiceSession
      tags: [Service sessions]
      summary: The active session of a conversation, or the latest one when none is active
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { name: conversation_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: The session, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-sessions/{session_id}/timeline:
    get:
      operationId: getServiceSessionTimeline
      tags: [Timeline]
      summary: The history of one session
      description: |
        Stored events (`derived=false`: opened, classified, status changed, closed, reopened ...) plus, shown by reference and never copied, the routing module's
        record of who held the conversation while the session was in course (`derived=true`, `conversation.assignment_changed`). Payloads carry ids, enums and
        counts only; message content is never here. Ordered by `(occurred_at, id)`, newest first by default; paginated by keyset cursor.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/SessionId' }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: A page, content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/contacts/{contact_id}/service-timeline:
    get:
      operationId: getContactServiceTimeline
      tags: [Timeline]
      summary: The stored history around one contact, across its sessions
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: A page, content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/contacts/{contact_id}/service-context:
    get:
      operationId: getContactServiceContext
      tags: [Timeline]
      summary: The aggregated context an attendant needs when a contact writes
      description: |
        Recent sessions and their results, the active session and recent events. A contact may be tied to several companies (customer accounts), so the
        context never guesses: without `customer_id` and with more than one link it answers `needs_customer_selection=true` and shows only what is tied to no
        customer; with `customer_id` (which must be one of the contact's own active links, else 400) it narrows to that customer. Open cases and pending tasks follow
        the same rule (a customer's case, task or external record never appears under another customer's selection).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The context, content: { application/json: { schema: { $ref: '#/components/schemas/ContactContext' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-cases:
    post:
      operationId: openServiceCase
      tags: [Cases]
      summary: Open a case (ocorrência)
      description: |
        Needs `service.create` (and `service.assign` to give it a team or an agent). A case is deliberate: the system never makes one for a conversation by itself.
        With `session_id` the session is kept as the case's origin and its customer is inherited when none is given.
        `Idempotency-Key` makes a retry return the same case (200, `Idempotent-Replay: true`); with another request, 422.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OpenCaseRequest' } } }
      responses:
        '201': { description: Created, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        '200': { description: Already standing (replay), headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      operationId: listServiceCases
      tags: [Cases]
      summary: List cases, newest first, by keyset cursor
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CaseStatus' } }
        - { name: working, in: query, schema: { type: boolean }, description: Only open, investigating or waiting. }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/Priority' } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: assigned_agent_id, in: query, schema: { type: string, format: uuid } }
        - { name: assigned_team_id, in: query, schema: { type: string, format: uuid } }
        - { name: session_id, in: query, schema: { type: string, format: uuid }, description: Cases linked to this session. }
        - { name: case_number, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: A page, content: { application/json: { schema: { $ref: '#/components/schemas/CasePage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-cases/{case_id}:
    get:
      operationId: getServiceCase
      tags: [Cases]
      summary: Read a case
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: case_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The case, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateServiceCase
      tags: [Cases]
      summary: Edit a case that is not final
      description: |
        Needs `service.update` and `If-Match`. Only the fields sent change.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: case_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchCaseRequest' } } }
      responses:
        '200': { description: The case, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-cases/{case_id}/status:
    post:
      operationId: setServiceCaseStatus
      tags: [Cases]
      summary: Move a case between states
      description: |
        Moves follow `open -> investigating|waiting|resolved|cancelled`, `investigating <-> waiting`, `resolved -> closed | investigating (reopen)`; `closed` and `cancelled` are final.
        `open|investigating|waiting` moves need `service.update`; resolving, closing, cancelling and reopening need `service.close`. Resolving needs `resolution`; cancelling and reopening need a `reason` (3-500 characters). Needs `If-Match`.
        Nothing here touches a session or a task: their states are independent.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: case_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CaseStatusRequest' } } }
      responses:
        '200': { description: The case, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-cases/{case_id}/assign:
    post:
      operationId: assignServiceCase
      tags: [Cases]
      summary: Set who works the case
      description: |
        Needs `service.assign` and `If-Match`. The agent must be an active member of the company; sending neither clears the assignment.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: case_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssignCaseRequest' } } }
      responses:
        '200': { description: The case, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Case' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-cases/{case_id}/sessions:
    post:
      operationId: linkServiceSessionToCase
      tags: [Cases]
      summary: Record that another attendance refers to this case
      description: |
        Needs `service.update`. Idempotent (200 when the link already stood, 201 when created). A final case takes no new links.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: case_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [session_id], additionalProperties: false, properties: { session_id: { type: string, format: uuid } } } } }
      responses:
        '201': { description: Linked, content: { application/json: { schema: { type: object } } } }
        '200': { description: Already linked, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    get:
      operationId: listServiceCaseSessions
      tags: [Cases]
      summary: The sessions that refer to the case
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: case_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Sessions, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Session' } } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
