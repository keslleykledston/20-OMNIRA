        - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The request, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalRequest' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/external-requests/{request_id}/reconcile:
    post:
      operationId: reconcileExternalRequest
      tags: [External requests]
      summary: Find out whether a request of unknown outcome was processed
      description: |
        Needs `service.request_external` and `service.link_external`. A request still in flight (its own call may answer at any moment) is `too_early`. Asks the ERP for the record by the correlation key OMNIRA sent; an answer that is not a service order teaches nothing. Found: confirmed (and linked). Not found: believed only when the request is old enough (an ERP may be eventually consistent), then it is a confirmed failure that frees the session. An ERP that does not answer teaches nothing. An ERP that cannot look a record up (`needs_manual`) is settled by `resolve`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: What the reconciliation found, content: { application/json: { schema: { $ref: '#/components/schemas/ReconcileResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
