      summary: Link a record the ERP/CRM already has to a session, a case or a task
      description: |
        Needs `service.link_external`. The ERP is the authority: it is asked to CONFIRM the record (this module never invents one), and the projection (status, class, sync state) is refreshed from what it says. The same ERP record can be linked to several targets and stays ONE record (unique by integration + type + id, per company). Linking twice returns the link that stands (200). An ERP that does not answer is `502 external_unavailable`, never a guess; no adapter for the integration is `503 not_configured`.
      parameters:
