        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/external-records/{record_id}/refresh:
    post:
      operationId: refreshExternalRecord
      tags: [External records]
      summary: Ask the ERP again and update the projection
      description: |
        Needs `service.link_external`. A server-side sync, so it takes no `If-Match`. An older snapshot (by the PROVIDER's own update time) never rolls the projection back. An ERP that does not answer leaves the record as it was, marked `stale`; one that no longer knows it marks it `conflict`; nothing is deleted. The status change is told on the timeline of every session, case and task the record is linked to.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: record_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The record, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalRecord' } } } }
