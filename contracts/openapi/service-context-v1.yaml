        Needs `service.request_external` and `service.link_external`. After somebody checked the ERP: it created the record (give its id; the ERP is asked to confirm it exists) or it created nothing (give the reason, kept in the history). A settled request is final (409).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResolveRequest' } } }
      responses:
        '200': { description: Settled, content: { application/json: { schema: { $ref: '#/components/schemas/ReconcileResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
