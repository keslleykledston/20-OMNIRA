      responses:
        '200': { description: Categories, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createServiceCategory
      tags: [Catalogs]
      summary: Add a category (needs tenant.manage)
      parameters: [ { $ref: '#/components/parameters/TenantId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code, label], additionalProperties: false, properties: { code: { type: string }, label: { type: string, maxLength: 80 } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-categories/{category_id}:
    patch:
      operationId: updateServiceCategory
      tags: [Catalogs]
      summary: Rename or (de)activate a category (needs tenant.manage); entries are never deleted
      description: "Catalog entries are the company's configuration, not operational records: they carry no `version` and take no `If-Match` (the last write wins)."
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { name: category_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CatalogPatch' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-result-codes:
    get:
      operationId: listServiceResultCodes
      tags: [Catalogs]
      summary: The company's own result codes (plus the built-in ones, which are always available)
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { name: include_inactive, in: query, schema: { type: boolean } } ]
      responses:
        '200': { description: Result codes, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ResultCode' } }, built_in: { type: array, items: { type: string } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createServiceResultCode
      tags: [Catalogs]
      summary: Add a result code that points to a built-in one (needs tenant.manage)
      parameters: [ { $ref: '#/components/parameters/TenantId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code, canonical_code, label], additionalProperties: false, properties: { code: { type: string }, canonical_code: { $ref: '#/components/schemas/CanonicalResult' }, label: { type: string, maxLength: 80 } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ResultCode' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-result-codes/{code_id}:
    patch:
      operationId: updateServiceResultCode
      tags: [Catalogs]
      summary: Rename or (de)activate a result code (needs tenant.manage)
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { name: code_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CatalogPatch' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ResultCode' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  parameters:
    TenantId: { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, required: true, description: 'The version you read, as the ETag: "3".', schema: { type: string } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: 'A stable code: not_found, forbidden, invalid, precondition_required, version_conflict, invalid_transition, reopen_not_allowed, conversation_closed, idempotency_key_reused, not_a_customer_conversation, unknown_result, not_configured, outcome_unknown, unauthorized, internal.' }
        detail: { type: string }
    SessionStatus: { type: string, enum: [open, in_progress, waiting, closed, abandoned] }
    CanonicalResult:
      type: string
      enum: [information_provided, resolved_first_contact, task_created, case_created, external_service_order, transferred, abandoned, other]
    OpenSessionRequest:
      type: object
      additionalProperties: false
      properties:
        conversation_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true, description: Ignored when a conversation is given (the contact comes from it). }
        customer_id: { type: string, format: uuid, nullable: true }
        queue_id: { type: string, format: uuid, nullable: true, description: The department (queues are the sectors). }
        category_id: { type: string, format: uuid, nullable: true }
        origin_channel: { type: string, pattern: '^[a-z0-9_]{1,40}$', description: Defaults to the line's provider when a conversation is given. }
        external_protocol: { type: string, maxLength: 80, description: A legacy or imported number; it never takes the place of the generated protocol. }
    ClassifyRequest:
      type: object
      additionalProperties: false
      properties:
        customer_id: { type: string, format: uuid }
        queue_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
    CloseRequest:
      type: object
      additionalProperties: false
      properties:
        resolution_code: { type: string, description: A built-in code or an active code of the company. Required unless abandon=true. }
        note: { type: string, maxLength: 1000 }
        abandon: { type: boolean }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        protocol: { type: string, example: AT-10482 }
        external_protocol: { type: string, nullable: true }
        conversation_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        customer_id: { type: string, format: uuid, nullable: true }
        queue_id: { type: string, format: uuid, nullable: true }
        category_id: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/SessionStatus' }
        resolution_code: { type: string, nullable: true }
        resolution_canonical: { $ref: '#/components/schemas/CanonicalResult' }
        resolution_note: { type: string }
        origin_channel: { type: string }
        opened_source: { type: string, enum: [operator, finalize, flow, api, system] }
        closed_source: { type: string, nullable: true }
        opened_by_user_id: { type: string, format: uuid, nullable: true }
        closed_by_user_id: { type: string, format: uuid, nullable: true }
        assigned_to_user_id: { type: string, format: uuid, nullable: true, description: Who holds the conversation now (read live; not copied). }
        opened_at: { type: string, format: date-time }
        first_response_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        reopen_count: { type: integer }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
    SessionPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Session' } }
        next_cursor: { type: string }
    MessageRefPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              direction: { type: string, enum: [inbound, outbound] }
              type: { type: string }
              status: { type: string }
              created_at: { type: string, format: date-time }
              sent_by_user_id: { type: string, format: uuid, nullable: true }
        next_cursor: { type: string }
    TimelineItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string, example: service_session.closed }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid, nullable: true }
        case_id: { type: string, format: uuid, nullable: true }
        conversation_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        customer_id: { type: string, format: uuid, nullable: true }
        actor_type: { type: string, enum: [user, system, flow, ai, integration] }
        actor_id: { type: string, format: uuid, nullable: true }
        source_system: { type: string }
        occurred_at: { type: string, format: date-time }
        schema_version: { type: integer }
        payload: { type: object, description: Ids, enums and counts only. }
        note: { type: string, description: A reason a person typed (reopen, cancel); never message content. }
        correlation_id: { type: string, format: uuid, nullable: true }
        derived: { type: boolean, description: True for an entry read from another module's history (never stored here). }
    TimelinePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TimelineItem' } }
        next_cursor: { type: string }
    ContactContext:
      type: object
      properties:
        contact_id: { type: string, format: uuid }
        customers: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string }, is_primary: { type: boolean } } } }
        needs_customer_selection: { type: boolean }
        selected_customer_id: { type: string, format: uuid, nullable: true }
        active_session: { allOf: [ { $ref: '#/components/schemas/Session' } ], nullable: true }
        recent_sessions: { type: array, items: { $ref: '#/components/schemas/Session' } }
        recent_events: { type: array, items: { $ref: '#/components/schemas/TimelineItem' } }
        open_cases: { type: array, items: { $ref: '#/components/schemas/Case' } }
        pending_tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }
        external_records: { type: array, items: { $ref: '#/components/schemas/ExternalRecord' } }
    Priority: { type: string, enum: [low, normal, high, urgent] }
    CaseStatus: { type: string, enum: [open, investigating, waiting, resolved, closed, cancelled] }
    TaskStatus: { type: string, enum: [open, in_progress, done, cancelled] }
    OpenCaseRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        customer_id: { type: string, format: uuid, nullable: true }
        category_id: { type: string, format: uuid, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        assigned_team_id: { type: string, format: uuid, nullable: true }
        assigned_agent_id: { type: string, format: uuid, nullable: true }
        session_id: { type: string, format: uuid, nullable: true }
    PatchCaseRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        priority: { $ref: '#/components/schemas/Priority' }
        category_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
    CaseStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/CaseStatus' }
        resolution: { type: string, maxLength: 4000, description: Required to resolve. }
        reason: { type: string, minLength: 3, maxLength: 500, description: Required to cancel and to reopen a resolved case. }
    AssignCaseRequest:
      type: object
      additionalProperties: false
      properties:
        assigned_team_id: { type: string, format: uuid, nullable: true }
        assigned_agent_id: { type: string, format: uuid, nullable: true }
    Case:
      type: object
      properties:
        id: { type: string, format: uuid }
        case_number: { type: string, example: OC-1042 }
        title: { type: string }
        description: { type: string }
        customer_id: { type: string, format: uuid, nullable: true }
        category_id: { type: string, format: uuid, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/CaseStatus' }
        assigned_team_id: { type: string, format: uuid, nullable: true }
        assigned_agent_id: { type: string, format: uuid, nullable: true }
        origin_session_id: { type: string, format: uuid, nullable: true }
        resolution: { type: string, nullable: true }
        cancel_reason: { type: string, nullable: true }
        opened_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        reopen_count: { type: integer }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
    CasePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Case' } }
        next_cursor: { type: string }
    CreateTaskRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        priority: { $ref: '#/components/schemas/Priority' }
        assigned_user_id: { type: string, format: uuid, nullable: true }
        assigned_team_id: { type: string, format: uuid, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        session_id: { type: string, format: uuid, nullable: true }
        case_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
    PatchTaskRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        priority: { $ref: '#/components/schemas/Priority' }
        due_at: { type: string, format: date-time }
        clear_due: { type: boolean }
    AssignTaskRequest:
      type: object
      additionalProperties: false
      properties:
        assigned_user_id: { type: string, format: uuid, nullable: true }
        assigned_team_id: { type: string, format: uuid, nullable: true }
    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        assigned_user_id: { type: string, format: uuid, nullable: true }
        assigned_team_id: { type: string, format: uuid, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        overdue: { type: boolean, description: Pending and past its due time. }
        completed_at: { type: string, format: date-time, nullable: true }
        completed_by_user_id: { type: string, format: uuid, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cancel_reason: { type: string, nullable: true }
        origin_type: { type: string, enum: [human, flow, ai, api] }
        session_id: { type: string, format: uuid, nullable: true }
        case_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        reopen_count: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Task' } }
        next_cursor: { type: string }
    StatusClass: { type: string, enum: [open, in_progress, done, cancelled, unknown], description: The ERP's own status normalized to a few classes. }
    RequestState: { type: string, enum: [in_flight, confirmed_success, confirmed_failure, outcome_unknown] }
    LinkExternalRequest:
      type: object
      required: [integration_id, external_type, external_id]
      additionalProperties: false
      properties:
        integration_id: { type: string, format: uuid }
        external_type: { type: string, example: service_order }
        external_id: { type: string, maxLength: 120 }
        session_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
      description: Exactly one of session_id, case_id, task_id.
    ExternalRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        integration_id: { type: string, format: uuid }
        external_system: { type: string }
        external_type: { type: string }
        external_id: { type: string }
        display_ref: { type: string, example: OS 1042 }
        external_status: { type: string }
        status_class: { $ref: '#/components/schemas/StatusClass' }
        sync_state: { type: string, enum: [synced, pending, stale, conflict, error] }
        source_updated_at: { type: string, format: date-time, nullable: true, description: The PROVIDER's update time of the snapshot applied last; it only moves forward. }
        last_synced_at: { type: string, format: date-time, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExternalLink:
      type: object
      properties:
        id: { type: string, format: uuid }
        external_record_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid, nullable: true }
        case_id: { type: string, format: uuid, nullable: true }
        task_id: { type: string, format: uuid, nullable: true }
        linked_at: { type: string, format: date-time }
        unlinked_at: { type: string, format: date-time, nullable: true }
    LinkExternalResponse:
      type: object
      properties:
        record: { $ref: '#/components/schemas/ExternalRecord' }
        link: { $ref: '#/components/schemas/ExternalLink' }
        record_created: { type: boolean }
        link_created: { type: boolean }
    ExternalRecordPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExternalRecord' } }
        next_cursor: { type: string }
    ServiceOrderRequest:
      type: object
      required: [integration_id, title]
      additionalProperties: false
      properties:
        integration_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid, nullable: true }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000, description: What the ERP receives. Only the title is kept here. }
    ExternalRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        integration_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid, nullable: true }
        operation: { type: string, enum: [create_service_order] }
        title: { type: string }
        state: { $ref: '#/components/schemas/RequestState' }
        external_record_id: { type: string, format: uuid, nullable: true }
        failure_class: { type: string, nullable: true }
        resolution_source: { type: string, enum: [gateway, reconcile, manual], nullable: true }
        requested_by_user_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        version: { type: integer }
    ServiceOrderResponse:
      type: object
      properties:
        outcome: { type: string, enum: [created, replay, rejected, outcome_unknown, blocked] }
        request: { $ref: '#/components/schemas/ExternalRequest' }
        record: { allOf: [ { $ref: '#/components/schemas/ExternalRecord' } ], nullable: true }
        error: { type: string }
        detail: { type: string }
    ExternalRequestPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExternalRequest' } }
        next_cursor: { type: string }
    ReconcileResponse:
      type: object
      properties:
        request: { $ref: '#/components/schemas/ExternalRequest' }
        record: { allOf: [ { $ref: '#/components/schemas/ExternalRecord' } ], nullable: true }
        needs_manual: { type: boolean, description: The ERP offers no way to look the record up; settle it with resolve. }
        too_early: { type: boolean, description: The ERP does not know it YET; not believed until the request is old enough. }
    ResolveRequest:
      type: object
      required: [created]
      additionalProperties: false
      properties:
        created: { type: boolean }
        external_id: { type: string, maxLength: 120, description: Required when created. }
        reason: { type: string, minLength: 3, maxLength: 500, description: Required when nothing was created. }
    Category:
      type: object
      properties: { id: { type: string, format: uuid }, code: { type: string }, label: { type: string }, active: { type: boolean } }
    ResultCode:
      type: object
      properties: { id: { type: string, format: uuid }, code: { type: string }, canonical_code: { $ref: '#/components/schemas/CanonicalResult' }, label: { type: string }, active: { type: boolean } }
    CatalogPatch:
      type: object
      additionalProperties: false
      properties: { label: { type: string, maxLength: 80 }, active: { type: boolean } }
