openapi: 3.0.3
info:
  title: OMNIRA Service Context & Operations API
  version: 0.1.0
  description: |
    Service sessions (atendimentos) with a protocol per company, the company's own categories and result codes, and — in later phases of ADR-0049 — cases,
    tasks and external records. Kept as its own contract so the module ships without touching `omnira-v1.yaml`; a drift test
    (`internal/servicectx/adapters/contract_test.go`) fails the build when this file and the routes diverge, in both directions.

    Authentication is the session cookie; the tenant comes from the URL and is re-checked against the session's memberships (or a live Hub grant).
    Authorization is by permission KEY (never role name): `service.read`, `service.create`, `service.update`, `service.close`, `service.assign`,
    `service.link_external`, `service.request_external`. The database asks for the same keys again.

    Conventions: bodies refuse unknown fields (a `tenant_id` in a body is an error, never an override). Every mutation of an existing record needs
    `If-Match: "<version>"` (the `ETag` of the last read): missing = 428, stale = 412. `POST /service-sessions` takes an optional `Idempotency-Key`
    (8-128 characters): the same key with the same request returns the same session (200, `Idempotent-Replay: true`); with another request, 422.
    Errors are `{error, detail?}`.
servers:
  - url: /api/v1
paths:
  /tenants/{tenant_id}/service-sessions:
    post:
      operationId: openServiceSession
      tags: [Service sessions]
      summary: Open a service session (or return the one already standing for the request)
      description: |
        Needs `service.create`. With `conversation_id` the contact comes from the conversation and the conversation's ACTIVE session is returned when it already
        has one (at most one is active at a time; many follow one another). Without a conversation it logs an attendance by another channel (a phone call).
        The protocol (`AT-<n>`) is unique per company and allocated in the same transaction. A conversation that is closed, internal or not visible cannot have one.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OpenSessionRequest' } } }
      responses:
        '201': { description: Created, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '200': { description: Already standing (replay or active session), content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      operationId: listServiceSessions
      tags: [Service sessions]
      summary: List service sessions, newest first, by keyset cursor
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SessionStatus' } }
        - { name: conversation_id, in: query, schema: { type: string, format: uuid } }
        - { name: contact_id, in: query, schema: { type: string, format: uuid } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: queue_id, in: query, schema: { type: string, format: uuid } }
        - { name: protocol, in: query, schema: { type: string } }
        - { name: opened_from, in: query, schema: { type: string, format: date-time } }
        - { name: opened_to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: A page, content: { application/json: { schema: { $ref: '#/components/schemas/SessionPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-sessions/{session_id}:
    get:
      operationId: getServiceSession
      tags: [Service sessions]
      summary: Read a service session (with who holds its conversation now)
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { $ref: '#/components/parameters/SessionId' } ]
      responses:
        '200': { description: The session, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: classifyServiceSession
      tags: [Service sessions]
      summary: Classify an active session (customer, department, category)
      description: Needs `service.update` and `If-Match`. Only the fields sent change; nothing is cleared in this version. A closed session is read-only.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClassifyRequest' } } }
      responses:
        '200': { description: Updated, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-sessions/{session_id}/status:
    post:
      operationId: setServiceSessionStatus
      tags: [Service sessions]
      summary: Move an active session between in_progress and waiting
      description: Needs `service.update` and `If-Match`. Closing, abandoning and reopening have their own operations (they ask for `service.close`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], additionalProperties: false, properties: { status: { type: string, enum: [in_progress, waiting] } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-sessions/{session_id}/close:
    post:
      operationId: closeServiceSession
      tags: [Service sessions]
      summary: Close (or abandon) a session with a result
      description: |
        Needs `service.close` and `If-Match`. The result is the PRIMARY classification: one of the eight built-in codes or an active code of the company
        (which points to a built-in one; reports aggregate by `resolution_canonical`). Tasks, cases and service orders are links, not results.
        `abandon=true` ends it as `abandoned` (result `abandoned`); `abandoned` cannot be used with `abandon=false`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CloseRequest' } } }
      responses:
        '200': { description: Closed, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-sessions/{session_id}/reopen:
    post:
      operationId: reopenServiceSession
      tags: [Service sessions]
      summary: Reopen a closed or abandoned session (narrow exception)
      description: |
        Needs `service.close` and `If-Match`. Only when the conversation is still open (a closed conversation is final, ADR-0020), the session is the
        conversation's latest, no other one is active, and the reopen window (72 h) has not passed. The protocol is kept; a new episode starts, so the time
        spent closed is not absorbed. A reason is required.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], additionalProperties: false, properties: { reason: { type: string, maxLength: 300 } } } } }
      responses:
        '200': { description: Reopened, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-sessions/{session_id}/messages:
    get:
      operationId: listServiceSessionMessages
      tags: [Service sessions]
      summary: The messages that belong to the session, BY REFERENCE (no body is copied)
      description: A message belongs to the session when its `created_at` falls inside one of the session's episodes (half-open). Read the content through the Inbox API.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/SessionId' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: A page, content: { application/json: { schema: { $ref: '#/components/schemas/MessageRefPage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/conversations/{conversation_id}/service-session:
    get:
      operationId: getConversationServiceSession
      tags: [Service sessions]
      summary: The active session of a conversation, or the latest one when none is active
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { name: conversation_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: The session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-sessions/{session_id}/timeline:
    get:
      operationId: getServiceSessionTimeline
      tags: [Timeline]
      summary: The history of one session
      description: |
        Stored events (`derived=false`: opened, classified, status changed, closed, reopened ...) plus, shown by reference and never copied, the routing module's
        record of who held the conversation while the session was in course (`derived=true`, `conversation.assignment_changed`). Payloads carry ids, enums and
        counts only; message content is never here. Ordered by `(occurred_at, id)`, newest first by default; paginated by keyset cursor.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/SessionId' }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: A page, content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/contacts/{contact_id}/service-timeline:
    get:
      operationId: getContactServiceTimeline
      tags: [Timeline]
      summary: The stored history around one contact, across its sessions
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: A page, content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/contacts/{contact_id}/service-context:
    get:
      operationId: getContactServiceContext
      tags: [Timeline]
      summary: The aggregated context an attendant needs when a contact writes
      description: |
        Recent sessions and their results, the active session and recent events. A contact may be tied to several companies (customer accounts), so the
        context never guesses: without `customer_id` and with more than one link it answers `needs_customer_selection=true` and shows only what is tied to no
        customer; with `customer_id` (which must be one of the contact's own active links, else 400) it narrows to that customer. Open cases, pending tasks and
        external records join this view in later phases.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The context, content: { application/json: { schema: { $ref: '#/components/schemas/ContactContext' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-categories:
    get:
      operationId: listServiceCategories
      tags: [Catalogs]
      summary: The company's categories
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { name: include_inactive, in: query, schema: { type: boolean } } ]
      responses:
        '200': { description: Categories, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createServiceCategory
      tags: [Catalogs]
      summary: Add a category (needs tenant.manage)
      parameters: [ { $ref: '#/components/parameters/TenantId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code, label], additionalProperties: false, properties: { code: { type: string }, label: { type: string, maxLength: 80 } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-categories/{category_id}:
    patch:
      operationId: updateServiceCategory
      tags: [Catalogs]
      summary: Rename or (de)activate a category (needs tenant.manage); entries are never deleted
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { name: category_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CatalogPatch' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-result-codes:
    get:
      operationId: listServiceResultCodes
      tags: [Catalogs]
      summary: The company's own result codes (plus the built-in ones, which are always available)
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { name: include_inactive, in: query, schema: { type: boolean } } ]
      responses:
        '200': { description: Result codes, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ResultCode' } }, built_in: { type: array, items: { type: string } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createServiceResultCode
      tags: [Catalogs]
      summary: Add a result code that points to a built-in one (needs tenant.manage)
      parameters: [ { $ref: '#/components/parameters/TenantId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code, canonical_code, label], additionalProperties: false, properties: { code: { type: string }, canonical_code: { $ref: '#/components/schemas/CanonicalResult' }, label: { type: string, maxLength: 80 } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ResultCode' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tenants/{tenant_id}/service-result-codes/{code_id}:
    patch:
      operationId: updateServiceResultCode
      tags: [Catalogs]
      summary: Rename or (de)activate a result code (needs tenant.manage)
      parameters: [ { $ref: '#/components/parameters/TenantId' }, { name: code_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CatalogPatch' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ResultCode' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  parameters:
    TenantId: { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, required: true, description: 'The version you read, as the ETag: "3".', schema: { type: string } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: 'A stable code: not_found, forbidden, invalid, precondition_required, version_conflict, invalid_transition, reopen_not_allowed, conversation_closed, idempotency_key_reused, not_a_customer_conversation, unknown_result, not_configured, outcome_unknown, unauthorized, internal.' }
        detail: { type: string }
    SessionStatus: { type: string, enum: [open, in_progress, waiting, closed, abandoned] }
    CanonicalResult:
      type: string
      enum: [information_provided, resolved_first_contact, task_created, case_created, external_service_order, transferred, abandoned, other]
    OpenSessionRequest:
      type: object
      additionalProperties: false
      properties:
        conversation_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true, description: Ignored when a conversation is given (the contact comes from it). }
        customer_id: { type: string, format: uuid, nullable: true }
        queue_id: { type: string, format: uuid, nullable: true, description: The department (queues are the sectors). }
        category_id: { type: string, format: uuid, nullable: true }
        origin_channel: { type: string, pattern: '^[a-z0-9_]{1,40}$', description: Defaults to the line's provider when a conversation is given. }
        external_protocol: { type: string, maxLength: 80, description: A legacy or imported number; it never takes the place of the generated protocol. }
    ClassifyRequest:
      type: object
      additionalProperties: false
      properties:
        customer_id: { type: string, format: uuid }
        queue_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
    CloseRequest:
      type: object
      additionalProperties: false
      properties:
        resolution_code: { type: string, description: A built-in code or an active code of the company. Required unless abandon=true. }
        note: { type: string, maxLength: 1000 }
        abandon: { type: boolean }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        protocol: { type: string, example: AT-10482 }
        external_protocol: { type: string, nullable: true }
        conversation_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        customer_id: { type: string, format: uuid, nullable: true }
        queue_id: { type: string, format: uuid, nullable: true }
        category_id: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/SessionStatus' }
        resolution_code: { type: string, nullable: true }
        resolution_canonical: { $ref: '#/components/schemas/CanonicalResult' }
        resolution_note: { type: string }
        origin_channel: { type: string }
        opened_source: { type: string, enum: [operator, finalize, flow, api, system] }
        closed_source: { type: string, nullable: true }
        opened_by_user_id: { type: string, format: uuid, nullable: true }
        closed_by_user_id: { type: string, format: uuid, nullable: true }
        assigned_to_user_id: { type: string, format: uuid, nullable: true, description: Who holds the conversation now (read live; not copied). }
        opened_at: { type: string, format: date-time }
        first_response_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        reopen_count: { type: integer }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
    SessionPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Session' } }
        next_cursor: { type: string }
    MessageRefPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              direction: { type: string, enum: [inbound, outbound] }
              type: { type: string }
              status: { type: string }
              created_at: { type: string, format: date-time }
              sent_by_user_id: { type: string, format: uuid, nullable: true }
        next_cursor: { type: string }
    TimelineItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string, example: service_session.closed }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid, nullable: true }
        case_id: { type: string, format: uuid, nullable: true }
        conversation_id: { type: string, format: uuid, nullable: true }
        contact_id: { type: string, format: uuid, nullable: true }
        customer_id: { type: string, format: uuid, nullable: true }
        actor_type: { type: string, enum: [user, system, flow, ai, integration] }
