  /tenants/{tenant_id}/service-sessions/{session_id}/external-service-orders:
    post:
      operationId: requestExternalServiceOrder
      tags: [External requests]
      summary: Ask the ERP to create a service order for the session
      description: |
        Available only with `OMNIRA_SERVICE_EXTERNAL_ORDERS_ENABLED` (otherwise 404) and a gateway adapter for the integration (otherwise 503). Needs `service.request_external` AND `service.link_external` (asking, and keeping the answer; administrators and supervisors; NEVER delegable to a Hub, NEVER executable by the AI). `Idempotency-Key` is REQUIRED.
        The attempt is made DURABLE in its own transaction before the ERP is called and its outcome is written in another after, so a crash cannot make a call that may have reached the ERP look as if it never happened.
        `201` created; `200` + `Idempotent-Replay: true` the same key again (no new call); `422 external_rejected` the ERP definitively refused (nothing was created; the session is free to ask again); `202 outcome_unknown` NO ANSWER — the ERP may have processed it: nothing is repeated, the session is blocked from a new request until it is reconciled; `409 request_blocked` another request of the session is in flight or of unknown outcome.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/SessionId' }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ServiceOrderRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceOrderResponse' } } } }
        '200': { description: Replay of the same Idempotency-Key, headers: { Idempotent-Replay: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceOrderResponse' } } } }
        '202': { description: No answer from the ERP - outcome unknown, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceOrderResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
