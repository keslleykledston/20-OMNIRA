        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '502': { $ref: '#/components/responses/Text502' }
  /hubs/{hub_id}/instances/{tenant_id}/channels/connections/{connection_id}/session/stop:
    post:
      operationId: stopHubManagedChannelSession
      tags: [Hub]
