        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '502': { $ref: '#/components/responses/Text502' }
  /hubs/{hub_id}/pools:
    get:
      operationId: listHubPools
      tags: [Hub]
      summary: Work pools of the hub with members (capacity, load) and the instances each answers for (hub admin)
      description: Behind the Access API flag. Only an active admin of the hub; anything else is the uniform 404.
      parameters:
        - { name: hub_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The pools
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HubWorkPool' } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
    post:
      operationId: createHubPool
      tags: [Hub]
      summary: Create a work pool (hub admin)
      parameters:
        - { name: hub_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                distribution: { type: string, enum: [manual, round_robin], default: manual }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/HubWorkPool' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: Invalid name or distribution }
  /hubs/{hub_id}/pools/{pool_id}:
    patch:
      operationId: updateHubPool
      tags: [Hub]
      summary: Rename a pool or change how it distributes (hub admin)
      parameters:
        - { name: hub_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: pool_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                distribution: { type: string, enum: [manual, round_robin] }
      responses:
        '204': { description: Applied }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
