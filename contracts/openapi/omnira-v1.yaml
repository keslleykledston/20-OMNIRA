      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '204': { description: "Invitation rejected" }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Only pending invitations can be rejected", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/leave:
    post:
      operationId: leaveConversation
      tags: [Co-attendance]
      summary: Leave the conversation as co-attendee
      description: |
