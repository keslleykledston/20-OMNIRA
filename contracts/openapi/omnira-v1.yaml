      required: [id, message_id, kind, candidates, created_at]
      properties:
        id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        kind: { type: string, enum: [conversation, group] }
        candidates:
          type: array
          items:
            type: object
            properties:
              topic_id: { type: string, format: uuid }
              title: { type: string }
              score: { type: number }
              signals: { type: array, items: { type: object } }
        created_at: { type: string, format: date-time }
    Topic:
      type: object
      required: [id, title, status, privacy_policy, source, legacy_unsegmented, last_activity_at, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        intent: { type: string }
        category: { type: string }
        status: { type: string, enum: [open, resolved, archived] }
        privacy_policy: { type: string, enum: [public, private_recommended, private_required] }
        source: { type: string, enum: [manual, rule, ai, handoff, legacy_backfill] }
        routing_confidence: { type: number, minimum: 0, maximum: 1 }
        legacy_unsegmented: { type: boolean }
        primary_contact_id: { type: string, format: uuid }
        origin_conversation_id: { type: string, format: uuid }
        last_activity_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        merged_into_topic_id: { type: string, format: uuid, description: 'Set on a topic that was merged into another (it is archived)' }
        split_from_topic_id: { type: string, format: uuid, description: 'Set on a topic created by splitting another' }
        message_count: { type: integer }
        ticket_count: { type: integer }
        last_message_at: { type: string, format: date-time }
    TopicList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Topic' }
    CreateTopicRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        intent: { type: string }
        category: { type: string }
        privacy_policy: { type: string, enum: [public, private_recommended, private_required] }
        message_ids:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
    UpdateTopicRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        intent: { type: string }
        category: { type: string }
        privacy_policy: { type: string, enum: [public, private_recommended, private_required] }
        status: { type: string, enum: [open, resolved] }
    TopicMessage:
      type: object
      required: [id, conversation_id, direction, message_type, status, created_at, relation, decision_source]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        message_type: { type: string }
        body: { type: string }
        mime_type: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        relation: { type: string, enum: [primary, secondary, supporting, ambiguous] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        decision_source: { type: string, enum: [explicit, handoff, reply, entity, rule, ai, agent, customer, legacy] }
    TopicMessagePage:
      type: object
      required: [items, has_more, count, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TopicMessage' }
        has_more: { type: boolean }
        next_cursor: { type: string }
        count: { type: integer }
        limit: { type: integer }
    TopicTicket:
      type: object
      required: [id, status, priority, subject, relation, linked_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        priority: { type: string }
        subject: { type: string }
        provider: { type: string }
        external_ticket_id: { type: string }
        relation: { type: string, enum: [primary, related, child, merged] }
        linked_at: { type: string, format: date-time }
    TopicTicketList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TopicTicket' }
    MessageItem:
      type: object
      required: [id, conversation_id, direction, message_type, status, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        channel_connection_id: { type: string, format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        message_type: { type: string, enum: [text, image, video, audio, document, sticker] }
        body: { type: string }
        media_ref: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [received, queued, sent, delivered, read, failed, uncertain] }
        created_at: { type: string, format: date-time }
        media_status:
          type: string
          enum: [pending, quarantined, clean, infected, rejected, source_gone, failed]
          description: |
            State of the attachment pipeline (ADR-0016); absent for messages without media. Only `clean` can be
            downloaded; `pending`/`quarantined` mean the file is still being checked.
        media_text:
          type: string
          description: |
            Text derived from the attachment, today the audio transcript made locally (ADR-0016). Untrusted data:
            show it as plain text, never as markup or links. It stays on the message after the file is removed.
        media_text_status: { type: string, enum: [pending, done, empty, failed] }
        media_text_suspicious:
          type: boolean
          description: The text looks like it is giving instructions to an AI model.
    MessagePage:
      type: object
      required: [items, has_more, count, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MessageItem' }
        has_more: { type: boolean }
        next_cursor: { type: string }
        count: { type: integer }
        limit: { type: integer }
    SendMessageRequest:
      type: object
      description: |
        Plain text: `text` (1-4096). With `attachment_id` (ADR-0024, only when outbound media is enabled) the previously uploaded file is
        sent and `text` becomes its optional caption (max 1024 characters of plain text).
      properties:
        text: { type: string, maxLength: 4096 }
        attachment_id: { type: string, format: uuid }
    QueuedMessage:
      type: object
      required: [id, conversation_id, direction, body, status, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        direction: { type: string, enum: [outbound] }
        body: { type: string }
        status: { type: string, enum: [queued, sent, delivered, read, failed, uncertain] }
        created_at: { type: string, format: date-time }
    AssignRequest:
      type: object
      properties:
        assignee_user_id:
          type: string
          format: uuid
          description: Optional. Absent = claim for yourself. Requires `conversation.manage` for another agent.
    AssignResult:
      type: object
      required: [conversation_id, assigned_to_user_id, changed]
      properties:
        conversation_id: { type: string, format: uuid }
        assigned_to_user_id: { type: string, format: uuid, nullable: true }
        changed: { type: boolean }
    ParticipantTargetRequest:
      type: object
      required: [target_user_id]
      properties:
        target_user_id:
          type: string
          format: uuid
          description: The agent being invited or transferred to. Must be an eligible agent of this tenant.
    InviteResult:
      type: object
      required: [participant_id, target_user_id, role, changed]
      properties:
        participant_id: { type: string, format: uuid }
        target_user_id: { type: string, format: uuid }
        role: { type: string, description: "Participant role, e.g. `INVITED`" }
        changed: { type: boolean, description: "false when the invitation already existed (idempotent no-op)" }
    TransferResult:
      type: object
      required: [changed]
      properties:
        previous_assignee: { type: string, format: uuid, nullable: true }
        new_assignee: { type: string, format: uuid, nullable: true }
        changed: { type: boolean, description: "false when the target already owned the conversation" }
    AcceptInviteResult:
      type: object
      required: [participant_id]
      properties:
        participant_id: { type: string, format: uuid }
        joined_at: { type: string, format: date-time, nullable: true }
    RealtimeEvent:
      type: object
      required: [type, id, timestamp]
      properties:
        type: { type: string, enum: [message_received, message_status, conversation_updated] }
        id: { type: string, format: uuid, description: conversation id }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          description: 'References only. message_received {message_id, direction, status}; message_status {message_id, status}; conversation_updated {reason, assigned_to_user_id, status}.'
          additionalProperties: true
    CreateConnectionRequest:
      type: object
      required: [risk_acknowledged]
      properties:
        risk_acknowledged: { type: boolean, description: 'Must be true' }
    CreateGenericConnectionRequest:
      type: object
      required: [provider]
      additionalProperties: false
      properties:
        provider: { type: string, example: waha }
        inputs:
          type: object
          additionalProperties: { type: string }
          description: Write-only values accepted by the selected provider descriptor; never returned.
        risk_acknowledged: { type: boolean, description: 'Required and true for unofficial providers' }
    ProviderDescriptor:
      type: object
      required: [id, name, channel, kind, connect_method, capabilities, enabled, inputs, displays]
      properties:
        id: { type: string, example: waha }
        name: { type: string, example: 'WhatsApp (não oficial)' }
        channel: { type: string, example: whatsapp }
        kind: { type: string, enum: [official, unofficial] }
        connect_method: { type: string, enum: [qr_session, credentials, oauth_redirect] }
        risk_notice: { type: string }
        capabilities: { type: array, items: { type: string } }
        enabled: { type: boolean }
        unavailable_reason: { type: string }
        inputs:
          type: array
          items: { $ref: '#/components/schemas/ProviderInputDescriptor' }
        displays:
          type: array
          items: { $ref: '#/components/schemas/ProviderDisplayDescriptor' }
    ProviderInputDescriptor:
      type: object
      required: [key, label, type, required, secret]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, secret, select, phone] }
        required: { type: boolean }
        pattern: { type: string }
        help: { type: string }
        example: { type: string }
        secret: { type: boolean }
        options: { type: array, items: { type: string } }
    ProviderDisplayDescriptor:
      type: object
      required: [key, label, copyable, sensitive]
      properties:
        key: { type: string }
        label: { type: string }
        value_template: { type: string }
        copyable: { type: boolean }
        sensitive: { type: boolean }
        help: { type: string }
    ChannelConnection:
      type: object
      required: [id, provider, provider_kind, status, capabilities, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, example: waha }
        provider_kind: { type: string, enum: [official, unofficial] }
        status: { type: string, enum: [pending, active, degraded, disconnected, failed, revoked] }
        session_status: { type: string, enum: [missing, starting, needs_qr, working, stopped, failed], description: 'Only on GET / start / stop' }
        external_account_id: { type: string, description: Paired account (digits) }
        capabilities: { type: array, items: { type: string } }
        risk_acknowledged_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    QRImage:
      type: object
      required: [mimetype, data]
      properties:
        mimetype: { type: string, example: image/png }
        data: { type: string, description: base64 }
    WahaWebhook:
      type: object
      required: [id, event, session, payload]
      properties:
        id: { type: string, description: 'Event id — deduplication key' }
        event: { type: string, enum: [message, message.any, message.ack, session.status] }
        session: { type: string, description: 'Must equal omnira_<connection_id>' }
        payload: { type: object, additionalProperties: true }
