openapi: 3.0.3
info:
  title: OMNIRA API
  version: 1.0.0-lab
  license: { name: Proprietary, url: 'https://omnira.devops.k3gsolutions.com.br' }
  description: |
    Inbox WhatsApp (unofficial provider WAHA) — REST, SSE and webhook contract.

    **Status: LAB.** Hand-authored from the implementation; `internal/platform/httpserver/contract_test.go`
    fails when a documented route and the server routes diverge. Field-level shapes are exercised by the
    Go integration tests and the browser e2e (`scripts/e2e-inbox.sh`).

    **Tenancy.** Every `/tenants/{tenant_id}/...` route requires a Bearer JWT and an *active membership* in
    that tenant. The tenant and the actor are derived from the token + membership, never trusted from a body.
    A tenant the caller cannot see and a nonexistent tenant/resource are indistinguishable: **404** (no enumeration).

    **Errors.** By default errors are `text/plain` bodies with the HTTP status (the web depends on that). A client that sends
    `Accept: application/vnd.omnira.v1+json` gets, for those same error responses, the stable envelope
    `{"error":{"code","message","request_id"}}` (`ErrorEnvelope`); `code` is derived from the status and is the stable part
    (`INVALID_REQUEST` 400, `UNAUTHENTICATED` 401, `FORBIDDEN` 403, `NOT_FOUND` 404, `METHOD_NOT_ALLOWED` 405, `CONFLICT` 409,
    `PAYLOAD_TOO_LARGE` 413, `UNPROCESSABLE` 422, `RATE_LIMITED` 429, `UNAVAILABLE` 502/503/504, `INTERNAL` other 5xx,
    `REJECTED` other 4xx); `message` is human text and may change. Every response carries `X-Request-ID` (the client's own id when it
    is 8-64 characters of `[A-Za-z0-9._-]`, otherwise generated). The login endpoint answers JSON `{error, message}`.

    **Authentication.** Production uses OIDC Authorization Code + PKCE and an HttpOnly session cookie. The fixed-user
    mock login remains available only when `OMNIRA_AUTH_MODE=mock` outside production.
servers:
  - url: /api/v1
    description: Same-origin (web nginx / vite proxy forward /api to the API)
tags:
  - name: Hub
    description: Service Hub delegated access (read-only slice, feature-flagged)
  - { name: Identity, description: "Verified channel identities of internal users (ADR-0018)" }
  - { name: Accounts, description: "Customer accounts (organizations) the tenant serves (ADR-0018)" }
  - { name: Auth, description: Mock login (development only) }
  - { name: Inbox, description: Conversations of the tenant }
  - { name: Groups, description: "Read-only WhatsApp groups an administrator enabled (ADR-0015)" }
  - { name: Assignment, description: "Claim, assign, release with atomic claim and audit" }
  - { name: Messages, description: Message history and idempotent outbound text }
  - { name: Realtime, description: SSE stream of reference-only events }
  - { name: Channels, description: "WhatsApp (WAHA) connections, sessions and pairing (admin)" }
  - { name: Webhooks, description: Provider callbacks (server-to-server) }
  - { name: Tenancy, description: "Tenant access: fixed platform roles (read-only) and the caller's effective permissions" }
  - { name: Agents, description: "Operational agents and queues (groups)" }
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  # POST /auth/dev/login existe apenas quando OMNIRA_DEV_AUTH_ENABLED=true num
  # ambiente de desenvolvimento, e por isso não faz parte do contrato público:
  # em staging e produção a rota não é registrada e responde 404. Ver
  # docs/reference-kits/omnira-ui-design/02-SCREENS/00-LOGIN-SSO.md.
  /auth/mode:
    get:
      operationId: getAuthenticationMode
      tags: [Auth]
      summary: Return the authentication the server actually offers
      description: |
        A tela de login usa isto para não oferecer um caminho que o servidor não atende.
        `oidc` é o modo de produção; `dev` só aparece quando o login de desenvolvimento está
        registrado; `unavailable` significa que nenhuma forma de entrar está configurada.
      security: []
      responses:
        '200':
          description: Authentication mode
          content:
            application/json:
              schema:
                type: object
                required: [mode]
                properties:
                  mode: { type: string, enum: [oidc, dev, unavailable] }
                  dev_auth:
                    type: boolean
                    description: Se o login de desenvolvimento está registrado neste servidor.
  /auth/oidc/start:
    get:
      operationId: startOIDCLogin
      tags: [Auth]
      summary: Start Authorization Code + PKCE login
      security: []
      responses:
        '302': { description: Redirect to the configured identity provider }
        '503': { description: Authentication unavailable, content: { text/plain: { schema: { type: string } } } }
  /auth/oidc/callback:
    get:
      operationId: finishOIDCLogin
      tags: [Auth]
      summary: Validate state, exchange the code and set the HttpOnly session cookie
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: Session established; redirect to the web app }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '502': { $ref: '#/components/responses/Text502' }
  /auth/session:
    get:
      operationId: getAuthenticationSession
      tags: [Auth]
      summary: Return the provisioned user and initial active Tenant for the browser session
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current session profile; no identity-provider token is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionProfile' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: End the app session and, when the identity provider has one, point to its logout
      description: |
        Revokes the server-side session and expires the cookie. When the identity provider advertises an end-session
        endpoint the answer is `200` with `end_session_url`, an address built only from server configuration (never from
        the request) that the browser must follow so the provider's own SSO session ends too; without that, the next
        login silently reuses the previous account. Otherwise `204`.
      security: []
      responses:
        '200':
          description: Session ended; follow end_session_url to end the identity provider session
          content:
            application/json:
              schema:
                type: object
                required: [end_session_url]
                properties:
                  end_session_url: { type: string, format: uri }
        '204': { description: Session cookie cleared (nothing to end at the provider) }
  /auth/mobile/token:
    post:
      operationId: mobileToken
      tags: [Auth]
      summary: Native app login - exchange an authorization code (Code + PKCE) for a device session
      description: |
        ADR-0022. Only served when `OMNIRA_AUTH_MOBILE_ENABLED=true` (404 otherwise). The app signs in with the identity provider in the system browser
        (client `omnira-mobile`, public, PKCE `S256`, `state` and `nonce` generated by the app and `state` compared by the app) and sends the
        resulting `code` here with its `code_verifier`, the exact `redirect_uri` it used (must be on the server allowlist) and the `nonce`. The SERVER
        exchanges the code, validates the ID Token (signature, issuer, audience and `azp` = the mobile client, expiry, nonce, provisioned identity) and
        returns an opaque device session; the ID Token never reaches the app. The plain tokens are shown once. Responses are `Cache-Control: no-store`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileTokenRequest' }
      responses:
        '200':
          description: Device session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileTokenResponse' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '429': { description: "Too many attempts from this address", content: { text/plain: { schema: { type: string } } } }
        '502': { $ref: '#/components/responses/Text502' }
  /auth/mobile/refresh:
    post:
      operationId: mobileRefresh
      tags: [Auth]
      summary: Rotate the refresh token (single use) and get a new access token
      description: |
        The refresh token is spent by this call. Presenting an already spent refresh token revokes the whole installation (reuse detection). The
        refresh lifetime slides by 30 days but never passes the 90-day absolute limit set at login. Every failure is the same `401`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              additionalProperties: false
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New device session tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MobileTokenResponse' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '429': { description: "Too many attempts from this address", content: { text/plain: { schema: { type: string } } } }
  /auth/mobile/logout:
    post:
      operationId: mobileLogout
      tags: [Auth]
      summary: End this installation immediately
      description: 'Authenticated by the access token (`Authorization: Bearer`) or, when it already expired, by a `refresh_token` in the body.'
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refresh_token: { type: string }
      responses:
        '204': { description: Installation revoked; its tokens stop working at once }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '429': { description: "Too many attempts from this address", content: { text/plain: { schema: { type: string } } } }
  /me/devices:
    get:
      operationId: listMyDevices
      tags: [Auth]
      summary: List the caller's own live app installations
      security:
        - deviceAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Installations (the one making the call has `current=true`)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceInfo' }
        '401': { $ref: '#/components/responses/Text401' }
  /me/devices/{device_id}:
    delete:
      operationId: revokeMyDevice
      tags: [Auth]
      summary: Revoke one of the caller's own app installations (its tokens stop working at once; open streams close)
      security:
        - deviceAuth: []
        - cookieAuth: []
      parameters:
        - { name: device_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Revoked }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/team/{membership_id}/devices:
    get:
      operationId: listTeamMemberDevices
      tags: [Auth]
      summary: List another member's app installations (administrator)
      description: |
        ADR-0022. Only served when native credentials are enabled. Needs `membership.manage` in this tenant AND in every tenant where the
        target is an active member (an installation spans all of the user's tenants); otherwise `403`. Own installations: use `/me/devices` (`422`).
      security:
        - deviceAuth: []
        - cookieAuth: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: membership_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Installations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceInfo' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/team/{membership_id}/devices/{device_id}:
    delete:
      operationId: revokeTeamMemberDevice
      tags: [Auth]
      summary: Revoke another member's app installation (administrator, audited as device.revoked_by_admin)
      security:
        - deviceAuth: []
        - cookieAuth: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: membership_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: device_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Revoked; its tokens stop working at once and open streams close }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants:
    get:
      operationId: listMyTenants
      tags: [Tenancy]
      summary: Tenants the signed-in user can switch to
      description: |
        The tenants in which the caller has an ACTIVE membership and which are themselves active, ordered by the name
        shown in the interface (trade name when present, otherwise legal name). It needs only the session, not a
        tenant: it is what the tenant selector reads. Revoked memberships, inactive or suspended tenants and tenants of
        other users never appear. Always an array (empty when the user has none).
      responses:
        '200':
          description: The usable tenants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MyTenant' }
        '401': { $ref: '#/components/responses/Text401' }
  /tenants/{tenant_id}/roles:
    get:
      operationId: listAssignableRoles
      tags: [Tenancy]
      summary: List the fixed platform roles a tenant can assign, with their permission sets (`membership.read`)
      description: |
        Read-only. System roles are fixed by the platform (tenant_admin, tenant_supervisor, tenant_agent);
        system_admin and hub_admin are never listed. There is no create/update/delete of roles.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200': { description: Assignable roles, content: { application/json: { schema: { $ref: '#/components/schemas/RoleList' } } } }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
  /tenants/{tenant_id}/me/access:
    get:
      operationId: getMyAccess
      tags: [Tenancy]
      summary: Effective role and permissions of the caller in this tenant
      description: The UI uses this to show/hide controls; the server remains the authority on every request.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200': { description: Caller access, content: { application/json: { schema: { $ref: '#/components/schemas/MyAccess' } } } }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/people:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
    get:
      operationId: listPeople
      tags: [Accounts]
      summary: 'Unified people directory (ADR-0018): external contacts and internal staff, discriminated by subject_type'
      description: |
        `subject_type=contact` rows are external people (classification, companies); `subject_type=internal_user` rows
        are staff (Users/Memberships): they have NO `kind` and are managed through `manage_path`, never classified.
        Staff are listed only for callers with `membership.read`: `view=internal` is 403 without it and `view=all` then
        returns the contacts part only. Keyset-paginated across both types by activity.
      parameters:
        - { name: view, in: query, required: false, schema: { type: string, enum: [all, customers, others, unclassified, spam, internal], default: all, description: '`internal` = staff Users (needs membership.read) plus contacts declared internal' } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, required: false, description: 'active|blocked|archived are contact states; active|inactive are membership states.', schema: { type: string, enum: [active, blocked, archived, inactive] } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: A page of people
          content:
            application/json:
              schema:
                type: object
                required: [items, has_more, count, limit]
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                        - { $ref: '#/components/schemas/PersonContact' }
                        - { $ref: '#/components/schemas/PersonInternalUser' }
                      discriminator: { propertyName: subject_type }
                  has_more: { type: boolean }
                  next_cursor: { type: string }
                  count: { type: integer }
                  limit: { type: integer }
        '400': { $ref: '#/components/responses/Text400' }
        '403': { $ref: '#/components/responses/Text403' }
  /tenants/{tenant_id}/contacts:
    get:
      operationId: listContacts
      tags: [Contacts]
      summary: List contacts (cursor pagination, most recently updated first)
      description: |
        Scoped to the session's tenant — the `tenant_id` path segment is routing sugar, the tenant comes from the
        established TenantContext. Ordering is `(updated_at DESC, id DESC)`, which the cursor walks, so paging is
        stable even when timestamps collide. The payload never echoes `tenant_id`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: sort
          in: query
          schema: { type: string, enum: ['updated_at:desc'] }
        - name: q
          in: query
          description: 'Name or e-mail (case-insensitive, `%` and `_` are literal); also the phone when the text looks like a phone number (digits, spaces, `+ - . ( )`). Max 100 chars.'
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [active, blocked, archived] }
        - name: kind
          in: query
          description: 'Classification (ADR-0014)'
          schema: { type: string, enum: [unclassified, customer, other, spam] }
      responses:
        '200':
          description: A page of contacts
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/contacts/{contact_id}:
    get:
      operationId: getContact
      tags: [Contacts]
      summary: Get one contact
      description: |
        A contact belonging to another tenant and an unknown id are indistinguishable (`404`), so the endpoint
        cannot be used to probe for ids that exist elsewhere.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ContactId' }
      responses:
        '200':
          description: The contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
    patch:
      operationId: setContactKind
      tags: [Contacts]
      summary: Classify a contact as unclassified, customer, internal, other or spam (staff are Users, never contacts; ADR-0018). `customer` needs a linked company and `internal` needs an `internal_role` (422 otherwise)
      description: |
        Requires `conversation.claim` (every attending role): spam arrives unassigned and whoever spots it must be able
        to flag it and to undo a false positive. Idempotent: the same kind answers `200` without a new audit event.
        Audited as `contact.kind_changed` with the previous kind, the new kind and `conversations_dequeued`. Marking
        `spam` also takes the contact's open, unassigned conversations out of their queue (conversations someone holds
        are untouched); restoring does not re-queue. Spam is never deleted: it has its own Inbox view (`kind=spam`).
        A contact of another tenant and an unknown id are indistinguishable (`404`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ContactId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetContactKindRequest' }
      responses:
        '200':
          description: The contact with its new kind
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/contacts/{contact_id}/conversations:
    get:
      operationId: listContactConversations
      tags: [Contacts]
      summary: List a contact's conversations (CONTACT.360-A)
      description: |
        Conversations of one contact, `(updated_at DESC, id DESC)`, each with its channel, message count and a
        truncated preview of the newest message. Any active member of the tenant may read it, the same visibility
        the Inbox gives. A contact of another tenant and an unknown id are indistinguishable (`404`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ContactId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: sort
          in: query
          schema: { type: string, enum: ['updated_at:desc'] }
      responses:
        '200':
          description: A page of the contact's conversations
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactConversationPage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/contacts/{contact_id}/tickets:
    get:
      operationId: listContactTickets
      tags: [Contacts]
      summary: List a contact's tickets (CONTACT.360-A)
      description: |
        Tickets of the contact's conversations, `(updated_at DESC, id DESC)`. Gated on `ticket.read` (from the
        role→permission matrix of an active membership); the permission is checked before the contact is resolved,
        so a caller without it gets the same `403` for any id. Only real tickets are returned: the implicit
        empty-subject ticket the inbound flow creates for every conversation is excluded, while a ticket linked to
        the ERP (`external_ticket_id`) is kept even if its local subject is empty.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ContactId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: sort
          in: query
          schema: { type: string, enum: ['updated_at:desc'] }
      responses:
        '200':
          description: A page of the contact's tickets
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactTicketPage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/queues:
    get:
      operationId: listQueues
      tags: [Agents]
      summary: List the tenant's queues ("groups")
      description: |
        Every queue of the tenant, the default first, then by name. Requires `agent.read`. The counts describe queue
        eligibility (members, members that are active and available) and open conversations; they are not presence.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: The queues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueList' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
    post:
      operationId: createQueue
      tags: [Agents]
      summary: Create a queue
      description: |
        Requires `agent.manage`. `mode` defaults to `manual`. With `is_default: true` the new queue becomes the one that
        routes new conversations and the previous default is cleared in the same transaction. Names are trimmed,
        1 to 60 characters, unique per tenant.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQueueRequest' }
      responses:
        '201':
          description: The created queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '409': { description: "A queue with this name already exists", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/groups:
    get:
      operationId: listGroups
      tags: [Groups]
      summary: Groups an administrator enabled, most recently active first
      description: |
        Requires `group.read` (tenant admin and supervisor by default). Only enabled groups are listed (at most 500).
        Each carries a preview of its last message. Groups are a separate area from conversations: no assignee, queue,
        waiting time or ticket (ADR-0015).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: The enabled groups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupList' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
    post:
      operationId: enableGroup
      tags: [Groups]
      summary: Start reading a WhatsApp group
      description: |
        Requires `group.manage`. The group must exist in the tenant's own WhatsApp account (its name comes from there).
        `201` when first enabled, `200` when it was already known (its history is kept). Audited as `group.enabled`.
        `409` when the tenant has no active WhatsApp connection or more than one; `502` when WhatsApp is unreachable.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnableGroupRequest' }
      responses:
        '200': { description: 'Already known, now enabled', content: { application/json: { schema: { $ref: '#/components/schemas/GroupItem' } } } }
        '201': { description: Newly enabled, content: { application/json: { schema: { $ref: '#/components/schemas/GroupItem' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "No active WhatsApp connection, or more than one", content: { text/plain: { schema: { type: string } } } }
        '502': { $ref: '#/components/responses/Text502' }
  /tenants/{tenant_id}/groups/available:
    get:
      operationId: listAvailableGroups
      tags: [Groups]
      summary: Groups of the tenant's WhatsApp account, to choose which ones to read
      description: |
        Requires `group.manage`. The provider's list is cached for a minute. `q` filters by name (case-insensitive),
        `limit` defaults to 50 (max 200); `total` is the number of matches before the cap. Enabled groups come first.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: Matching groups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailableGroupList' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '409': { description: "No active WhatsApp connection, or more than one", content: { text/plain: { schema: { type: string } } } }
        '502': { $ref: '#/components/responses/Text502' }
  /tenants/{tenant_id}/groups/{group_id}:
    patch:
      operationId: setGroupEnabled
      tags: [Groups]
      summary: Turn reading on or off for a known group
      description: |
        Requires `group.manage`. Off stops storing new messages; the history stays until it is deleted explicitly.
        Idempotent; audited as `group.enabled` / `group.disabled` only when the state changes. A group of another
        tenant and an unknown id are indistinguishable (`404`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/GroupId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetGroupEnabledRequest' }
      responses:
        '200': { description: The group, content: { application/json: { schema: { $ref: '#/components/schemas/GroupItem' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/groups/{group_id}/messages:
    get:
      operationId: listGroupMessages
      tags: [Groups]
      summary: A group's stored messages (cursor pagination, newest first)
      description: |
        Requires `group.read`. Read-only: there is no way to send to a group in this phase. A disabled group's history
        stays readable until deleted. `sort` accepts only `sent_at:desc`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/GroupId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: sort, in: query, schema: { type: string, enum: ['sent_at:desc'] } }
      responses:
        '200':
          description: A page of messages
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMessagePage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    delete:
      operationId: deleteGroupHistory
      tags: [Groups]
      summary: Delete every stored message of a group
      description: |
        Requires `group.manage`. Explicit and audited as `group.history_deleted` with the count. The group keeps its
        enabled state. Also asks the archive job to remove the group's archived files from the external disk (the API
        cannot reach it); backups already taken still contain the messages until they expire (7 days on the server,
        30 in the cloud, 35 on the external disk).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/GroupId' }
      responses:
        '200': { description: How many messages were deleted, content: { application/json: { schema: { type: object, required: [deleted], properties: { deleted: { type: integer, minimum: 0 } } } } } }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/settings/inbox:
    get:
      operationId: getInboxSettings
      tags: [Inbox]
      summary: Inbox display settings of the tenant
      description: |
        Requires `tenant.read` (every role has it): the Inbox needs the thresholds to colour the "customer is waiting"
        chip. They are display-only, not a contractual SLA.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: The thresholds, in minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxSettings' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    put:
      operationId: updateInboxSettings
      tags: [Inbox]
      summary: Change the Inbox display settings
      description: |
        Requires `tenant.manage` (tenant admin); the tenants row policy also allows only an admin to update. Both fields
        are required. `wait_warn_minutes >= 1`, `wait_danger_minutes > wait_warn_minutes` and `<= 10080` (`422` otherwise).
        Audited as `tenant.inbox_settings_updated` with the previous and new values.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxSettings' }
      responses:
        '200':
          description: The saved thresholds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxSettings' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: "Thresholds out of range or not increasing", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/queues/{queue_id}:
    patch:
      operationId: updateQueue
      tags: [Agents]
      summary: Rename a queue, change its mode, or make it the default
      description: |
        Requires `agent.manage`. At least one field. `is_default: true` switches the default atomically. The default
        cannot be unset (`409`): without a default queue new conversations are not routed, so choose another default
        instead. A queue of another tenant and an unknown id are indistinguishable (`404`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/QueueId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateQueueRequest' }
      responses:
        '200':
          description: The updated queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Name already in use, or an attempt to unset the default queue", content: { text/plain: { schema: { type: string } } } }
    delete:
      operationId: deleteQueue
      tags: [Agents]
      summary: Delete a queue
      description: |
        Requires `agent.manage`. Removes the queue and its member assignments. Refused with `409` for the default queue
        and for any queue that still holds conversations.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/QueueId' }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Default queue, or the queue still has conversations", content: { text/plain: { schema: { type: string } } } }
  /hubs:
    get:
      operationId: listMyHubs
      tags: [Hub]
      summary: The active Service Hubs the caller is a member of (read-only)
      description: |
        Behind the `OMNIRA_HUB_API_ENABLED` flag (unrouted otherwise, so a client treats 404 as "Hub not available").
        Membership grants no tenant access by itself; this only tells the UI whether to offer the Hub workspace and
        which hub to open. Never includes hubs the caller does not belong to.
      responses:
        '200':
          description: The caller's hubs (possibly empty)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubList' }
        '401': { $ref: '#/components/responses/Text401' }
  /hubs/{hub_id}/inbox:
    get:
      operationId: listHubInbox
      tags: [Hub]
      summary: The caller's authorized view of a Service Hub inbox (read-only, cursor pagination, newest first)
      description: |
        Behind the `OMNIRA_HUB_API_ENABLED` flag (off by default; unrouted otherwise). The caller must be an
        active member of an active hub. Which tenants and queues appear is decided by the server from the
        caller's live grants and service contracts (enforced again by PostgreSQL RLS); no tenant is ever
        chosen by the client, and a `tenant_id` query parameter is rejected with 400.
      parameters:
        - name: hub_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: companies
          in: query
          required: false
          description: |
            Comma-separated company ids (max 50). A screen filter that only NARROWS the caller's authorized view: a
            company the caller holds no live grant for stays invisible whatever is sent. Not a tenant selector
            (`tenant_id` is still refused). Invalid ids are a 400.
          schema: { type: string }
      responses:
        '200':
          description: A page of inbox items
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubInboxPage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /hubs/{hub_id}/inbox/{item_id}:
    get:
      operationId: openHubInboxItem
      tags: [Hub]
      summary: Open one Hub inbox item (conversation header and messages, read-only)
      description: |
        The item is addressed by its own id. The tenant and queue are read from the persisted item, then
        authorized against the caller's grant, service contract and queue scope before the conversation is
        loaded. A missing item, an item of a tenant the caller holds no live grant for, and a forged hub id are
        all answered with the same 404.
      parameters:
        - name: hub_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: item_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The item with its conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubInboxItemDetail' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /hubs/{hub_id}/inbox/{item_id}/claim:
    post:
      operationId: claimHubInboxItem
      tags: [Hub]
      summary: Take a Hub conversation (requires a reply-capable grant)
      description: |
        Authorized in the caller's own session (hub membership, live grant and contract, queue scope, `can_reply`), then
        executed by the server for the item's persisted tenant, re-checking the delegation inside the writing
        transaction. `expected_tenant_id` is the company the screen showed; it authorizes nothing and a mismatch is a 409.
        Idempotent for the holder; a conversation held by another agent is a 409. A read-only grant is a 403; a missing
        grant, forged hub or unknown item is the uniform 404.
      parameters:
        - { name: hub_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: item_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_tenant_id]
              properties: { expected_tenant_id: { type: string, format: uuid } }
      responses:
        '200':
          description: The conversation is the caller's
          content:
            application/json:
              schema:
                type: object
                required: [item_id, conversation_id, changed, tenant]
                properties:
                  item_id: { type: string, format: uuid }
                  conversation_id: { type: string, format: uuid }
                  changed: { type: boolean }
                  tenant:
                    type: object
                    required: [id, name]
                    properties: { id: { type: string, format: uuid }, name: { type: string } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { description: The grant is read-only for this company }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: Held by another agent, finalized, or the company on screen is not the item's company }
  /hubs/{hub_id}/inbox/{item_id}/messages:
    post:
      operationId: replyHubInboxItem
      tags: [Hub]
      summary: Answer a Hub conversation as the company it belongs to (text only)
      description: |
        Same authorization as claim, and the conversation must already be the caller's (claim first). The message is
        stored under the item's tenant with the caller as sender and queued through the normal delivery job; the 24 h
        window, channel readiness and finalization rules are the tenant inbox's. `Idempotency-Key` is required.
        The response names the company the server answered as.
      parameters:
        - { name: hub_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: item_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]{8,128}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_tenant_id, text]
              properties:
                expected_tenant_id: { type: string, format: uuid }
                text: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: Idempotent replay of an earlier identical request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubReplyResult' }
        '202':
          description: Queued for delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubReplyResult' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { description: The grant is read-only for this company }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: Not claimed, held by another agent, finalized, 24 h window closed, no channel, or company mismatch }
        '422': { description: Invalid text, or the Idempotency-Key was used with a different request }
  /hubs/{hub_id}/companies:
    get:
      operationId: listHubCompanies
      tags: [Hub]
      summary: The companies of a Hub with their status and capability switches (platform operator)
      description: |
        Behind `OMNIRA_HUB_ADMIN_API_ENABLED` (unrouted otherwise). Only an active platform operator who administers this
        hub gets an answer; everyone else, an unknown hub included, gets the uniform 404. Includes suspended companies.
      parameters:
        - { name: hub_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Companies and the closed list of capability switches
          content:
            application/json:
              schema:
                type: object
                required: [items, capabilities]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HubCompany' } }
                  capabilities: { type: array, items: { $ref: '#/components/schemas/HubCapability' } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
    post:
      operationId: createHubCompany
      tags: [Hub]
      summary: Create a company inside the Hub (platform operator)
      description: |
        Creates the tenant, its default queue and a contract with this hub (no agent gets access: grants are issued
        separately), and optionally its first administrator, who must already be an existing active user (exact e-mail).
        `Idempotency-Key` is required: a retry returns the same company (200); the same key with another body is a 422.
      parameters:
        - { name: hub_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [legal_name]
              properties:
                legal_name: { type: string, minLength: 2, maxLength: 200 }
                trade_name: { type: string, maxLength: 200 }
                tax_id: { type: string, maxLength: 32 }
                initial_admin_email: { type: string, maxLength: 254 }
      responses:
        '200':
          description: Idempotent replay
          content: { application/json: { schema: { $ref: '#/components/schemas/HubCompany' } } }
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/HubCompany' } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: Invalid input, unknown administrator, or the Idempotency-Key was used with a different request }
  /hubs/{hub_id}/companies/{tenant_id}:
    patch:
      operationId: updateHubCompany
      tags: [Hub]
      summary: Suspend or reactivate a company and switch its capabilities (platform operator)
      description: |
        `status` (active|suspended) and/or `capabilities` (known keys only), applied atomically and audited. Suspending
        stops the Hub and the company's own members from using it; nothing is deleted. The company must already have a
        contract with this hub, otherwise the uniform 404.
      parameters:
        - { name: hub_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [active, suspended] }
                capabilities: { type: object, additionalProperties: { type: boolean } }
                management_scopes: { type: array, items: { type: string, enum: [channels, integrations] }, description: 'Replaces the delegated management scopes; [] withdraws them all; absent = unchanged' }
      responses:
        '200':
          description: The company after the change
          content: { application/json: { schema: { $ref: '#/components/schemas/HubCompany' } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: Unknown capability or status, or nothing to change }
  /hubs/{hub_id}/managed:
    get:
      operationId: listHubManagedInstances
      tags: [Hub]
      summary: Instances of this hub the caller may manage, with the scopes they may use
      parameters:
        - { name: hub_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Possibly empty
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [tenant_id, name, scopes]
                      properties:
                        tenant_id: { type: string, format: uuid }
                        name: { type: string }
                        scopes: { type: array, items: { type: string, enum: [channels, integrations] } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
  /hubs/{hub_id}/access/agents/{user_id}/instances/{tenant_id}/management:
    put:
      operationId: setHubAgentManagement
      tags: [Hub]
      summary: Switch an agent's delegated management of one instance on or off (hub admin)
      description: Needs a live grant; never implied by `can_reply`. Matters only where the contract delegates a management scope. Revoking the grant clears it, and renewing access never revives it.
      parameters:
        - { name: hub_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [can_manage]
              properties:
                can_manage: { type: boolean }
      responses:
        '204': { description: Applied }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: No live grant for this person on this instance }
  /hubs/{hub_id}/instances/{tenant_id}/channels/providers:
    get:
      operationId: listHubManagedChannelProviders
      tags: [Hub]
      summary: Provider catalog for a managed instance
      description: |
        Hub-delegated MANAGEMENT (ADR-0038 phase 3). Same behaviour as the tenant route of the same name, reached by a person the
        contract delegates this scope to: a hub admin, or a grant with `can_manage`. Hub, contract, role/grant and scope are proven in
        the caller's own session and re-asked of the database for every permission; the row-level policies are the second barrier.
        Anything that does not hold (no such hub or instance, not a member, nothing delegated, suspended company) is the uniform 404;
        a provider whose scope is not delegated is a 403. Secrets are never returned.
      parameters:
        - { name: hub_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Provider catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProviderDescriptor' } }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /hubs/{hub_id}/instances/{tenant_id}/channels/connections:
    post:
      operationId: createHubManagedChannelConnection
      tags: [Hub]
      summary: Create a connection in a managed instance
      description: |
        Hub-delegated MANAGEMENT (ADR-0038 phase 3). Same behaviour as the tenant route of the same name, reached by a person the
        contract delegates this scope to: a hub admin, or a grant with `can_manage`. Hub, contract, role/grant and scope are proven in
        the caller's own session and re-asked of the database for every permission; the row-level policies are the second barrier.
        Anything that does not hold (no such hub or instance, not a member, nothing delegated, suspended company) is the uniform 404;
        a provider whose scope is not delegated is a 403. Secrets are never returned.
      parameters:
        - { name: hub_id, in: path, required: true, schema: { type: string, format: uuid } }
