          type: array
          items: { $ref: '#/components/schemas/AccountExternalLink' }
    AccountExternalLink:
      type: object
      required: [id, provider, connection_id, external_company_id, status, source]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        connection_id: { type: string, format: uuid }
        external_company_id: { type: string, description: 'Meaningful only together with provider and connection.' }
        external_name_snapshot: { type: string }
        status: { type: string, enum: [active, inactive] }
        source: { type: string, enum: [directory_selection, ticket_flow, crm_evidence, import] }
        verified_at: { type: string, format: date-time }
    TopicRestructure:
      type: object
      required: [messages_linked, group_messages_linked, entities_copied, tickets_linked, source_status]
      properties:
        messages_linked: { type: integer }
        group_messages_linked: { type: integer }
        entities_copied: { type: integer }
        tickets_linked: { type: integer }
        source_status: { type: string, enum: [open, archived] }
        new_topic: { $ref: '#/components/schemas/Topic' }
    AIToolView:
      type: object
      required: [name, description, risk, permission, ai_requires_approval]
      properties:
        name: { type: string }
        description: { type: string }
        risk: { type: string, enum: [read, low_write] }
        permission: { type: string }
        ai_requires_approval: { type: boolean }
    AIToolInvoke:
      type: object
      required: [tool, idempotency_key]
