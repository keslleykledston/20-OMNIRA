openapi: 3.0.3
info:
  title: OMNIRA API
  version: 1.0.0-lab
  license: { name: Proprietary, url: 'https://omnira.devops.k3gsolutions.com.br' }
  description: |
    Inbox WhatsApp (unofficial provider WAHA) — REST, SSE and webhook contract.

    **Status: LAB.** Hand-authored from the implementation; `internal/platform/httpserver/contract_test.go`
    fails when a documented route and the server routes diverge. Field-level shapes are exercised by the
    Go integration tests and the browser e2e (`scripts/e2e-inbox.sh`).

    **Tenancy.** Every `/tenants/{tenant_id}/...` route requires a Bearer JWT and an *active membership* in
    that tenant. The tenant and the actor are derived from the token + membership, never trusted from a body.
    A tenant the caller cannot see and a nonexistent tenant/resource are indistinguishable: **404** (no enumeration).

    **Errors.** Errors are currently `text/plain` bodies with the HTTP status (no RFC 7807 Problem Details yet —
    tracked in docs/delivery/ROADMAP-TO-GOAL.md). The login endpoint answers JSON `{error, message}`.

    **Authentication.** Production uses OIDC Authorization Code + PKCE and an HttpOnly session cookie. The fixed-user
    mock login remains available only when `OMNIRA_AUTH_MODE=mock` outside production.
servers:
  - url: /api/v1
    description: Same-origin (web nginx / vite proxy forward /api to the API)
tags:
  - { name: Auth, description: Mock login (development only) }
  - { name: Inbox, description: Conversations of the tenant }
  - { name: Groups, description: "Read-only WhatsApp groups an administrator enabled (ADR-0015)" }
  - { name: Assignment, description: "Claim, assign, release with atomic claim and audit" }
  - { name: Messages, description: Message history and idempotent outbound text }
  - { name: Realtime, description: SSE stream of reference-only events }
  - { name: Channels, description: "WhatsApp (WAHA) connections, sessions and pairing (admin)" }
  - { name: Webhooks, description: Provider callbacks (server-to-server) }
  - { name: Tenancy, description: "Tenant access: fixed platform roles (read-only) and the caller's effective permissions" }
  - { name: Agents, description: "Operational agents and queues (groups)" }
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  # POST /auth/dev/login existe apenas quando OMNIRA_DEV_AUTH_ENABLED=true num
  # ambiente de desenvolvimento, e por isso não faz parte do contrato público:
  # em staging e produção a rota não é registrada e responde 404. Ver
  # docs/reference-kits/omnira-ui-design/02-SCREENS/00-LOGIN-SSO.md.
  /auth/mode:
    get:
      operationId: getAuthenticationMode
      tags: [Auth]
      summary: Return the authentication the server actually offers
      description: |
        A tela de login usa isto para não oferecer um caminho que o servidor não atende.
        `oidc` é o modo de produção; `dev` só aparece quando o login de desenvolvimento está
        registrado; `unavailable` significa que nenhuma forma de entrar está configurada.
      security: []
      responses:
        '200':
          description: Authentication mode
          content:
            application/json:
              schema:
                type: object
                required: [mode]
                properties:
                  mode: { type: string, enum: [oidc, dev, unavailable] }
                  dev_auth:
                    type: boolean
                    description: Se o login de desenvolvimento está registrado neste servidor.
  /auth/oidc/start:
    get:
      operationId: startOIDCLogin
      tags: [Auth]
      summary: Start Authorization Code + PKCE login
      security: []
      responses:
        '302': { description: Redirect to the configured identity provider }
        '503': { description: Authentication unavailable, content: { text/plain: { schema: { type: string } } } }
  /auth/oidc/callback:
    get:
      operationId: finishOIDCLogin
      tags: [Auth]
      summary: Validate state, exchange the code and set the HttpOnly session cookie
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: Session established; redirect to the web app }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '502': { $ref: '#/components/responses/Text502' }
  /auth/session:
    get:
      operationId: getAuthenticationSession
      tags: [Auth]
      summary: Return the provisioned user and initial active Tenant for the browser session
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current session profile; no identity-provider token is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionProfile' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: End the app session and, when the identity provider has one, point to its logout
      description: |
        Revokes the server-side session and expires the cookie. When the identity provider advertises an end-session
        endpoint the answer is `200` with `end_session_url`, an address built only from server configuration (never from
        the request) that the browser must follow so the provider's own SSO session ends too; without that, the next
        login silently reuses the previous account. Otherwise `204`.
      security: []
      responses:
        '200':
          description: Session ended; follow end_session_url to end the identity provider session
          content:
            application/json:
              schema:
                type: object
                required: [end_session_url]
                properties:
                  end_session_url: { type: string, format: uri }
        '204': { description: Session cookie cleared (nothing to end at the provider) }
  /tenants:
    get:
      operationId: listMyTenants
      tags: [Tenancy]
      summary: Tenants the signed-in user can switch to
      description: |
        The tenants in which the caller has an ACTIVE membership and which are themselves active, ordered by the name
        shown in the interface (trade name when present, otherwise legal name). It needs only the session, not a
        tenant: it is what the tenant selector reads. Revoked memberships, inactive or suspended tenants and tenants of
        other users never appear. Always an array (empty when the user has none).
      responses:
        '200':
          description: The usable tenants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MyTenant' }
        '401': { $ref: '#/components/responses/Text401' }
  /tenants/{tenant_id}/roles:
    get:
      operationId: listAssignableRoles
      tags: [Tenancy]
      summary: List the fixed platform roles a tenant can assign, with their permission sets (`membership.read`)
      description: |
        Read-only. System roles are fixed by the platform (tenant_admin, tenant_supervisor, tenant_agent);
        system_admin and hub_admin are never listed. There is no create/update/delete of roles.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200': { description: Assignable roles, content: { application/json: { schema: { $ref: '#/components/schemas/RoleList' } } } }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
  /tenants/{tenant_id}/me/access:
    get:
      operationId: getMyAccess
      tags: [Tenancy]
      summary: Effective role and permissions of the caller in this tenant
      description: The UI uses this to show/hide controls; the server remains the authority on every request.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200': { description: Caller access, content: { application/json: { schema: { $ref: '#/components/schemas/MyAccess' } } } }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/contacts:
    get:
      operationId: listContacts
      tags: [Contacts]
      summary: List contacts (cursor pagination, most recently updated first)
      description: |
        Scoped to the session's tenant — the `tenant_id` path segment is routing sugar, the tenant comes from the
        established TenantContext. Ordering is `(updated_at DESC, id DESC)`, which the cursor walks, so paging is
        stable even when timestamps collide. The payload never echoes `tenant_id`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: sort
          in: query
          schema: { type: string, enum: ['updated_at:desc'] }
        - name: q
          in: query
          description: 'Name or e-mail (case-insensitive, `%` and `_` are literal); also the phone when the text looks like a phone number (digits, spaces, `+ - . ( )`). Max 100 chars.'
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [active, blocked, archived] }
        - name: kind
          in: query
          description: 'Classification (ADR-0014)'
          schema: { type: string, enum: [customer, other, spam] }
      responses:
        '200':
          description: A page of contacts
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/contacts/{contact_id}:
    get:
      operationId: getContact
      tags: [Contacts]
      summary: Get one contact
      description: |
        A contact belonging to another tenant and an unknown id are indistinguishable (`404`), so the endpoint
        cannot be used to probe for ids that exist elsewhere.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ContactId' }
      responses:
        '200':
          description: The contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
    patch:
      operationId: setContactKind
      tags: [Contacts]
      summary: Classify a contact as customer, other or spam
      description: |
        Requires `conversation.claim` (every attending role): spam arrives unassigned and whoever spots it must be able
        to flag it and to undo a false positive. Idempotent: the same kind answers `200` without a new audit event.
        Audited as `contact.kind_changed` with the previous kind, the new kind and `conversations_dequeued`. Marking
        `spam` also takes the contact's open, unassigned conversations out of their queue (conversations someone holds
        are untouched); restoring does not re-queue. Spam is never deleted: it has its own Inbox view (`kind=spam`).
        A contact of another tenant and an unknown id are indistinguishable (`404`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ContactId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetContactKindRequest' }
      responses:
        '200':
          description: The contact with its new kind
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/contacts/{contact_id}/conversations:
    get:
      operationId: listContactConversations
      tags: [Contacts]
      summary: List a contact's conversations (CONTACT.360-A)
      description: |
        Conversations of one contact, `(updated_at DESC, id DESC)`, each with its channel, message count and a
        truncated preview of the newest message. Any active member of the tenant may read it, the same visibility
        the Inbox gives. A contact of another tenant and an unknown id are indistinguishable (`404`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ContactId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: sort
          in: query
          schema: { type: string, enum: ['updated_at:desc'] }
      responses:
        '200':
          description: A page of the contact's conversations
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactConversationPage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/contacts/{contact_id}/tickets:
    get:
      operationId: listContactTickets
      tags: [Contacts]
      summary: List a contact's tickets (CONTACT.360-A)
      description: |
        Tickets of the contact's conversations, `(updated_at DESC, id DESC)`. Gated on `ticket.read` (from the
        role→permission matrix of an active membership); the permission is checked before the contact is resolved,
        so a caller without it gets the same `403` for any id. Only real tickets are returned: the implicit
        empty-subject ticket the inbound flow creates for every conversation is excluded, while a ticket linked to
        the ERP (`external_ticket_id`) is kept even if its local subject is empty.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ContactId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: sort
          in: query
          schema: { type: string, enum: ['updated_at:desc'] }
      responses:
        '200':
          description: A page of the contact's tickets
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactTicketPage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/queues:
    get:
      operationId: listQueues
      tags: [Agents]
      summary: List the tenant's queues ("groups")
      description: |
        Every queue of the tenant, the default first, then by name. Requires `agent.read`. The counts describe queue
        eligibility (members, members that are active and available) and open conversations; they are not presence.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: The queues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueList' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
    post:
      operationId: createQueue
      tags: [Agents]
      summary: Create a queue
      description: |
        Requires `agent.manage`. `mode` defaults to `manual`. With `is_default: true` the new queue becomes the one that
        routes new conversations and the previous default is cleared in the same transaction. Names are trimmed,
        1 to 60 characters, unique per tenant.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQueueRequest' }
      responses:
        '201':
          description: The created queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '409': { description: "A queue with this name already exists", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/groups:
    get:
      operationId: listGroups
      tags: [Groups]
      summary: Groups an administrator enabled, most recently active first
      description: |
        Requires `group.read` (tenant admin and supervisor by default). Only enabled groups are listed (at most 500).
        Each carries a preview of its last message. Groups are a separate area from conversations: no assignee, queue,
        waiting time or ticket (ADR-0015).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: The enabled groups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupList' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
    post:
      operationId: enableGroup
      tags: [Groups]
      summary: Start reading a WhatsApp group
      description: |
        Requires `group.manage`. The group must exist in the tenant's own WhatsApp account (its name comes from there).
        `201` when first enabled, `200` when it was already known (its history is kept). Audited as `group.enabled`.
        `409` when the tenant has no active WhatsApp connection or more than one; `502` when WhatsApp is unreachable.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnableGroupRequest' }
      responses:
        '200': { description: 'Already known, now enabled', content: { application/json: { schema: { $ref: '#/components/schemas/GroupItem' } } } }
        '201': { description: Newly enabled, content: { application/json: { schema: { $ref: '#/components/schemas/GroupItem' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "No active WhatsApp connection, or more than one", content: { text/plain: { schema: { type: string } } } }
        '502': { $ref: '#/components/responses/Text502' }
  /tenants/{tenant_id}/groups/available:
    get:
      operationId: listAvailableGroups
      tags: [Groups]
      summary: Groups of the tenant's WhatsApp account, to choose which ones to read
      description: |
        Requires `group.manage`. The provider's list is cached for a minute. `q` filters by name (case-insensitive),
        `limit` defaults to 50 (max 200); `total` is the number of matches before the cap. Enabled groups come first.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: Matching groups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailableGroupList' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '409': { description: "No active WhatsApp connection, or more than one", content: { text/plain: { schema: { type: string } } } }
        '502': { $ref: '#/components/responses/Text502' }
  /tenants/{tenant_id}/groups/{group_id}:
    patch:
      operationId: setGroupEnabled
      tags: [Groups]
      summary: Turn reading on or off for a known group
      description: |
        Requires `group.manage`. Off stops storing new messages; the history stays until it is deleted explicitly.
        Idempotent; audited as `group.enabled` / `group.disabled` only when the state changes. A group of another
        tenant and an unknown id are indistinguishable (`404`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/GroupId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetGroupEnabledRequest' }
      responses:
        '200': { description: The group, content: { application/json: { schema: { $ref: '#/components/schemas/GroupItem' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/groups/{group_id}/messages:
    get:
      operationId: listGroupMessages
      tags: [Groups]
      summary: A group's stored messages (cursor pagination, newest first)
      description: |
        Requires `group.read`. Read-only: there is no way to send to a group in this phase. A disabled group's history
        stays readable until deleted. `sort` accepts only `sent_at:desc`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/GroupId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: sort, in: query, schema: { type: string, enum: ['sent_at:desc'] } }
      responses:
        '200':
          description: A page of messages
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMessagePage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    delete:
      operationId: deleteGroupHistory
      tags: [Groups]
      summary: Delete every stored message of a group
      description: |
        Requires `group.manage`. Explicit and audited as `group.history_deleted` with the count. The group keeps its
        enabled state. Also asks the archive job to remove the group's archived files from the external disk (the API
        cannot reach it); backups already taken still contain the messages until they expire (7 days on the server,
        30 in the cloud, 35 on the external disk).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/GroupId' }
      responses:
        '200': { description: How many messages were deleted, content: { application/json: { schema: { type: object, required: [deleted], properties: { deleted: { type: integer, minimum: 0 } } } } } }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/settings/inbox:
    get:
      operationId: getInboxSettings
      tags: [Inbox]
      summary: Inbox display settings of the tenant
      description: |
        Requires `tenant.read` (every role has it): the Inbox needs the thresholds to colour the "customer is waiting"
        chip. They are display-only, not a contractual SLA.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: The thresholds, in minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxSettings' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    put:
      operationId: updateInboxSettings
      tags: [Inbox]
      summary: Change the Inbox display settings
      description: |
        Requires `tenant.manage` (tenant admin); the tenants row policy also allows only an admin to update. Both fields
        are required. `wait_warn_minutes >= 1`, `wait_danger_minutes > wait_warn_minutes` and `<= 10080` (`422` otherwise).
        Audited as `tenant.inbox_settings_updated` with the previous and new values.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxSettings' }
      responses:
        '200':
          description: The saved thresholds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxSettings' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: "Thresholds out of range or not increasing", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/queues/{queue_id}:
    patch:
      operationId: updateQueue
      tags: [Agents]
      summary: Rename a queue, change its mode, or make it the default
      description: |
        Requires `agent.manage`. At least one field. `is_default: true` switches the default atomically. The default
        cannot be unset (`409`): without a default queue new conversations are not routed, so choose another default
        instead. A queue of another tenant and an unknown id are indistinguishable (`404`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/QueueId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateQueueRequest' }
      responses:
        '200':
          description: The updated queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Name already in use, or an attempt to unset the default queue", content: { text/plain: { schema: { type: string } } } }
    delete:
      operationId: deleteQueue
      tags: [Agents]
      summary: Delete a queue
      description: |
        Requires `agent.manage`. Removes the queue and its member assignments. Refused with `409` for the default queue
        and for any queue that still holds conversations.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/QueueId' }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Default queue, or the queue still has conversations", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations:
    get:
      operationId: listConversations
      tags: [Inbox]
      summary: List conversations by last activity (cursor pagination, most recent first)
      description: Ordered by the last message (creation when there is none); page through with the cursor until has_more is false.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: sort
          in: query
          schema: { type: string, enum: ['last_activity:desc'] }
        - name: q
          in: query
          description: Contact name or phone (max 100 chars)
          schema: { type: string, maxLength: 100 }
        - name: assigned
          in: query
          description: Only conversations assigned to the caller
          schema: { type: string, enum: [me] }
        - name: waiting
          in: query
          description: Only conversations whose last message is from the customer
          schema: { type: boolean }
        - name: kind
          in: query
          description: 'Contact classification (ADR-0014). Omitted = customers and others (spam is kept but out of the default view); `spam` lists the spam conversations.'
          schema: { type: string, enum: [customer, other, spam] }
      responses:
        '200':
          description: A page of conversations
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}:
    get:
      operationId: getConversation
      tags: [Inbox]
      summary: Get one conversation
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/integrations/ai:
    get:
      operationId: getAIIntegration
      tags: [Tenants]
      summary: External AI integration of the organization (Gemini)
      description: |
        Requires `tenant.manage`. Off by default. The API key is write-only: it is never returned, only
        `key_configured` and when/who set it. Includes the exact consent text and its version.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIIntegration' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
    put:
      operationId: updateAIIntegration
      tags: [Tenants]
      summary: Update the external AI integration
      description: |
        Partial update. Switching `enabled` on requires a stored key and the current consent
        (`accept_external_ai: true` the first time or after the text version changes). Sending `api_key`
        replaces the stored key (encrypted at rest, AES-256-GCM). Audited without the key.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIIntegrationUpdate' }
      responses:
        '200':
          description: New state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIIntegration' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '422': { description: 'Invalid key format, model or budget, or enabling without key or consent' }
  /tenants/{tenant_id}/integrations/ai/key:
    delete:
      operationId: deleteAIIntegrationKey
      tags: [Tenants]
      summary: Remove the stored API key (also switches the integration off)
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: New state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIIntegration' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
  /tenants/{tenant_id}/integrations/ai/test:
    post:
      operationId: testAIIntegration
      tags: [Tenants]
      summary: Check the stored key against the provider
      description: |
        Calls the provider's model list server-side with the stored key (sent in a header) and reports a fixed,
        safe message. Never returns provider text. Throttled to one test per 3 seconds.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIIntegrationTest' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '409': { description: No key configured }
        '429': { description: Tested again too soon }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/topics:
    get:
      operationId: listConversationTopics
      tags: [Topics]
      summary: Topics (logical subjects) of a conversation
      description: Requires `topic.read`. A topic may span several conversations; open topics first, archived hidden.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200':
          description: The conversation's topics with message and ticket counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicList' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    post:
      operationId: createConversationTopic
      tags: [Topics]
      summary: Create a topic in a conversation
      description: |
        Requires `topic.manage` and being the conversation's attendant (or `conversation.manage`). The listed messages
        are linked to the new topic as primary, as an agent decision. Every id must belong to the tenant.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTopicRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: 'Invalid title, privacy policy or too many message ids' }
  /tenants/{tenant_id}/topics/{topic_id}:
    get:
      operationId: getTopic
      tags: [Topics]
      summary: A topic
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: The topic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    patch:
      operationId: updateTopic
      tags: [Topics]
      summary: Edit, resolve or reopen a topic
      description: '`status` accepts `resolved` or `open` only (archiving is not exposed). Resolving a resolved topic is a conflict.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTopicRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: Invalid status transition }
        '422': { description: Invalid field }
  /tenants/{tenant_id}/topics/{topic_id}/messages:
    get:
      operationId: listTopicMessages
      tags: [Topics]
      summary: The logical timeline of a topic (newest first)
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of the topic's messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicMessagePage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    post:
      operationId: linkTopicMessage
      tags: [Topics]
      summary: Add a message to a topic (agent decision)
      description: Idempotent. A decision by an agent or the customer is never overwritten by a lower-authority one.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message_id]
              properties:
                message_id: { type: string, format: uuid }
                relation: { type: string, enum: [primary, secondary, supporting, ambiguous] }
      responses:
        '204': { description: Linked }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: Invalid relation }
  /tenants/{tenant_id}/topics/{topic_id}/messages/{message_id}:
    delete:
      operationId: unlinkTopicMessage
      tags: [Topics]
      summary: Remove a message from a topic (the message itself stays in its conversation)
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/tickets:
    get:
      operationId: listTopicTickets
      tags: [Topics]
      summary: Tickets linked to a topic (primary first)
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: Linked tickets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicTicketList' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/tickets/link:
    post:
      operationId: linkTopicTicket
      tags: [Topics]
      summary: Link an existing ticket to a topic
      description: Never creates a ticket. A topic has at most one `primary` ticket (409 otherwise).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ticket_id]
              properties:
                ticket_id: { type: string, format: uuid }
                relation: { type: string, enum: [primary, related, child, merged] }
      responses:
        '204': { description: Linked }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: The topic already has a primary ticket }
        '422': { description: Invalid relation }
  /tenants/{tenant_id}/contacts/{contact_id}/topics:
    get:
      operationId: listContactTopics
      tags: [Topics]
      summary: Topics of a contact (active subjects across conversations)
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - name: contact_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, resolved, archived] }
      responses:
        '200':
          description: The contact's topics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicList' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
  /tenants/{tenant_id}/topics/{topic_id}/summaries:
    get:
      operationId: listTopicSummaries
      tags: [Topics]
      summary: Versioned summaries of a topic
      description: 'Newest version first. History is never rewritten; superseded versions stay readable.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/TopicSummary' } } } }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/summary/generate:
    post:
      operationId: generateTopicSummary
      tags: [Topics]
      summary: Generate a machine summary of the topic now
      description: 'Returns 201 with a new version, or 200 with the existing one when nothing new happened. 503 when no summarizer is configured or the provider failed; 422 when the topic has no messages.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicSummary' }
        '201':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicSummary' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/summary/confirm:
    post:
      operationId: confirmTopicSummary
      tags: [Topics]
      summary: Confirm the current summary as an agent
      description: 'Never lowers authority; a corrected or superseded version cannot be confirmed (409).'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicSummary' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/summary/correct:
    post:
      operationId: correctTopicSummary
      tags: [Topics]
      summary: Replace the summary with the agent text (new version)
      description: 'Creates a NEW corrected version; the previous one is superseded but kept. Later machine summaries never replace it.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [summary_text], additionalProperties: false, properties: { summary_text: { type: string, maxLength: 4000 } } }
      responses:
        '201':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicSummary' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/ambiguities:
    get:
      operationId: listConversationAmbiguities
      tags: [Topics]
      summary: Messages of a conversation the router could not place with enough confidence
      description: Requires `topic.read`. Each item lists the candidate topics with their score and evidence; a person resolves it.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200':
          description: Open ambiguities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AmbiguityList' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/ambiguities/{ambiguity_id}/resolve:
    post:
      operationId: resolveAmbiguity
      tags: [Topics]
      summary: Decide which topic an ambiguous message belongs to
      description: |
        Give an existing `topic_id` OR a `new_topic_title` (not both). The message joins the topic as an agent decision, which
        no later automated decision can overwrite. Requires `topic.manage` and being the conversation's attendant (or
        `conversation.manage`); for a group message, `group.manage`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - name: ambiguity_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                topic_id: { type: string, format: uuid }
                new_topic_title: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: The topic the message now belongs to
          content:
            application/json:
              schema:
                type: object
                required: [topic_id]
                properties:
                  topic_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: The ambiguity was already resolved }
        '422': { description: 'Neither or both of topic_id and new_topic_title, or an invalid title' }
  /tenants/{tenant_id}/messages/{message_id}/media:
    get:
      operationId: getMessageMedia
      tags: [Messages]
      summary: Download a message's attachment
      description: |
        Serves the file only after the antivirus cleared it (ADR-0016). Raster images, audio and video are
        returned inline with `Range` support; everything else (PDF, text) is always an attachment. Every
        response carries `X-Content-Type-Options: nosniff` and a sandboxing `Content-Security-Policy`. Images and
        audio are cacheable by the caller's browser only (`Cache-Control: private, max-age=86400`, revalidated by
        `ETag`); video and documents are `private, no-store`. `X-Media-Status` tells why a file is not available.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: The cleared file }
        '206': { description: A byte range of the cleared file }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { description: 'Blocked for security reasons: infected, rejected type or failed check' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: The file is still being checked }
        '410': { description: 'The file is no longer available: the provider deleted it before capture, or retention removed it' }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/messages:
    get:
      operationId: listMessages
      tags: [Messages]
      summary: List a conversation's messages
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of messages
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
    post:
      operationId: sendMessage
      tags: [Messages]
      summary: Queue an outbound text message
      description: |
        Persists the message (`queued`) and its delivery job atomically; the worker delivers it through the
        conversation's channel. Requires permission `conversation.claim` **and** being the conversation's assignee
        (or `conversation.manage`). Idempotent per (tenant, sender, `Idempotency-Key`): a retry with the same key
        and body returns the original message (`200` + `Idempotent-Replayed: true`); the same key with a different
        body is `422`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
        - name: Idempotency-Key
          in: header
          required: true
          description: 8-128 characters of `[A-Za-z0-9._:-]`
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuedMessage' }
        '200':
          description: Idempotent replay of an earlier request
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuedMessage' }
        '400': { description: "Malformed body or invalid Idempotency-Key", content: { text/plain: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { description: "Missing permission or conversation assigned to another agent", content: { text/plain: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Conversation is unassigned, or has no active text channel", content: { text/plain: { schema: { type: string } } } }
        '422': { description: "Blank/too long text (max 4096 characters) or key reused with a different request", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/assign:
    post:
      operationId: assignConversation
      tags: [Assignment]
      summary: Assign the conversation (claim for yourself, or assign to another agent)
      description: |
        Without a body: atomically claim an unassigned conversation for the caller (`conversation.claim`); if it is
        already yours the call is an idempotent no-op (`changed:false`); owned by someone else → `409` (of two
        simultaneous claimers exactly one wins). With `assignee_user_id`: assign to another agent
        (`conversation.manage`); the target must hold `conversation.claim` in this tenant (else `422`).
        History (`assignment_events`) and audit (`conversation.assigned`) are written in the same transaction.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRequest' }
      responses:
        '200': { $ref: '#/components/responses/AssignResult' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Already assigned to another agent", content: { text/plain: { schema: { type: string } } } }
        '422': { description: "Assignee is not an eligible agent of this tenant", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/unassign:
    post:
      operationId: unassignConversation
      tags: [Assignment]
      summary: Release the conversation
      description: |
        Releasing your own needs `conversation.claim`; releasing someone else's needs `conversation.manage`.
        Unassigning an already-unassigned conversation is an idempotent no-op (`changed:false`).
        Audit `conversation.unassigned`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200': { $ref: '#/components/responses/AssignResult' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/invite:
    post:
      operationId: inviteParticipant
      tags: [Co-attendance]
      summary: Invite another agent to co-attend the conversation
      description: |
        Creates a pending invitation (`INVITED`) for `target_user_id`. The target must be an eligible agent of this
        tenant (else `422`). Re-inviting an already invited or active participant is an idempotent no-op
        (`changed:false`). Audit `participant.invited`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantTargetRequest' }
      responses:
        '201':
          description: "Invitation registered"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteResult' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Conflicting participant state", content: { text/plain: { schema: { type: string } } } }
        '422': { description: "Target is not an eligible agent of this tenant", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/transfer:
    post:
      operationId: transferConversation
      tags: [Co-attendance]
      summary: Transfer the conversation to another agent
      description: |
        Moves ownership to `target_user_id`. The target must be an eligible agent of this tenant (else `422`).
        Transferring to the current assignee is an idempotent no-op (`changed:false`).
        Audit `conversation.transferred`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantTargetRequest' }
      responses:
        '200':
          description: "Transfer applied"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResult' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Conflicting participant state", content: { text/plain: { schema: { type: string } } } }
        '422': { description: "Target is not an eligible agent of this tenant", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/accept-invite:
    post:
      operationId: acceptParticipantInvite
      tags: [Co-attendance]
      summary: Accept a pending co-attendance invitation
      description: |
        The caller accepts their own pending invitation and becomes an active co-attendee.
        Only invitations in `INVITED` state can be accepted (else `409`). Audit `participant.accepted`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '201':
          description: "Invitation accepted"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptInviteResult' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Only pending invitations can be accepted", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/reject-invite:
    post:
      operationId: rejectParticipantInvite
      tags: [Co-attendance]
      summary: Reject a pending co-attendance invitation
      description: |
        The caller declines their own pending invitation. Only invitations in `INVITED` state can be rejected
