openapi: 3.0.3
info:
  title: OMNIRA API
  version: 1.0.0-lab
  license: { name: Proprietary, url: 'https://omnira.devops.k3gsolutions.com.br' }
  description: |
    Inbox WhatsApp (unofficial provider WAHA) — REST, SSE and webhook contract.

    **Status: LAB.** Hand-authored from the implementation; `internal/platform/httpserver/contract_test.go`
    fails when a documented route and the server routes diverge. Field-level shapes are exercised by the
    Go integration tests and the browser e2e (`scripts/e2e-inbox.sh`).

    **Tenancy.** Every `/tenants/{tenant_id}/...` route requires a Bearer JWT and an *active membership* in
    that tenant. The tenant and the actor are derived from the token + membership, never trusted from a body.
    A tenant the caller cannot see and a nonexistent tenant/resource are indistinguishable: **404** (no enumeration).

    **Errors.** By default errors are `text/plain` bodies with the HTTP status (the web depends on that). A client that sends
    `Accept: application/vnd.omnira.v1+json` gets, for those same error responses, the stable envelope
    `{"error":{"code","message","request_id"}}` (`ErrorEnvelope`); `code` is derived from the status and is the stable part
    (`INVALID_REQUEST` 400, `UNAUTHENTICATED` 401, `FORBIDDEN` 403, `NOT_FOUND` 404, `METHOD_NOT_ALLOWED` 405, `CONFLICT` 409,
    `PAYLOAD_TOO_LARGE` 413, `UNPROCESSABLE` 422, `RATE_LIMITED` 429, `UNAVAILABLE` 502/503/504, `INTERNAL` other 5xx,
    `REJECTED` other 4xx); `message` is human text and may change. Every response carries `X-Request-ID` (the client's own id when it
    is 8-64 characters of `[A-Za-z0-9._-]`, otherwise generated). The login endpoint answers JSON `{error, message}`.

    **Authentication.** Production uses OIDC Authorization Code + PKCE and an HttpOnly session cookie. The fixed-user
    mock login remains available only when `OMNIRA_AUTH_MODE=mock` outside production.
servers:
  - url: /api/v1
    description: Same-origin (web nginx / vite proxy forward /api to the API)
tags:
  - { name: Identity, description: "Verified channel identities of internal users (ADR-0018)" }
  - { name: Accounts, description: "Customer accounts (organizations) the tenant serves (ADR-0018)" }
  - { name: Auth, description: Mock login (development only) }
  - { name: Inbox, description: Conversations of the tenant }
  - { name: Groups, description: "Read-only WhatsApp groups an administrator enabled (ADR-0015)" }
  - { name: Assignment, description: "Claim, assign, release with atomic claim and audit" }
  - { name: Messages, description: Message history and idempotent outbound text }
  - { name: Realtime, description: SSE stream of reference-only events }
  - { name: Channels, description: "WhatsApp (WAHA) connections, sessions and pairing (admin)" }
  - { name: Webhooks, description: Provider callbacks (server-to-server) }
  - { name: Tenancy, description: "Tenant access: fixed platform roles (read-only) and the caller's effective permissions" }
  - { name: Agents, description: "Operational agents and queues (groups)" }
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  # POST /auth/dev/login existe apenas quando OMNIRA_DEV_AUTH_ENABLED=true num
  # ambiente de desenvolvimento, e por isso não faz parte do contrato público:
  # em staging e produção a rota não é registrada e responde 404. Ver
  # docs/reference-kits/omnira-ui-design/02-SCREENS/00-LOGIN-SSO.md.
  /auth/mode:
    get:
      operationId: getAuthenticationMode
      tags: [Auth]
      summary: Return the authentication the server actually offers
      description: |
        A tela de login usa isto para não oferecer um caminho que o servidor não atende.
        `oidc` é o modo de produção; `dev` só aparece quando o login de desenvolvimento está
        registrado; `unavailable` significa que nenhuma forma de entrar está configurada.
      security: []
      responses:
        '200':
          description: Authentication mode
          content:
            application/json:
              schema:
                type: object
                required: [mode]
                properties:
                  mode: { type: string, enum: [oidc, dev, unavailable] }
                  dev_auth:
                    type: boolean
                    description: Se o login de desenvolvimento está registrado neste servidor.
  /auth/oidc/start:
    get:
      operationId: startOIDCLogin
      tags: [Auth]
      summary: Start Authorization Code + PKCE login
      security: []
      responses:
        '302': { description: Redirect to the configured identity provider }
        '503': { description: Authentication unavailable, content: { text/plain: { schema: { type: string } } } }
  /auth/oidc/callback:
    get:
      operationId: finishOIDCLogin
      tags: [Auth]
      summary: Validate state, exchange the code and set the HttpOnly session cookie
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: Session established; redirect to the web app }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '502': { $ref: '#/components/responses/Text502' }
  /auth/session:
    get:
      operationId: getAuthenticationSession
      tags: [Auth]
      summary: Return the provisioned user and initial active Tenant for the browser session
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current session profile; no identity-provider token is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionProfile' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: End the app session and, when the identity provider has one, point to its logout
      description: |
        Revokes the server-side session and expires the cookie. When the identity provider advertises an end-session
        endpoint the answer is `200` with `end_session_url`, an address built only from server configuration (never from
        the request) that the browser must follow so the provider's own SSO session ends too; without that, the next
        login silently reuses the previous account. Otherwise `204`.
      security: []
      responses:
        '200':
          description: Session ended; follow end_session_url to end the identity provider session
          content:
            application/json:
              schema:
                type: object
                required: [end_session_url]
                properties:
                  end_session_url: { type: string, format: uri }
        '204': { description: Session cookie cleared (nothing to end at the provider) }
  /tenants:
    get:
      operationId: listMyTenants
      tags: [Tenancy]
      summary: Tenants the signed-in user can switch to
      description: |
        The tenants in which the caller has an ACTIVE membership and which are themselves active, ordered by the name
        shown in the interface (trade name when present, otherwise legal name). It needs only the session, not a
        tenant: it is what the tenant selector reads. Revoked memberships, inactive or suspended tenants and tenants of
        other users never appear. Always an array (empty when the user has none).
      responses:
        '200':
          description: The usable tenants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MyTenant' }
        '401': { $ref: '#/components/responses/Text401' }
  /tenants/{tenant_id}/roles:
    get:
      operationId: listAssignableRoles
      tags: [Tenancy]
      summary: List the fixed platform roles a tenant can assign, with their permission sets (`membership.read`)
      description: |
        Read-only. System roles are fixed by the platform (tenant_admin, tenant_supervisor, tenant_agent);
        system_admin and hub_admin are never listed. There is no create/update/delete of roles.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200': { description: Assignable roles, content: { application/json: { schema: { $ref: '#/components/schemas/RoleList' } } } }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
  /tenants/{tenant_id}/me/access:
    get:
      operationId: getMyAccess
      tags: [Tenancy]
      summary: Effective role and permissions of the caller in this tenant
      description: The UI uses this to show/hide controls; the server remains the authority on every request.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200': { description: Caller access, content: { application/json: { schema: { $ref: '#/components/schemas/MyAccess' } } } }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/people:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
    get:
      operationId: listPeople
      tags: [Accounts]
      summary: 'Unified people directory (ADR-0018): external contacts and internal staff, discriminated by subject_type'
      description: |
        `subject_type=contact` rows are external people (classification, companies); `subject_type=internal_user` rows
        are staff (Users/Memberships): they have NO `kind` and are managed through `manage_path`, never classified.
        Staff are listed only for callers with `membership.read`: `view=internal` is 403 without it and `view=all` then
        returns the contacts part only. Keyset-paginated across both types by activity.
      parameters:
        - { name: view, in: query, required: false, schema: { type: string, enum: [all, customers, others, unclassified, spam, internal], default: all } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, required: false, description: 'active|blocked|archived are contact states; active|inactive are membership states.', schema: { type: string, enum: [active, blocked, archived, inactive] } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: A page of people
          content:
            application/json:
              schema:
                type: object
                required: [items, has_more, count, limit]
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                        - { $ref: '#/components/schemas/PersonContact' }
                        - { $ref: '#/components/schemas/PersonInternalUser' }
                      discriminator: { propertyName: subject_type }
                  has_more: { type: boolean }
                  next_cursor: { type: string }
                  count: { type: integer }
                  limit: { type: integer }
        '400': { $ref: '#/components/responses/Text400' }
        '403': { $ref: '#/components/responses/Text403' }
  /tenants/{tenant_id}/contacts:
    get:
      operationId: listContacts
      tags: [Contacts]
      summary: List contacts (cursor pagination, most recently updated first)
      description: |
        Scoped to the session's tenant — the `tenant_id` path segment is routing sugar, the tenant comes from the
        established TenantContext. Ordering is `(updated_at DESC, id DESC)`, which the cursor walks, so paging is
        stable even when timestamps collide. The payload never echoes `tenant_id`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: sort
          in: query
          schema: { type: string, enum: ['updated_at:desc'] }
        - name: q
          in: query
          description: 'Name or e-mail (case-insensitive, `%` and `_` are literal); also the phone when the text looks like a phone number (digits, spaces, `+ - . ( )`). Max 100 chars.'
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [active, blocked, archived] }
        - name: kind
          in: query
          description: 'Classification (ADR-0014)'
          schema: { type: string, enum: [unclassified, customer, other, spam] }
      responses:
        '200':
          description: A page of contacts
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/contacts/{contact_id}:
    get:
      operationId: getContact
      tags: [Contacts]
      summary: Get one contact
      description: |
        A contact belonging to another tenant and an unknown id are indistinguishable (`404`), so the endpoint
        cannot be used to probe for ids that exist elsewhere.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ContactId' }
      responses:
        '200':
          description: The contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
    patch:
      operationId: setContactKind
      tags: [Contacts]
      summary: Classify a contact as unclassified, customer, other or spam (staff are Users, never contacts; ADR-0018). `customer` needs a linked company (422 otherwise)
      description: |
        Requires `conversation.claim` (every attending role): spam arrives unassigned and whoever spots it must be able
        to flag it and to undo a false positive. Idempotent: the same kind answers `200` without a new audit event.
        Audited as `contact.kind_changed` with the previous kind, the new kind and `conversations_dequeued`. Marking
        `spam` also takes the contact's open, unassigned conversations out of their queue (conversations someone holds
        are untouched); restoring does not re-queue. Spam is never deleted: it has its own Inbox view (`kind=spam`).
        A contact of another tenant and an unknown id are indistinguishable (`404`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ContactId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetContactKindRequest' }
      responses:
        '200':
          description: The contact with its new kind
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/contacts/{contact_id}/conversations:
    get:
      operationId: listContactConversations
      tags: [Contacts]
      summary: List a contact's conversations (CONTACT.360-A)
      description: |
        Conversations of one contact, `(updated_at DESC, id DESC)`, each with its channel, message count and a
        truncated preview of the newest message. Any active member of the tenant may read it, the same visibility
        the Inbox gives. A contact of another tenant and an unknown id are indistinguishable (`404`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ContactId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: sort
          in: query
          schema: { type: string, enum: ['updated_at:desc'] }
      responses:
        '200':
          description: A page of the contact's conversations
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactConversationPage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/contacts/{contact_id}/tickets:
    get:
      operationId: listContactTickets
      tags: [Contacts]
      summary: List a contact's tickets (CONTACT.360-A)
      description: |
        Tickets of the contact's conversations, `(updated_at DESC, id DESC)`. Gated on `ticket.read` (from the
        role→permission matrix of an active membership); the permission is checked before the contact is resolved,
        so a caller without it gets the same `403` for any id. Only real tickets are returned: the implicit
        empty-subject ticket the inbound flow creates for every conversation is excluded, while a ticket linked to
        the ERP (`external_ticket_id`) is kept even if its local subject is empty.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ContactId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: sort
          in: query
          schema: { type: string, enum: ['updated_at:desc'] }
      responses:
        '200':
          description: A page of the contact's tickets
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactTicketPage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/queues:
    get:
      operationId: listQueues
      tags: [Agents]
      summary: List the tenant's queues ("groups")
      description: |
        Every queue of the tenant, the default first, then by name. Requires `agent.read`. The counts describe queue
        eligibility (members, members that are active and available) and open conversations; they are not presence.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: The queues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueList' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
    post:
      operationId: createQueue
      tags: [Agents]
      summary: Create a queue
      description: |
        Requires `agent.manage`. `mode` defaults to `manual`. With `is_default: true` the new queue becomes the one that
        routes new conversations and the previous default is cleared in the same transaction. Names are trimmed,
        1 to 60 characters, unique per tenant.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQueueRequest' }
      responses:
        '201':
          description: The created queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '409': { description: "A queue with this name already exists", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/groups:
    get:
      operationId: listGroups
      tags: [Groups]
      summary: Groups an administrator enabled, most recently active first
      description: |
        Requires `group.read` (tenant admin and supervisor by default). Only enabled groups are listed (at most 500).
        Each carries a preview of its last message. Groups are a separate area from conversations: no assignee, queue,
        waiting time or ticket (ADR-0015).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: The enabled groups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupList' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
    post:
      operationId: enableGroup
      tags: [Groups]
      summary: Start reading a WhatsApp group
      description: |
        Requires `group.manage`. The group must exist in the tenant's own WhatsApp account (its name comes from there).
        `201` when first enabled, `200` when it was already known (its history is kept). Audited as `group.enabled`.
        `409` when the tenant has no active WhatsApp connection or more than one; `502` when WhatsApp is unreachable.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnableGroupRequest' }
      responses:
        '200': { description: 'Already known, now enabled', content: { application/json: { schema: { $ref: '#/components/schemas/GroupItem' } } } }
        '201': { description: Newly enabled, content: { application/json: { schema: { $ref: '#/components/schemas/GroupItem' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "No active WhatsApp connection, or more than one", content: { text/plain: { schema: { type: string } } } }
        '502': { $ref: '#/components/responses/Text502' }
  /tenants/{tenant_id}/groups/available:
    get:
      operationId: listAvailableGroups
      tags: [Groups]
      summary: Groups of the tenant's WhatsApp account, to choose which ones to read
      description: |
        Requires `group.manage`. The provider's list is cached for a minute. `q` filters by name (case-insensitive),
        `limit` defaults to 50 (max 200); `total` is the number of matches before the cap. Enabled groups come first.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: Matching groups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailableGroupList' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '409': { description: "No active WhatsApp connection, or more than one", content: { text/plain: { schema: { type: string } } } }
        '502': { $ref: '#/components/responses/Text502' }
  /tenants/{tenant_id}/groups/{group_id}:
    patch:
      operationId: setGroupEnabled
      tags: [Groups]
      summary: Turn reading on or off for a known group
      description: |
        Requires `group.manage`. Off stops storing new messages; the history stays until it is deleted explicitly.
        Idempotent; audited as `group.enabled` / `group.disabled` only when the state changes. A group of another
        tenant and an unknown id are indistinguishable (`404`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/GroupId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetGroupEnabledRequest' }
      responses:
        '200': { description: The group, content: { application/json: { schema: { $ref: '#/components/schemas/GroupItem' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/groups/{group_id}/messages:
    get:
      operationId: listGroupMessages
      tags: [Groups]
      summary: A group's stored messages (cursor pagination, newest first)
      description: |
        Requires `group.read`. Read-only: there is no way to send to a group in this phase. A disabled group's history
        stays readable until deleted. `sort` accepts only `sent_at:desc`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/GroupId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: sort, in: query, schema: { type: string, enum: ['sent_at:desc'] } }
      responses:
        '200':
          description: A page of messages
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMessagePage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    delete:
      operationId: deleteGroupHistory
      tags: [Groups]
      summary: Delete every stored message of a group
      description: |
        Requires `group.manage`. Explicit and audited as `group.history_deleted` with the count. The group keeps its
        enabled state. Also asks the archive job to remove the group's archived files from the external disk (the API
        cannot reach it); backups already taken still contain the messages until they expire (7 days on the server,
        30 in the cloud, 35 on the external disk).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/GroupId' }
      responses:
        '200': { description: How many messages were deleted, content: { application/json: { schema: { type: object, required: [deleted], properties: { deleted: { type: integer, minimum: 0 } } } } } }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/settings/inbox:
    get:
      operationId: getInboxSettings
      tags: [Inbox]
      summary: Inbox display settings of the tenant
      description: |
        Requires `tenant.read` (every role has it): the Inbox needs the thresholds to colour the "customer is waiting"
        chip. They are display-only, not a contractual SLA.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: The thresholds, in minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxSettings' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    put:
      operationId: updateInboxSettings
      tags: [Inbox]
      summary: Change the Inbox display settings
      description: |
        Requires `tenant.manage` (tenant admin); the tenants row policy also allows only an admin to update. Both fields
        are required. `wait_warn_minutes >= 1`, `wait_danger_minutes > wait_warn_minutes` and `<= 10080` (`422` otherwise).
        Audited as `tenant.inbox_settings_updated` with the previous and new values.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxSettings' }
      responses:
        '200':
          description: The saved thresholds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxSettings' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: "Thresholds out of range or not increasing", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/queues/{queue_id}:
    patch:
      operationId: updateQueue
      tags: [Agents]
      summary: Rename a queue, change its mode, or make it the default
      description: |
        Requires `agent.manage`. At least one field. `is_default: true` switches the default atomically. The default
        cannot be unset (`409`): without a default queue new conversations are not routed, so choose another default
        instead. A queue of another tenant and an unknown id are indistinguishable (`404`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/QueueId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateQueueRequest' }
      responses:
        '200':
          description: The updated queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Name already in use, or an attempt to unset the default queue", content: { text/plain: { schema: { type: string } } } }
    delete:
      operationId: deleteQueue
      tags: [Agents]
      summary: Delete a queue
      description: |
        Requires `agent.manage`. Removes the queue and its member assignments. Refused with `409` for the default queue
        and for any queue that still holds conversations.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/QueueId' }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Default queue, or the queue still has conversations", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations:
    get:
      operationId: listConversations
      tags: [Inbox]
      summary: List conversations by last activity (cursor pagination, most recent first)
      description: Ordered by the last message (creation when there is none); page through with the cursor until has_more is false.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: sort
          in: query
          schema: { type: string, enum: ['last_activity:desc'] }
        - name: q
          in: query
          description: Contact name or phone (max 100 chars)
          schema: { type: string, maxLength: 100 }
        - name: assigned
          in: query
          description: Only conversations assigned to the caller
          schema: { type: string, enum: [me] }
        - name: waiting
          in: query
          description: Only conversations whose last message is from the customer
          schema: { type: boolean }
        - name: kind
          in: query
          description: 'Contact classification (ADR-0014). Omitted = every classification except spam (kept, but out of the default view); `spam` lists the spam conversations.'
          schema: { type: string, enum: [unclassified, customer, other, spam] }
        - name: conversation_kind
          in: query
          description: 'ADR-0018. Omitted = every kind except `internal` (conversations with staff are kept but are not attendance); ask for `internal` explicitly.'
          schema: { type: string, enum: [internal, customer_service, external_other, unclassified] }
      responses:
        '200':
          description: A page of conversations
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}:
    get:
      operationId: getConversation
      tags: [Inbox]
      summary: Get one conversation
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/integrations/ai:
    get:
      operationId: getAIIntegration
      tags: [Tenants]
      summary: External AI integration of the organization (Gemini)
      description: |
        Requires `tenant.manage`. Off by default. The API key is write-only: it is never returned, only
        `key_configured` and when/who set it. Includes the exact consent text and its version.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIIntegration' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
    put:
      operationId: updateAIIntegration
      tags: [Tenants]
      summary: Update the external AI integration
      description: |
        Partial update. Switching `enabled` on requires a stored key and the current consent
        (`accept_external_ai: true` the first time or after the text version changes). Sending `api_key`
        replaces the stored key (encrypted at rest, AES-256-GCM). Audited without the key.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIIntegrationUpdate' }
      responses:
        '200':
          description: New state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIIntegration' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '422': { description: 'Invalid key format, model or budget, or enabling without key or consent' }
  /tenants/{tenant_id}/integrations/ai/key:
    delete:
      operationId: deleteAIIntegrationKey
      tags: [Tenants]
      summary: Remove the stored API key (also switches the integration off)
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: New state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIIntegration' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
  /tenants/{tenant_id}/integrations/ai/usage:
    get:
      operationId: getAIUsage
      tags: [Tenants]
      summary: AI usage and budget of a month (administrators)
      description: |
        Calls recorded in the AI usage ledger, grouped by provider, model and task, plus the monthly budget of the
        tenant's own Gemini key. Costs are ESTIMATES from reported tokens; the provider's invoice is the source of truth.
        Providers paid by the platform show tokens and zero cost and never count against the budget.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: month, in: query, required: false, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }, description: 'YYYY-MM, UTC; default the current month' }
      responses:
        '200':
          description: Usage of the month
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIUsage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
  /tenants/{tenant_id}/integrations/ai/test:
    post:
      operationId: testAIIntegration
      tags: [Tenants]
      summary: Check the stored key against the provider
      description: |
        Calls the provider's model list server-side with the stored key (sent in a header) and reports a fixed,
        safe message. Never returns provider text. Throttled to one test per 3 seconds.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIIntegrationTest' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '409': { description: No key configured }
        '429': { description: Tested again too soon }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/topics:
    get:
      operationId: listConversationTopics
      tags: [Topics]
      summary: Topics (logical subjects) of a conversation
      description: Requires `topic.read`. A topic may span several conversations; open topics first, archived hidden.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200':
          description: The conversation's topics with message and ticket counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicList' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    post:
      operationId: createConversationTopic
      tags: [Topics]
      summary: Create a topic in a conversation
      description: |
        Requires `topic.manage` and being the conversation's attendant (or `conversation.manage`). The listed messages
        are linked to the new topic as primary, as an agent decision. Every id must belong to the tenant.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTopicRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: 'Invalid title, privacy policy or too many message ids' }
  /tenants/{tenant_id}/topics/{topic_id}:
    get:
      operationId: getTopic
      tags: [Topics]
      summary: A topic
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: The topic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    patch:
      operationId: updateTopic
      tags: [Topics]
      summary: Edit, resolve or reopen a topic
      description: '`status` accepts `resolved` or `open` only (archiving is not exposed). Resolving a resolved topic is a conflict.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTopicRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: Invalid status transition }
        '422': { description: Invalid field }
  /tenants/{tenant_id}/topics/{topic_id}/messages:
    get:
      operationId: listTopicMessages
      tags: [Topics]
      summary: The logical timeline of a topic (newest first)
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of the topic's messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicMessagePage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    post:
      operationId: linkTopicMessage
      tags: [Topics]
      summary: Add a message to a topic (agent decision)
      description: Idempotent. A decision by an agent or the customer is never overwritten by a lower-authority one.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message_id]
              properties:
                message_id: { type: string, format: uuid }
                relation: { type: string, enum: [primary, secondary, supporting, ambiguous] }
      responses:
        '204': { description: Linked }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: Invalid relation }
  /tenants/{tenant_id}/topics/{topic_id}/messages/{message_id}:
    delete:
      operationId: unlinkTopicMessage
      tags: [Topics]
      summary: Remove a message from a topic (the message itself stays in its conversation)
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/tickets:
    get:
      operationId: listTopicTickets
      tags: [Topics]
      summary: Tickets linked to a topic (primary first)
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: Linked tickets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicTicketList' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/tickets/link:
    post:
      operationId: linkTopicTicket
      tags: [Topics]
      summary: Link an existing ticket to a topic
      description: Never creates a ticket. A topic has at most one `primary` ticket (409 otherwise).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ticket_id]
              properties:
                ticket_id: { type: string, format: uuid }
                relation: { type: string, enum: [primary, related, child, merged] }
      responses:
        '204': { description: Linked }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: The topic already has a primary ticket }
        '422': { description: Invalid relation }
  /tenants/{tenant_id}/contacts/{contact_id}/topics:
    get:
      operationId: listContactTopics
      tags: [Topics]
      summary: Topics of a contact (active subjects across conversations)
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - name: contact_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, resolved, archived] }
      responses:
        '200':
          description: The contact's topics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicList' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
  /tenants/{tenant_id}/accounts:
    get:
      operationId: listCustomerAccounts
      tags: [Accounts]
      summary: Customer accounts (organizations) of the tenant
      description: 'Needs `account.read`. Archived accounts are hidden unless `status=archived`. ADR-0018.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, inactive, archived] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/CustomerAccount' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
    post:
      operationId: createCustomerAccount
      tags: [Accounts]
      summary: Create an account that has no provider record
      description: 'Needs `account.manage`. A provider company is materialized through the contact-company flow, which re-validates the provider directory.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], additionalProperties: false, properties: { name: { type: string, maxLength: 200 }, account_type: { type: string, enum: [customer, partner, internal, other], default: customer } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAccount' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '422': { description: Invalid account }
  /tenants/{tenant_id}/accounts/{account_id}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: account_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCustomerAccount
      tags: [Accounts]
      summary: One account with its provider links
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAccount' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    patch:
      operationId: updateCustomerAccount
      tags: [Accounts]
      summary: Rename, retype, deactivate, archive or restore an account (never deleted)
      description: 'Needs `account.manage`. Archiving stamps `archived_at`; restoring clears it.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { name: { type: string }, account_type: { type: string, enum: [customer, partner, internal, other] }, status: { type: string, enum: [active, inactive, archived] } } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAccount' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: Invalid account }
  /tenants/{tenant_id}/accounts/{account_id}/tickets:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: account_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listCustomerAccountTickets
      tags: [Accounts]
      summary: Real tickets that target a customer account
      description: 'Needs `account.read` AND `ticket.read` (tenant-wide ticket visibility is its own grant). Only REAL tickets (external link, subject or primary topic), never empty placeholders.'
      responses:
        '200':
          description: Tickets, newest first (at most 100)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, conversation_id, subject, status, priority, created_at, updated_at]
                      properties:
                        id: { type: string, format: uuid }
                        conversation_id: { type: string, format: uuid }
                        subject: { type: string }
                        status: { type: string }
                        priority: { type: string }
                        provider: { type: string, nullable: true }
                        external_ticket_id: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/contacts/{contact_id}/classification:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getContactClassification
      tags: [Accounts]
      summary: Classification of a contact and its active company links
      description: 'Needs `account.read`.'
      responses:
        '200':
          description: Classification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactClassification' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    put:
      operationId: putContactClassification
      tags: [Accounts]
      summary: Classify a contact and set its companies in ONE transaction
      description: |
        Needs `contact.classify`. The source is always `manual` (set by the server). `customer` needs at least one
        company in the same call or already linked (422 otherwise). Each entry is EITHER a local `account_id` OR a
        `directory_company_id`: a provider company that the server revalidates against the tenant's own company
        directory (unknown or inactive = 422; name, CNPJ and status sent by the browser are never accepted) and
        materializes as account + provider link. At most one entry is `primary`. A failed call changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [unclassified, customer, other, spam] }
                accounts: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/AccountRef' } }
                end_links: { type: boolean, description: 'End every active link when the contact stops being a customer (default: kept).' }
      responses:
        '200':
          description: The new classification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactClassification' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: 'Customer without a company, or unknown/inactive/foreign company' }
        '502': { description: Company directory failed }
        '503': { description: Company directory not configured or unavailable }
  /tenants/{tenant_id}/contacts/{contact_id}/company-suggestions:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listContactCompanySuggestions
      tags: [Accounts]
      summary: Companies that integration evidence associated with a contact (a SUGGESTION only)
      description: |
        Needs `account.read`. Reads the local evidence table only (no provider call) and carries no provider metadata.
        Evidence (a validated ticket selection) never classifies or links by itself; a person accepts a suggestion by
        sending its `directory_company_id` together with its `evidence_id` (the server re-checks both).
      responses:
        '200':
          description: Active evidence of the contact
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CompanySuggestion' } }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/contacts/{contact_id}/details:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateContactDetails
      tags: [Accounts]
      summary: Edit a contact's alias and/or e-mail (never the phone)
      description: 'Needs `contact.classify` (whoever attends). The alias is the name the team gives the contact and becomes its principal name; an empty alias CLEARS it and the name declared on WhatsApp is shown again on its own. An empty e-mail clears it. Audited as `contact.updated` (flags only, no values).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { alias: { type: string, maxLength: 200 }, email: { type: string, maxLength: 254 } } }
      responses:
        '200':
          description: The updated contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactItem' }
        '400': { $ref: '#/components/responses/Text400' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: Alias too long or invalid e-mail }
  /tenants/{tenant_id}/contacts/{contact_id}/notes:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listContactNotes
      tags: [Accounts]
      summary: Notes that document the context of a contact (newest first)
      description: 'Needs `contact.classify`. Internal working notes: never sent to the contact.'
      responses:
        '200':
          description: Notes
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ContactNote' } } } }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
    post:
      operationId: addContactNote
      tags: [Accounts]
      summary: Add a note
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], additionalProperties: false, properties: { body: { type: string, maxLength: 4000 } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactNote' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: Empty or too long }
  /tenants/{tenant_id}/contacts/{contact_id}/notes/{note_id}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: note_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: editContactNote
      tags: [Accounts]
      summary: Edit a note (only its author; anyone else gets 404)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], additionalProperties: false, properties: { body: { type: string, maxLength: 4000 } } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactNote' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: Empty or too long }
    delete:
      operationId: deleteContactNote
      tags: [Accounts]
      summary: Delete a note (only its author; anyone else gets 404)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/contacts/{contact_id}/accounts:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: linkContactAccount
      tags: [Accounts]
      summary: Link one more company to a contact (idempotent per contact+account)
      description: 'Needs `contact.classify`. Making the link primary demotes the previous primary; the other companies stay active.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRef' }
      responses:
        '200':
          description: The link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactAccountLink' }
        '400': { $ref: '#/components/responses/Text400' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: Unknown/inactive/foreign/archived company }
  /tenants/{tenant_id}/contacts/{contact_id}/accounts/{link_id}/end:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: link_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: endContactAccountLink
      tags: [Accounts]
      summary: End a company link (soft end; never deleted)
      description: 'Needs `contact.classify`. Ending the LAST active link of a customer is 409 unless `reclassify_to` (other | unclassified) is given: both happen in one transaction.'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { reclassify_to: { type: string, enum: [other, unclassified] } } }
      responses:
        '200':
          description: The new classification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactClassification' }
        '400': { $ref: '#/components/responses/Text400' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: Last company of a customer without reclassify_to }
  /tenants/{tenant_id}/contacts/{contact_id}/accounts/{link_id}/primary:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: link_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: setContactPrimaryAccount
      tags: [Accounts]
      summary: Make an active link the contact's primary company (the others stay active)
      responses:
        '200':
          description: The new classification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactClassification' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/identities:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
    get:
      operationId: listUserChannelIdentities
      tags: [Identity]
      summary: Channel identities of internal users
      description: 'Needs `identity.manage` (admin only: it decides who the system treats as staff).'
      parameters:
        - { name: user_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, verified, revoked] } }
      responses:
        '200':
          description: Identities
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/UserChannelIdentity' } } } }
        '403': { $ref: '#/components/responses/Text403' }
    post:
      operationId: createUserChannelIdentity
      tags: [Identity]
      summary: Register a PENDING identity of a staff member
      description: |
        Needs `identity.manage`. Always created `pending`; a pending identity never matches inbound traffic. The value is
        normalized (E.164 / lowercase e-mail / provider participant id scoped to one connection). A provider participant
        needs `provider` and `connection_id` of this tenant. The identity grants NO permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, identity_type, value]
              additionalProperties: false
              properties:
                user_id: { type: string, format: uuid }
                identity_type: { type: string, enum: [phone, email, provider_participant] }
                value: { type: string }
                provider: { type: string }
                connection_id: { type: string, format: uuid }
      responses:
        '201':
          description: Created (pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserChannelIdentity' }
        '400': { $ref: '#/components/responses/Text400' }
        '403': { $ref: '#/components/responses/Text403' }
        '409': { description: The user already has that live identity }
        '422': { description: Invalid value, user not in the tenant or unknown connection }
  /tenants/{tenant_id}/identities/{identity_id}/verify:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: identity_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: verifyUserChannelIdentity
      tags: [Identity]
      summary: Verify a pending identity (human admin source only)
      description: |
        Needs `identity.manage`. Only `verification_source: admin` is accepted here; `provider_verified`, `challenge` and
        `import_verified` are reserved for system flows that prove them, and there is no AI source. One VERIFIED owner per
        identity per tenant (409 otherwise). Verification opens one conflict per existing external Contact that matches;
        it is not blocked by them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [verification_source], additionalProperties: false, properties: { verification_source: { type: string, enum: [admin] } } }
      responses:
        '200':
          description: Verified, with the conflicts it opened
          content:
            application/json:
              schema:
                type: object
                required: [identity, conflicts]
                properties:
                  identity: { $ref: '#/components/schemas/UserChannelIdentity' }
                  conflicts: { type: array, items: { $ref: '#/components/schemas/IdentityConflict' } }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: Not pending, or already verified for another user }
        '422': { description: Verification source not allowed }
  /tenants/{tenant_id}/identities/{identity_id}/revoke:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: identity_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: revokeUserChannelIdentity
      tags: [Identity]
      summary: Revoke an identity (it stops matching; its open conflicts close)
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserChannelIdentity' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: Already revoked }
  /tenants/{tenant_id}/identity-conflicts:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
    get:
      operationId: listIdentityConflicts
      tags: [Identity]
      summary: Conflicts between a verified internal identity and an external contact
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, all], default: open } }
      responses:
        '200':
          description: Conflicts
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/IdentityConflict' } } } }
        '403': { $ref: '#/components/responses/Text403' }
  /tenants/{tenant_id}/identity-conflicts/{conflict_id}/resolve:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { name: conflict_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resolveIdentityConflict
      tags: [Identity]
      summary: Resolve a conflict (the contact is never deleted or merged)
      description: '`confirmed_internal` keeps the identity internal; `identity_revoked` revokes the identity.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [resolution], additionalProperties: false, properties: { resolution: { type: string, enum: [confirmed_internal, identity_revoked] }, note: { type: string, maxLength: 500 } } }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityConflict' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: Already resolved }
        '422': { description: Invalid resolution }
  /tenants/{tenant_id}/topics/{topic_id}/account-context:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/TopicId' }
    get:
      operationId: getTopicAccountContext
      tags: [Topics]
      summary: Company context of a subject (ADR-0018)
      description: |
        Needs `topic.read` AND `account.read`. The company belongs to the TOPIC, never to the conversation.
        `resolved`: a person chose it (`topic_link`, persisted), the topic's primary ticket targets it (`ticket`, derived)
        or the contact belongs to exactly one company (`sole_company`, derived). `needs_choice`: the contact belongs to
        several companies and a person must pick (the contact's own primary link is a preference, NOT an answer).
        `none`: no company known. An AI may only suggest; nothing here lets it decide.
      responses:
        '200':
          description: The context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicAccountContext' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/accounts:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/TopicId' }
    post:
      operationId: linkTopicAccount
      tags: [Topics]
      summary: A person records the company of the subject
      description: |
        Needs `topic.manage` AND `account.read` AND being the attendant of the topic's conversation (or `conversation.manage`).
        At most ONE primary per topic: a new primary demotes the previous one to related. The account must exist in the
        tenant and not be archived (422 otherwise, also for another tenant's id). A company the contact does not belong to is
        allowed and flagged `linked_to_contact: false`. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, relation]
              additionalProperties: false
              properties:
                account_id: { type: string, format: uuid }
                relation: { type: string, enum: [primary, related] }
      responses:
        '200':
          description: The new context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicAccountContext' }
        '400': { $ref: '#/components/responses/Text400' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: Unknown, foreign or archived account, or invalid relation }
  /tenants/{tenant_id}/topics/{topic_id}/accounts/{account_id}:
    parameters:
      - { $ref: '#/components/parameters/TenantId' }
      - { $ref: '#/components/parameters/TopicId' }
      - { name: account_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: unlinkTopicAccount
      tags: [Topics]
      summary: Remove a company from the subject (nothing is promoted in its place)
      responses:
        '200':
          description: The new context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicAccountContext' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/summaries:
    get:
      operationId: listTopicSummaries
      tags: [Topics]
      summary: Versioned summaries of a topic
      description: 'Newest version first. History is never rewritten; superseded versions stay readable.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/TopicSummary' } } } }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/summary/generate:
    post:
      operationId: generateTopicSummary
      tags: [Topics]
      summary: Generate a machine summary of the topic now
      description: 'Returns 201 with a new version, or 200 with the existing one when nothing new happened. 503 when no summarizer is configured or the provider failed; 422 when the topic has no messages.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicSummary' }
        '201':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicSummary' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/summary/confirm:
    post:
      operationId: confirmTopicSummary
      tags: [Topics]
      summary: Confirm the current summary as an agent
      description: 'Never lowers authority; a corrected or superseded version cannot be confirmed (409).'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicSummary' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/summary/correct:
    post:
      operationId: correctTopicSummary
      tags: [Topics]
      summary: Replace the summary with the agent text (new version)
      description: 'Creates a NEW corrected version; the previous one is superseded but kept. Later machine summaries never replace it.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [summary_text], additionalProperties: false, properties: { summary_text: { type: string, maxLength: 4000 } } }
      responses:
        '201':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicSummary' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/ticket-policy:
    get:
      operationId: getTopicTicketPolicy
      tags: [Topics]
      summary: What the ticket policy advises for a topic (read-only)
      description: 'Never creates anything. The conversation keeps ONE conversation ticket; a second subject is advised needs_agent and a person may choose create (a ticket for that subject, topic_scoped) or share_active.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: Advice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketPolicyAdvice' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/ticket-policy/apply:
    post:
      operationId: applyTopicTicketPolicy
      tags: [Topics]
      summary: Apply an allowed ticket policy action
      description: 'The server re-evaluates the policy under a per-conversation lock; an action the policy does not currently allow is a 409. create also needs ticket.create. Responds 201 when a ticket was opened.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [action], additionalProperties: false, properties: { action: { type: string, enum: [adopt_active, share_active, create] } } }
      responses:
        '200': { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/TicketPolicyResult' } } } }
        '201': { description: A ticket was opened, content: { application/json: { schema: { $ref: '#/components/schemas/TicketPolicyResult' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "The policy does not allow this action now", content: { text/plain: { schema: { type: string } } } }
        '422': { description: "Unknown action", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/legacy-topic:
    post:
      operationId: backfillConversationLegacyTopic
      tags: [Topics]
      summary: Give the conversation's existing unlinked active ticket a topic (on demand)
      description: 'Creates a legacy_backfill topic linked to that ticket as primary. Never classifies history. Idempotent: 200 with created=false when there is nothing to do.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200': { description: Nothing to do, content: { application/json: { schema: { type: object, properties: { created: { type: boolean } } } } } }
        '201': { description: Topic created, content: { application/json: { schema: { type: object, properties: { created: { type: boolean }, topic: { $ref: '#/components/schemas/Topic' } } } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/handoffs:
    post:
      operationId: createTopicHandoff
      tags: [Topics]
      summary: Create a private-handoff invitation for a topic
      description: 'Returns an opaque single-use token ONCE (Cache-Control no-store); only its SHA-256 is stored. Default validity 24 h, maximum 72 h, at most 3 pending per topic (409). 404 when the feature flag is off.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { expires_in_minutes: { type: integer, minimum: 0, maximum: 4320 } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { type: object, required: [handoff, token, instructions], properties: { handoff: { $ref: '#/components/schemas/TopicHandoff' }, token: { type: string }, instructions: { type: string } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Too many pending invitations, or the topic is not open", content: { text/plain: { schema: { type: string } } } }
        '422': { description: "Invalid expiry", content: { text/plain: { schema: { type: string } } } }
    get:
      operationId: listTopicHandoffs
      tags: [Topics]
      summary: Invitations of a topic (never includes tokens)
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: Invitations, newest first
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/TopicHandoff' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/handoffs/{handoff_id}/revoke:
    post:
      operationId: revokeTopicHandoff
      tags: [Topics]
      summary: Revoke a pending invitation
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
        - { name: handoff_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Revoked }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "The invitation is not pending", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/topics/{topic_id}/copilot/suggest-reply:
    post:
      operationId: suggestTopicReply
      tags: [Topics]
      summary: Draft a reply to the topic's latest customer message (suggest-only)
      description: 'Returns a DRAFT for the attendant to edit and send through the normal message endpoint; it never sends anything (sent is always false). Warnings are computed by OMNIRA, not by the model. 404 when the copilot flag is off, 422 without a customer message, 429 when asked again within seconds, 503 when the model is unavailable.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopilotSuggestion' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: "No customer message to answer", content: { text/plain: { schema: { type: string } } } }
        '429': { description: "Asked again too soon for this topic", content: { text/plain: { schema: { type: string } } } }
        '503': { description: "The copilot is unavailable right now", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/topics/{topic_id}/ai/tools:
    get:
      operationId: listTopicAITools
      tags: [Topics]
      summary: The closed catalog of real tools the AI may request
      description: 'Only tools that exist and are wired here are listed. There is no tool to send messages, close tickets, run scripts or SQL, or call arbitrary URLs. 404 when the gateway flag is off.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AIToolView' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/ai/tools/invoke:
    post:
      operationId: invokeTopicAITool
      tags: [Topics]
      summary: Ask for a tool to run (policy-gated, audited, idempotent)
      description: |
        Every tool runs with the REQUESTING USER's permissions. A read runs at once (200). A write asked for by the AI
        (proposed_by ai, the default) is queued for a person (202 pending_approval); the same write from a person
        (proposed_by agent) is that person acting. A denied request is recorded (403). Results are untrusted data. The
        idempotency key makes a retry return the first outcome; reusing it for a different request is a 409.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIToolInvoke' }
      responses:
        '200': { description: Executed (or failed with a fixed reason), content: { application/json: { schema: { $ref: '#/components/schemas/AIToolCall' } } } }
        '202': { description: Waiting for a person to approve, content: { application/json: { schema: { $ref: '#/components/schemas/AIToolCall' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Idempotency key already used for a different request", content: { text/plain: { schema: { type: string } } } }
        '422': { description: "Unknown tool, invalid arguments or key", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/topics/{topic_id}/ai/tool-calls:
    get:
      operationId: listTopicAIToolCalls
      tags: [Topics]
      summary: Audit trail and approval queue of the topic's tool calls
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      responses:
        '200':
          description: Latest 50 calls
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AIToolCall' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/topics/{topic_id}/ai/tool-calls/{call_id}/approve:
    post:
      operationId: approveTopicAIToolCall
      tags: [Topics]
      summary: Approve and run a pending call with the approver's own authority
      description: 'The approver must be allowed to use the tool and to operate the topic. Only one approver can win (409 otherwise).'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
        - { name: call_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Executed, content: { application/json: { schema: { $ref: '#/components/schemas/AIToolCall' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "No longer pending", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/topics/{topic_id}/ai/tool-calls/{call_id}/reject:
    post:
      operationId: rejectTopicAIToolCall
      tags: [Topics]
      summary: Reject a pending call (nothing runs)
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
        - { name: call_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Rejected }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "No longer pending", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/topics/{topic_id}/merge:
    post:
      operationId: mergeTopic
      tags: [Topics]
      summary: Merge this topic into another (a person's action; nothing is deleted)
      description: 'The source is archived and keeps pointing at the target (merged_into_topic_id); its messages, links and summaries stay readable. Messages, containers, entities and tickets are COPIED to the target; the source primary ticket becomes merged there (the target keeps one primary). Pending handoffs of the source are revoked. The person must operate BOTH topics. Both must be open (409). There is no automatic merge.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [into_topic_id], additionalProperties: false, properties: { into_topic_id: { type: string, format: uuid } } }
      responses:
        '200': { description: Merged, content: { application/json: { schema: { $ref: '#/components/schemas/TopicRestructure' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "A topic is not open, or source equals target", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/topics/{topic_id}/split:
    post:
      operationId: splitTopic
      tags: [Topics]
      summary: Move chosen messages into a new topic (a person's action)
      description: 'Creates a new open topic (split_from_topic_id remembers the origin) and MOVES the chosen message links out of the source; the router decisions for them are marked overridden. The source must keep at least one message and every message must belong to it. The new topic gets the entities its messages name.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/TopicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [title, message_ids], additionalProperties: false, properties: { title: { type: string, maxLength: 200 }, message_ids: { type: array, minItems: 1, items: { type: string, format: uuid } } } }
      responses:
        '201': { description: Split, content: { application/json: { schema: { $ref: '#/components/schemas/TopicRestructure' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "The source would be left empty, or is not open", content: { text/plain: { schema: { type: string } } } }
        '422': { description: "Empty list, duplicated message or missing title", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/intelligence/evaluation:
    get:
      operationId: getIntelligenceEvaluation
      tags: [Topics]
      summary: Aggregate, content-free evaluation of the conversation-intelligence automations
      description: 'Numbers only (never message text): override rate of the deterministic router, AI shadow agreement with what finally happened (by confidence band), ambiguity handling, summary corrections, tool requests and handoffs. Base the decision to turn an automation on on this report.'
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/ambiguities:
    get:
      operationId: listConversationAmbiguities
      tags: [Topics]
      summary: Messages of a conversation the router could not place with enough confidence
      description: Requires `topic.read`. Each item lists the candidate topics with their score and evidence; a person resolves it.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200':
          description: Open ambiguities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AmbiguityList' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/ambiguities/{ambiguity_id}/resolve:
    post:
      operationId: resolveAmbiguity
      tags: [Topics]
      summary: Decide which topic an ambiguous message belongs to
      description: |
        Give an existing `topic_id` OR a `new_topic_title` (not both). The message joins the topic as an agent decision, which
        no later automated decision can overwrite. Requires `topic.manage` and being the conversation's attendant (or
        `conversation.manage`); for a group message, `group.manage`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - name: ambiguity_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                topic_id: { type: string, format: uuid }
                new_topic_title: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: The topic the message now belongs to
          content:
            application/json:
              schema:
                type: object
                required: [topic_id]
                properties:
                  topic_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: The ambiguity was already resolved }
        '422': { description: 'Neither or both of topic_id and new_topic_title, or an invalid title' }
  /tenants/{tenant_id}/messages/{message_id}/media:
    get:
      operationId: getMessageMedia
      tags: [Messages]
      summary: Download a message's attachment
      description: |
        Serves the file only after the antivirus cleared it (ADR-0016). Raster images, audio and video are
        returned inline with `Range` support; everything else (PDF, text) is always an attachment. Every
        response carries `X-Content-Type-Options: nosniff` and a sandboxing `Content-Security-Policy`. Images and
        audio are cacheable by the caller's browser only (`Cache-Control: private, max-age=86400`, revalidated by
        `ETag`); video and documents are `private, no-store`. `X-Media-Status` tells why a file is not available.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: The cleared file }
        '206': { description: A byte range of the cleared file }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { description: 'Blocked for security reasons: infected, rejected type or failed check' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: The file is still being checked }
        '410': { description: 'The file is no longer available: the provider deleted it before capture, or retention removed it' }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/messages:
    get:
      operationId: listMessages
      tags: [Messages]
      summary: List a conversation's messages
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of messages
          headers:
            X-Pagination-Count: { $ref: '#/components/headers/XPaginationCount' }
            X-Pagination-Limit: { $ref: '#/components/headers/XPaginationLimit' }
            X-Pagination-HasMore: { $ref: '#/components/headers/XPaginationHasMore' }
            X-Pagination-NextCursor: { $ref: '#/components/headers/XPaginationNextCursor' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
    post:
      operationId: sendMessage
      tags: [Messages]
      summary: Queue an outbound text message
      description: |
        Persists the message (`queued`) and its delivery job atomically; the worker delivers it through the
        conversation's channel. Requires permission `conversation.claim` **and** being the conversation's assignee
        (or `conversation.manage`). Idempotent per (tenant, sender, `Idempotency-Key`): a retry with the same key
        and body returns the original message (`200` + `Idempotent-Replayed: true`); the same key with a different
        body is `422`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
        - name: Idempotency-Key
          in: header
          required: true
          description: 8-128 characters of `[A-Za-z0-9._:-]`
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuedMessage' }
        '200':
          description: Idempotent replay of an earlier request
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueuedMessage' }
        '400': { description: "Malformed body or invalid Idempotency-Key", content: { text/plain: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { description: "Missing permission or conversation assigned to another agent", content: { text/plain: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Conversation is unassigned, or has no active text channel", content: { text/plain: { schema: { type: string } } } }
        '422': { description: "Blank/too long text (max 4096 characters) or key reused with a different request", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/assign:
    post:
      operationId: assignConversation
      tags: [Assignment]
      summary: Assign the conversation (claim for yourself, or assign to another agent)
      description: |
        Without a body: atomically claim an unassigned conversation for the caller (`conversation.claim`); if it is
        already yours the call is an idempotent no-op (`changed:false`); owned by someone else → `409` (of two
        simultaneous claimers exactly one wins). With `assignee_user_id`: assign to another agent
        (`conversation.manage`); the target must hold `conversation.claim` in this tenant (else `422`).
        History (`assignment_events`) and audit (`conversation.assigned`) are written in the same transaction.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRequest' }
      responses:
        '200': { $ref: '#/components/responses/AssignResult' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Already assigned to another agent", content: { text/plain: { schema: { type: string } } } }
        '422': { description: "Assignee is not an eligible agent of this tenant", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/unassign:
    post:
      operationId: unassignConversation
      tags: [Assignment]
      summary: Release the conversation
      description: |
        Releasing your own needs `conversation.claim`; releasing someone else's needs `conversation.manage`.
        Unassigning an already-unassigned conversation is an idempotent no-op (`changed:false`).
        Audit `conversation.unassigned`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200': { $ref: '#/components/responses/AssignResult' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/invite:
    post:
      operationId: inviteParticipant
      tags: [Co-attendance]
      summary: Invite another agent to co-attend the conversation
      description: |
        Creates a pending invitation (`INVITED`) for `target_user_id`. The target must be an eligible agent of this
        tenant (else `422`). Re-inviting an already invited or active participant is an idempotent no-op
        (`changed:false`). Audit `participant.invited`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantTargetRequest' }
      responses:
        '201':
          description: "Invitation registered"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteResult' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Conflicting participant state", content: { text/plain: { schema: { type: string } } } }
        '422': { description: "Target is not an eligible agent of this tenant", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/transfer:
    post:
      operationId: transferConversation
      tags: [Co-attendance]
      summary: Transfer the conversation to another agent
      description: |
        Moves ownership to `target_user_id`. The target must be an eligible agent of this tenant (else `422`).
        Transferring to the current assignee is an idempotent no-op (`changed:false`).
        Audit `conversation.transferred`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantTargetRequest' }
      responses:
        '200':
          description: "Transfer applied"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResult' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Conflicting participant state", content: { text/plain: { schema: { type: string } } } }
        '422': { description: "Target is not an eligible agent of this tenant", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/accept-invite:
    post:
      operationId: acceptParticipantInvite
      tags: [Co-attendance]
      summary: Accept a pending co-attendance invitation
      description: |
        The caller accepts their own pending invitation and becomes an active co-attendee.
        Only invitations in `INVITED` state can be accepted (else `409`). Audit `participant.accepted`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '201':
          description: "Invitation accepted"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptInviteResult' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Only pending invitations can be accepted", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/reject-invite:
    post:
      operationId: rejectParticipantInvite
      tags: [Co-attendance]
      summary: Reject a pending co-attendance invitation
      description: |
        The caller declines their own pending invitation. Only invitations in `INVITED` state can be rejected
        (else `409`). Audit `participant.rejected`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '204': { description: "Invitation rejected" }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Only pending invitations can be rejected", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/leave:
    post:
      operationId: leaveConversation
      tags: [Co-attendance]
      summary: Leave the conversation as co-attendee
      description: |
        Removes the caller from the active co-attendees. Only co-attendees can leave — the owner releases the
        conversation through `/unassign` instead (else `409`). Audit `participant.left`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '204': { description: "Left the conversation" }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "Only co-attendees can leave", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/events:
    get:
      operationId: streamInboxEvents
      tags: [Realtime]
      summary: Server-Sent Events for the whole tenant
      description: &sse |
        `text/event-stream`. Authorized once and **re-authorized every 30 s** (revoked membership closes the stream);
        heartbeat comment every 20 s. Send the JWT in the `Authorization` header (use fetch streaming; `EventSource`
        cannot). Events carry **references only** (no message body/phone): refetch through the REST API.
        Delivery is best-effort: after a reconnect, refetch.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: "Stream of `data: <RealtimeEvent JSON>` frames"
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/RealtimeEvent' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
        '503': { description: "Realtime unavailable (no NATS)", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/events:
    get:
      operationId: streamConversationEvents
      tags: [Realtime]
      summary: Server-Sent Events for one conversation
      description: *sse
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200':
          description: "Stream of `data: <RealtimeEvent JSON>` frames"
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/RealtimeEvent' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
        '503': { description: "Realtime unavailable (no NATS)", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/channels/connections/{connection_id}/templates/sync:
    post:
      operationId: syncChannelTemplates
      tags: [Channels]
      summary: Sync the WhatsApp Cloud API message templates of a connection (`channel.manage`)
      description: Reads the templates from Meta (read-only there) and makes the stored set equal to it. Only Meta Cloud connections.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: connection_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced: { type: integer }
                  sendable: { type: integer }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: Meta rejected the connection's token }
        '502': { description: Meta unavailable }
  /tenants/{tenant_id}/channels/lines/{connection_id}/templates:
    get:
      operationId: listLineTemplates
      tags: [Channels]
      summary: Approved templates of a Meta line (any tenant member)
      description: Templates with `sendable=false` need something this version cannot fill (header media/variables, dynamic URL buttons); `unsupported_reason` says what.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { name: connection_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        language: { type: string }
                        category: { type: string }
                        status: { type: string }
                        body: { type: string }
                        variable_count: { type: integer }
                        sendable: { type: boolean }
                        unsupported_reason: { type: string }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/channels/lines:
    get:
      operationId: listChannelLines
      tags: [Channels]
      summary: List the tenant's WhatsApp lines (Inbox channel selector)
      description: Any tenant member. A directory only - no secret and no management data. Inactive lines are listed with `can_send_text=false`.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: Lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        provider: { type: string }
                        provider_kind: { type: string, enum: [official, unofficial] }
                        label: { type: string }
                        number: { type: string }
                        status: { type: string }
                        can_send_text: { type: boolean }
                        window_required: { type: boolean }
        '401': { $ref: '#/components/responses/Text401' }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/template:
    post:
      operationId: sendTemplateMessage
      tags: [Messages]
      summary: Queue an approved WhatsApp template message (Meta Cloud lines only)
      description: |
        Allowed inside or outside the 24 h window. Same permission and assignment rules as `sendMessage`
        (`conversation.claim` and being the assignee, or `conversation.manage`). `params` are the template's body
        variables in order; each must be non-empty, without line breaks or tabs, at most 1024 characters. The inbox shows
        the rendered text. Idempotent per (tenant, sender, `Idempotency-Key`).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id]
              properties:
                template_id: { type: string, format: uuid }
                params: { type: array, items: { type: string } }
      responses:
        '202': { description: Queued }
        '200': { description: Idempotent replay of an earlier request }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: Conversation not assigned, finalized or its channel unavailable }
        '422': { description: Template not approved or not supported, not from this line, or invalid variables }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/channel:
    get:
      operationId: getConversationChannel
      tags: [Messages]
      summary: The line a conversation is on and whether it accepts free text now
      description: |
        `window_required` is true for providers that only accept free text within 24 h of the customer's last message
        (WhatsApp Cloud API); `window_open` says whether that is currently the case (always true when not required).
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200':
          description: Channel state
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel_connection_id: { type: string, format: uuid }
                  provider: { type: string }
                  can_send_text: { type: boolean }
                  window_required: { type: boolean }
                  window_open: { type: boolean }
                  last_inbound_at: { type: string, format: date-time }
                  window_expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/inbox/conversations/open:
    post:
      operationId: openConversationOnChannel
      tags: [Messages]
      summary: Open (or find) a contact's conversation on a chosen line
      description: |
        Returns the contact's open conversation on that line, creating it empty and unassigned when there is none
        (`201`, else `200`). Sends nothing. Needs `conversation.claim`. The contact needs a usable phone number and the
        line must be active.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_id, channel_connection_id]
              properties:
                contact_id: { type: string, format: uuid }
                channel_connection_id: { type: string, format: uuid }
      responses:
        '200':
          description: Existing open conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id: { type: string, format: uuid }
                  created: { type: boolean }
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id: { type: string, format: uuid }
                  created: { type: boolean }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: Contact without a usable phone number, or a channel that is not an active line }
  /tenants/{tenant_id}/channels/providers:
    get:
      operationId: listChannelProviders
      tags: [Channels]
      summary: List declarative provider descriptors (`channel.manage`)
      description: Disabled providers remain visible with an actionable `unavailable_reason`; descriptors never contain secrets.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: Provider catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProviderDescriptor' } }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/channels/connections:
    post:
      operationId: createChannelConnection
      tags: [Channels]
      summary: Create a connection using its provider descriptor
      description: Requires `channel.manage`. Inputs are write-only. In I0 only WAHA is enabled; the WAHA-specific path remains a compatibility alias.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGenericConnectionRequest' }
      responses:
        '201': { description: Connection created, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelConnection' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: 'Invalid provider, inputs, or risk acknowledgement', content: { text/plain: { schema: { type: string } } } }
        '503': { description: Provider disabled or not configured, content: { text/plain: { schema: { type: string } } } }
    get:
      operationId: listChannelConnections
      tags: [Channels]
      summary: List connections from registered provider managers (`channel.manage`)
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: Connections without secrets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ChannelConnection' } }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/channels/connections/{connection_id}:
    get:
      operationId: getChannelConnection
      tags: [Channels]
      summary: Get a connection and its live provider state
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConnectionId' }
      responses:
        '200': { $ref: '#/components/responses/Connection' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '502': { $ref: '#/components/responses/Text502' }
  /tenants/{tenant_id}/channels/connections/{connection_id}/test:
    post:
      operationId: testChannelConnection
      tags: [Channels]
      summary: Probe the provider and refresh the connection status
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConnectionId' }
      responses:
        '200': { $ref: '#/components/responses/Connection' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '502': { $ref: '#/components/responses/Text502' }
        '503': { description: Provider not configured, content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/channels/connections/{connection_id}/session/start:
    post:
      operationId: startChannelSession
      tags: [Channels]
      summary: Start a session-capable provider connection
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConnectionId' }
      responses:
        '200': { $ref: '#/components/responses/Connection' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: Provider does not support sessions, content: { text/plain: { schema: { type: string } } } }
        '502': { $ref: '#/components/responses/Text502' }
        '503': { description: Provider not configured, content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/channels/connections/{connection_id}/session/stop:
    post:
      operationId: stopChannelSession
      tags: [Channels]
      summary: Stop a session-capable provider connection
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConnectionId' }
      responses:
        '200': { $ref: '#/components/responses/Connection' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: Provider does not support sessions, content: { text/plain: { schema: { type: string } } } }
        '502': { $ref: '#/components/responses/Text502' }
  /tenants/{tenant_id}/channels/connections/{connection_id}/qr:
    get:
      operationId: getChannelConnectionQR
      tags: [Channels]
      summary: Get a QR from a QR-session provider
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConnectionId' }
      responses:
        '200': { description: Pairing QR, content: { application/json: { schema: { $ref: '#/components/schemas/QRImage' } } } }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: QR unavailable in the current state or unsupported, content: { text/plain: { schema: { type: string } } } }
        '502': { $ref: '#/components/responses/Text502' }
  /tenants/{tenant_id}/channels/waha/connections:
    post:
      operationId: createWahaConnection
      tags: [Channels]
      summary: Create a WhatsApp (WAHA, unofficial) connection
      deprecated: true
      description: |
        Requires permission `channel.manage` (tenant admin). `risk_acknowledged` must be `true` (unofficial
        WhatsApp automation can get numbers banned); it is recorded with the acting user and the time. The webhook
        HMAC key is generated server-side, stored encrypted and **never returned**.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConnectionRequest' }
      responses:
        '201':
          description: Connection created (status `pending`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelConnection' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: "Risk not acknowledged", content: { text/plain: { schema: { type: string } } } }
    get:
      operationId: listWahaConnections
      tags: [Channels]
      summary: List the tenant's WAHA connections (`channel.manage`)
      deprecated: true
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
      responses:
        '200':
          description: Connections (no live session status)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChannelConnection' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
  /tenants/{tenant_id}/channels/waha/connections/{connection_id}:
    get:
      operationId: getWahaConnection
      tags: [Channels]
      summary: Get a connection with its live session status (persists the derived status)
      deprecated: true
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConnectionId' }
      responses:
        '200': { $ref: '#/components/responses/Connection' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '502': { $ref: '#/components/responses/Text502' }
  /tenants/{tenant_id}/channels/waha/connections/{connection_id}/session/start:
    post:
      operationId: startWahaSession
      tags: [Channels]
      summary: Start (and if needed create) the WAHA session; idempotent
      deprecated: true
      description: Registers this connection's webhook (`OMNIRA_PUBLIC_BASE_URL`) when the session does not exist yet.
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConnectionId' }
      responses:
        '200': { $ref: '#/components/responses/Connection' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '422': { description: "Risk not acknowledged", content: { text/plain: { schema: { type: string } } } }
        '502': { $ref: '#/components/responses/Text502' }
        '503': { description: "Public webhook URL or gateway not configured", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/channels/waha/connections/{connection_id}/session/stop:
    post:
      operationId: stopWahaSession
      tags: [Channels]
      summary: Stop the WAHA session
      deprecated: true
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConnectionId' }
      responses:
        '200': { $ref: '#/components/responses/Connection' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '502': { $ref: '#/components/responses/Text502' }
  /tenants/{tenant_id}/channels/waha/connections/{connection_id}/qr:
    get:
      operationId: getWahaQR
      tags: [Channels]
      summary: Pairing QR code (only while the session waits for a scan)
      deprecated: true
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConnectionId' }
      responses:
        '200':
          description: "QR image (base64). `Cache-Control: no-store`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QRImage' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '403': { $ref: '#/components/responses/Text403' }
        '404': { $ref: '#/components/responses/Text404' }
        '409': { description: "No QR code in the current session state (poll GET connection until `session_status` is `needs_qr`)", content: { text/plain: { schema: { type: string } } } }
        '502': { $ref: '#/components/responses/Text502' }
  /webhooks/v1/whatsapp/waha/{connection_id}:
    servers:
      - url: /
        description: Not under /api/v1
    post:
      operationId: receiveWahaWebhook
      tags: [Webhooks]
      summary: WAHA → OMNIRA webhook (server-to-server; NOT exposed by the public nginx)
      description: |
        Authenticated by `X-Webhook-Hmac` = hex(HMAC-SHA512(raw body, connection webhook key)). The connection (and
        therefore the tenant) is resolved from the path id in a system session; nothing in the payload selects the
        tenant. Idempotent by event id (redeliveries are acknowledged, not reapplied). Events: `message` /
        `message.any` (inbound), `message.ack` (delivery status), `session.status`.
      security: []
      parameters:
        - { $ref: '#/components/parameters/ConnectionId' }
        - name: X-Webhook-Hmac
          in: header
          required: true
          schema: { type: string, description: 'hex, 128 chars' }
        - name: X-Webhook-Hmac-Algorithm
          in: header
          required: true
          schema: { type: string, enum: [sha512] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WahaWebhook' }
      responses:
        '200': { description: "Accepted (or duplicate)", content: { text/plain: { schema: { type: string } } } }
        '202': { description: "Event ignored (unsupported)", content: { text/plain: { schema: { type: string } } } }
        '400': { description: "Malformed webhook", content: { text/plain: { schema: { type: string } } } }
        '401': { description: "Invalid signature", content: { text/plain: { schema: { type: string } } } }
        '404': { description: "Unknown connection", content: { text/plain: { schema: { type: string } } } }
        '409': { description: "Connection inactive or provider mismatch", content: { text/plain: { schema: { type: string } } } }
        '413': { description: "Body too large (1 MiB)", content: { text/plain: { schema: { type: string } } } }
        '503': { description: "Verification key unreadable / intake unavailable — WAHA retries", content: { text/plain: { schema: { type: string } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: omnira_session
  parameters:
    TopicId:
      name: topic_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueueId:
      name: queue_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: contact_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: group_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `next_cursor`
      schema: { type: string }
  headers:
    XPaginationCount: { description: Items in this page, schema: { type: integer } }
    XPaginationLimit: { description: Effective page size, schema: { type: integer } }
    XPaginationHasMore: { description: Whether another page exists, schema: { type: boolean } }
    XPaginationNextCursor: { description: Cursor for the next page (only when has_more), schema: { type: string } }
  responses:
    JsonError:
      description: Error (JSON)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
    Text400: { description: "Malformed identifier, pagination or body", content: { text/plain: { schema: { type: string } }, application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Text401: { description: "Missing/invalid/expired JWT", content: { text/plain: { schema: { type: string } }, application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Text403: { description: "Missing permission (e.g. `channel.manage` / `conversation.*`)", content: { text/plain: { schema: { type: string } }, application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Text404: { description: "Tenant, membership or resource not visible to the caller (no enumeration oracle)", content: { text/plain: { schema: { type: string } }, application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Text502: { description: "WhatsApp gateway (WAHA) unavailable or rejected the request", content: { text/plain: { schema: { type: string } }, application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    AssignResult:
      description: Resulting assignee; `changed:false` for an idempotent no-op
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AssignResult' }
    Connection:
      description: The connection
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ChannelConnection' }
  schemas:
    ErrorEnvelope:
      type: object
      description: 'Error body (Content-Type application/json) when the request opted in with `Accept: application/vnd.omnira.v1+json`. It applies to EVERY text/plain error of the API, including statuses (409, 422, 503, webhooks) whose responses list only text/plain.'
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, description: 'Stable, derived from the HTTP status (see info.description).' }
            message: { type: string, description: 'Human text, not stable.' }
            request_id: { type: string, description: 'Same value as the X-Request-ID response header.' }
    AccountRef:
      type: object
      additionalProperties: false
      description: 'Exactly one of account_id or directory_company_id.'
      properties:
        account_id: { type: string, format: uuid }
        directory_company_id: { type: string }
        relationship_type: { type: string, enum: [employee, owner, technical_contact, billing_contact, administrative_contact, representative, contractor, other], default: other }
        primary: { type: boolean }
        evidence_id: { type: string, format: uuid, description: 'With directory_company_id only: the suggestion this company came from. The server re-checks it belongs to this contact and names this company; the link is then recorded as ticket_flow.' }
    CompanySuggestion:
      type: object
      required: [evidence_id, external_company_id, connection_id, source, first_verified_at, last_verified_at, already_linked]
      properties:
        evidence_id: { type: string, format: uuid }
        external_company_id: { type: string, description: 'Use it as directory_company_id when accepting.' }
        connection_id: { type: string, format: uuid }
        source: { type: string, example: ticket_selection }
        first_verified_at: { type: string, format: date-time }
        last_verified_at: { type: string, format: date-time }
        account_id: { type: string, format: uuid, description: 'The local account already materialized for this provider company, if any.' }
        account_name: { type: string }
        already_linked: { type: boolean }
    ContactAccountLink:
      type: object
      required: [id, account_id, account_name, relationship_type, status, primary, source, created_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        account_name: { type: string }
        relationship_type: { type: string }
        status: { type: string, enum: [active, ended] }
        primary: { type: boolean }
        source: { type: string }
        created_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
    ContactClassification:
      type: object
      required: [kind, accounts]
      properties:
        kind: { type: string, enum: [unclassified, customer, other, spam] }
        classification_source: { type: string, nullable: true, description: 'manual | import | trusted_crm | ticket_flow | rule | ai_suggestion_confirmed | migration | backfill' }
        classified_at: { type: string, format: date-time, nullable: true }
        accounts: { type: array, items: { $ref: '#/components/schemas/ContactAccountLink' } }
    UserChannelIdentity:
      type: object
      required: [id, user_id, identity_type, value, status, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        identity_type: { type: string, enum: [phone, email, provider_participant] }
        value: { type: string, description: 'Normalized value.' }
        status: { type: string, enum: [pending, verified, revoked] }
        verification_source: { type: string, enum: [admin, provider_verified, challenge, import_verified] }
        verified_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    IdentityConflict:
      type: object
      required: [id, identity_id, contact_id, status, detected_at]
      properties:
        id: { type: string, format: uuid }
        identity_id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        status: { type: string, enum: [open, resolved] }
        resolution: { type: string, enum: [confirmed_internal, identity_revoked] }
        note: { type: string }
        detected_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
    TopicAccountRef:
      type: object
      required: [account_id, name, source, persisted, linked_to_contact]
      properties:
        account_id: { type: string, format: uuid }
        name: { type: string }
        source: { type: string, enum: [topic_link, ticket, sole_company] }
        persisted: { type: boolean, description: 'Only a person''s choice (topic_link) is stored; the other sources are derived on read.' }
        linked_to_contact: { type: boolean }
    TopicAccountContext:
      type: object
      required: [status, related, candidates]
      properties:
        status: { type: string, enum: [resolved, needs_choice, none] }
        primary: { $ref: '#/components/schemas/TopicAccountRef' }
        related: { type: array, items: { $ref: '#/components/schemas/TopicAccountRef' } }
        candidates:
          type: array
          description: 'The contact''s active companies, when status is needs_choice.'
          items:
            type: object
            required: [account_id, name, relationship_type, contact_primary]
            properties:
              account_id: { type: string, format: uuid }
              name: { type: string }
              relationship_type: { type: string }
              contact_primary: { type: boolean, description: 'The contact''s own preference. It is not an answer: primary is not exclusive.' }
    PersonContact:
      allOf:
        - { $ref: '#/components/schemas/ContactItem' }
        - type: object
          required: [subject_type, account_count]
          properties:
            subject_type: { type: string, enum: [contact] }
            account_count: { type: integer, description: 'Active companies of the contact' }
            primary_account_name: { type: string }
    PersonInternalUser:
      type: object
      required: [subject_type, id, display_name, email, status, role_key, role_name, manage_path, updated_at]
      properties:
        subject_type: { type: string, enum: [internal_user] }
        id: { type: string, format: uuid, description: 'The USER id (never a contact id)' }
        display_name: { type: string }
        email: { type: string }
        status: { type: string, enum: [active, inactive], description: 'Membership status' }
        role_key: { type: string }
        role_name: { type: string }
        manage_path: { type: string, description: 'SPA route where access is managed' }
        updated_at: { type: string, format: date-time }
    ContactNote:
      type: object
      required: [id, body, author_name, created_at, updated_at, mine]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        author_user_id: { type: string, format: uuid, nullable: true }
        author_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        mine: { type: boolean, description: 'The caller wrote it: only the author edits or removes a note.' }
    CustomerAccount:
      type: object
      required: [id, name, account_type, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        account_type: { type: string, enum: [customer, partner, internal, other] }
        status: { type: string, enum: [active, inactive, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        external_links:
          type: array
          items: { $ref: '#/components/schemas/AccountExternalLink' }
    AccountExternalLink:
      type: object
      required: [id, provider, connection_id, external_company_id, status, source]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        connection_id: { type: string, format: uuid }
        external_company_id: { type: string, description: 'Meaningful only together with provider and connection.' }
        external_name_snapshot: { type: string }
        status: { type: string, enum: [active, inactive] }
        source: { type: string, enum: [directory_selection, ticket_flow, crm_evidence, import] }
        verified_at: { type: string, format: date-time }
    TopicRestructure:
      type: object
      required: [messages_linked, group_messages_linked, entities_copied, tickets_linked, source_status]
      properties:
        messages_linked: { type: integer }
        group_messages_linked: { type: integer }
        entities_copied: { type: integer }
        tickets_linked: { type: integer }
        source_status: { type: string, enum: [open, archived] }
        new_topic: { $ref: '#/components/schemas/Topic' }
    AIToolView:
      type: object
      required: [name, description, risk, permission, ai_requires_approval]
      properties:
        name: { type: string }
        description: { type: string }
        risk: { type: string, enum: [read, low_write] }
        permission: { type: string }
        ai_requires_approval: { type: boolean }
    AIToolInvoke:
      type: object
      required: [tool, idempotency_key]
      additionalProperties: false
      properties:
        tool: { type: string }
        args: { type: object, description: 'Strictly validated per tool; unknown fields are refused' }
        idempotency_key: { type: string, minLength: 8, maxLength: 64 }
        proposed_by: { type: string, enum: [ai, agent], default: ai }
    AIToolCall:
      type: object
      required: [id, tool, risk, source, status, args, result_is_untrusted_data]
      properties:
        id: { type: string, format: uuid }
        tool: { type: string }
        risk: { type: string, enum: [read, low_write] }
        source: { type: string, enum: [ai, agent] }
        status: { type: string, enum: [executed, pending_approval, rejected, denied, failed] }
        args: { type: object }
        result: { type: object }
        result_is_untrusted_data: { type: boolean, enum: [true] }
        error: { type: string }
    CopilotSuggestion:
      type: object
      required: [reply, missing_info, needs_human, warnings, sent]
      properties:
        reply: { type: string }
        missing_info: { type: array, items: { type: string } }
        needs_human: { type: boolean }
        warnings:
          type: array
          items: { type: string, enum: [link_not_in_context, email_not_in_context, phone_not_in_context, number_not_in_context, amount_mentioned, claims_action_done, contains_promise] }
        answered_message_id: { type: string, format: uuid }
        based_on_messages: { type: integer }
        confirmed_summary_version: { type: integer, nullable: true }
        model: { type: string }
        prompt_version: { type: string }
        sent: { type: boolean, enum: [false] }
    AIUsage:
      type: object
      required: [month, budget_usd, spent_usd, remaining_usd, items]
      properties:
        month: { type: string, example: '2026-10' }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        budget_usd: { type: number }
        spent_usd: { type: number }
        remaining_usd: { type: number }
        items:
          type: array
          items:
            type: object
            required: [provider, model, task, calls, failures, input_tokens, output_tokens, estimated_cost_usd]
            properties:
              provider: { type: string }
              model: { type: string }
              task: { type: string }
              calls: { type: integer }
              failures: { type: integer }
              input_tokens: { type: integer }
              output_tokens: { type: integer }
              estimated_cost_usd: { type: number }
    TopicHandoff:
      type: object
      required: [id, status, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, redeemed, revoked, expired] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        source_group_id: { type: string, format: uuid }
        redeemed_at: { type: string, format: date-time }
        redeemed_conversation_id: { type: string, format: uuid }
    TicketPolicyAdvice:
      type: object
      required: [action, reason, allowed_actions]
      properties:
        action: { type: string, enum: [none, adopt_active, share_active, create, needs_agent] }
        ticket_id: { type: string, format: uuid }
        reason: { type: string }
        allowed_actions: { type: array, items: { type: string, enum: [adopt_active, share_active, create] } }
    TicketPolicyResult:
      type: object
      required: [action, ticket_id, relation, created]
      properties:
        action: { type: string }
        ticket_id: { type: string, format: uuid }
        relation: { type: string, enum: [primary, related] }
        created: { type: boolean }
    TopicSummary:
      type: object
      required: [id, version, summary_text, status, authored_by, created_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        summary_text: { type: string }
        status: { type: string, enum: [ai_inferred, agent_confirmed, customer_confirmed, corrected, superseded] }
        authored_by: { type: string, enum: [machine, agent] }
        model_provider: { type: string }
        model_name: { type: string }
        prompt_version: { type: string }
        source_summary_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time }
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, key, name, permissions]
            properties:
              id: { type: string, format: uuid }
              key: { type: string, example: tenant_supervisor }
              name: { type: string }
              permissions: { type: array, items: { type: string, example: conversation.manage } }
    MyAccess:
      type: object
      required: [role_key, permissions, invitation_delivery_available]
      properties:
        role_key: { type: string, example: tenant_agent }
        permissions: { type: array, items: { type: string } }
        invitation_delivery_available: { type: boolean }
    SessionProfile:
      type: object
      required: [user, tenant]
      properties:
        user:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            name: { type: string }
        tenant:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
    ContactItem:
      type: object
      required: [id, display_name, phone_e164, email, status, kind, created_at, updated_at, last_interaction_at, channels, open_conversation_count]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, description: "The PRINCIPAL name: the team's alias when there is one, else the name declared on WhatsApp" }
        alias: { type: string, nullable: true, description: 'The name the team gave the contact; null = none (clearing it falls back to the WhatsApp name)' }
        whatsapp_name: { type: string, description: 'The name the person declared on WhatsApp, kept current from their messages; shown smaller below the principal name' }
        phone_e164: { type: string, description: E.164 }
        email: { type: string }
        status: { type: string, enum: [active, blocked, archived] }
        kind: { type: string, enum: [unclassified, customer, other, spam], description: 'Who the contact is for the business (ADR-0014); distinct from status' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_interaction_at: { type: string, format: date-time, nullable: true, description: 'Newest message across the contact''s conversations; null when it has none (CONTACT.360-A)' }
        channels: { type: array, items: { type: string }, description: 'Distinct channel kinds (e.g. whatsapp) of the contact''s conversations; empty, never null' }
        open_conversation_count: { type: integer, minimum: 0 }
    SetContactKindRequest:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [unclassified, customer, other, spam] }
    ContactPage:
      type: object
      required: [items, has_more, count, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContactItem' }
        has_more: { type: boolean }
        next_cursor: { type: string }
        count: { type: integer }
        limit: { type: integer }
    GroupLastMessage:
      type: object
      required: [author_name, from_me, message_type, preview]
      properties:
        author_name: { type: string }
        from_me: { type: boolean }
        message_type: { type: string, enum: [text, image, video, audio, document, sticker, location, other] }
        preview: { type: string, description: First 160 characters of the body }
    GroupItem:
      type: object
      required: [id, name, enabled, last_message_at, last_message]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
        last_message_at: { type: string, format: date-time, nullable: true }
        last_message: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/GroupLastMessage' }] }
    GroupList:
      type: object
      required: [items, count]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/GroupItem' } }
        count: { type: integer, minimum: 0 }
    AvailableGroup:
      type: object
      required: [provider_group_id, name, participant_count, enabled, group_id]
      properties:
        provider_group_id: { type: string, description: 'WhatsApp group id (<digits>@g.us)' }
        name: { type: string }
        participant_count: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        group_id: { type: string, format: uuid, nullable: true, description: 'Set once the group is known to OMNIRA' }
    AvailableGroupList:
      type: object
      required: [items, count, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AvailableGroup' } }
        count: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    EnableGroupRequest:
      type: object
      required: [provider_group_id]
      additionalProperties: false
      properties:
        provider_group_id: { type: string }
    SetGroupEnabledRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
    GroupMessage:
      type: object
      required: [id, author_name, from_me, message_type, body, sent_at]
      properties:
        id: { type: string, format: uuid }
        author_name: { type: string, description: 'Free label chosen by the sender; never an identity. No phone number is stored or served.' }
        from_me: { type: boolean }
        message_type: { type: string, enum: [text, image, video, audio, document, sticker, location, other] }
        body: { type: string }
        sent_at: { type: string, format: date-time }
    GroupMessagePage:
      type: object
      required: [items, has_more, count, limit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/GroupMessage' } }
        next_cursor: { type: string }
        has_more: { type: boolean }
        count: { type: integer }
        limit: { type: integer }
    InboxSettings:
      type: object
      required: [wait_warn_minutes, wait_danger_minutes]
      additionalProperties: false
      properties:
        wait_warn_minutes: { type: integer, minimum: 1, description: 'Attention (yellow) after this many minutes waiting' }
        wait_danger_minutes: { type: integer, minimum: 2, maximum: 10080, description: 'Critical (red) after this many minutes waiting; greater than wait_warn_minutes' }
    QueueItem:
      type: object
      description: tenant_id is never exposed; the session establishes the tenant.
      required: [id, name, mode, is_default, member_count, available_count, open_conversation_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        mode: { type: string, enum: [manual, round_robin] }
        is_default: { type: boolean, description: 'The queue that routes new conversations; exactly one when routing is on' }
        member_count: { type: integer, minimum: 0 }
        available_count: { type: integer, minimum: 0, description: 'Members that are active and available in this queue (eligibility, not presence)' }
        open_conversation_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QueueList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QueueItem' }
        count: { type: integer }
    CreateQueueRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        mode: { type: string, enum: [manual, round_robin], default: manual }
        is_default: { type: boolean, default: false }
    UpdateQueueRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        mode: { type: string, enum: [manual, round_robin] }
        is_default: { type: boolean }
    MyTenant:
      type: object
      required: [id, legal_name, isolation_profile, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        legal_name: { type: string }
        trade_name: { type: string }
        tax_id: { type: string }
        isolation_profile: { type: string, enum: [shared_strong_isolation, dedicated_database] }
        status: { type: string, enum: [active] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContactLastMessage:
      type: object
      required: [direction, message_type, body_preview, created_at]
      properties:
        direction: { type: string, enum: [inbound, outbound] }
        message_type: { type: string, enum: [text, image, video, audio, document, sticker] }
        body_preview: { type: string, description: 'Body truncated to 140 characters plus an ellipsis; empty for media without caption' }
        created_at: { type: string, format: date-time }
    ContactConversationItem:
      type: object
      required: [id, status, title, channel, provider, assigned_to_user_id, message_count, last_message, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, example: open }
        title: { type: string }
        channel: { type: string, nullable: true, description: 'null when the conversation has no channel connection' }
        provider: { type: string, nullable: true }
        assigned_to_user_id: { type: string, format: uuid, nullable: true }
        message_count: { type: integer, minimum: 0 }
        last_message: { type: object, nullable: true, allOf: [ { $ref: '#/components/schemas/ContactLastMessage' } ] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContactConversationPage:
      type: object
      required: [items, has_more, count, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContactConversationItem' }
        has_more: { type: boolean }
        next_cursor: { type: string }
        count: { type: integer }
        limit: { type: integer }
    ContactTicketItem:
      type: object
      required: [id, conversation_id, subject, status, priority, assigned_to, provider, external_ticket_id, external_status_label, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        subject: { type: string }
        status: { type: string, enum: [open, in_progress, waiting, resolved, closed] }
        priority: { type: string, enum: [critical, high, medium, low] }
        assigned_to: { type: string, format: uuid, nullable: true }
        provider: { type: string, nullable: true }
        external_ticket_id: { type: string, nullable: true }
        external_status_label: { type: string, nullable: true }
        customer_account_id: { type: string, format: uuid, description: "The OMNIRA account the ticket targets (ADR-0018); absent for tickets that predate accounts" }
        customer_account_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContactTicketPage:
      type: object
      required: [items, has_more, count, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContactTicketItem' }
        has_more: { type: boolean }
        next_cursor: { type: string }
        count: { type: integer }
        limit: { type: integer }
    ConversationItem:
      type: object
      required: [id, status, title, contact_name, contact_phone, conversation_kind, has_unclassified_participants, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid, description: 'Absent for an internal conversation: staff are never contacts (ADR-0018)' }
        internal_user_id: { type: string, format: uuid, description: 'The verified staff member of an internal conversation' }
        conversation_kind: { type: string, enum: [internal, customer_service, external_other, unclassified], description: 'Derived from who takes part (ADR-0018). There is no "mixed" kind.' }
        has_unclassified_participants: { type: boolean, description: 'At least one participant is not classified yet (or an identity conflict is open)' }
        channel_connection_id: { type: string, format: uuid }
        status: { type: string, example: open }
        title: { type: string }
        assigned_to_user_id: { type: string, format: uuid, description: 'absent when unassigned' }
        queue_id: { type: string, format: uuid }
        contact_name: { type: string, description: "The principal name: the team's alias, else the name declared on WhatsApp" }
        contact_whatsapp_name: { type: string, description: 'What the person declared on WhatsApp; shown smaller below contact_name when it differs' }
        contact_phone: { type: string, description: E.164 }
        ticket_status: { type: string }
        ticket_priority: { type: string }
        contact_kind: { type: string, enum: [unclassified, customer, other, spam], description: 'Classification of the conversation''s contact (ADR-0014)' }
        last_message_at: { type: string, format: date-time, description: 'List only' }
        last_message_direction: { type: string, enum: [inbound, outbound], description: 'List only' }
        last_message_type: { type: string, description: 'List only' }
        last_message_preview: { type: string, description: 'List only; first 160 characters of the last message body' }
        waiting_since: { type: string, format: date-time, description: 'List only; when the customer started waiting for an answer, absent when the last message is ours' }
        message_count: { type: integer, minimum: 0, description: 'Only on the single-conversation read (GET /inbox/conversations/{id}); omitted from list items' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ConversationPage:
      type: object
      required: [items, has_more, count, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConversationItem' }
        has_more: { type: boolean }
        next_cursor: { type: string }
        count: { type: integer }
        limit: { type: integer }
    AIIntegration:
      type: object
      required: [provider, enabled, model, monthly_budget_usd, key_configured, consent_text, consent_version, consent_current]
      properties:
        provider: { type: string, enum: [gemini] }
        enabled: { type: boolean }
        model: { type: string }
        monthly_budget_usd: { type: number }
        key_configured: { type: boolean }
        key_set_at: { type: string, format: date-time }
        key_set_by: { type: string }
        consent_text: { type: string }
        consent_version: { type: string }
        consent_current: { type: boolean, description: The tenant accepted the current text version }
        consent_at: { type: string, format: date-time }
        consent_by: { type: string }
        last_test: { $ref: '#/components/schemas/AIIntegrationTest' }
    AIIntegrationUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        model: { type: string, pattern: '^[A-Za-z0-9._-]{1,100}$' }
        monthly_budget_usd: { type: number, minimum: 0, maximum: 10000 }
        api_key: { type: string, writeOnly: true, minLength: 20, maxLength: 200 }
        accept_external_ai: { type: boolean }
    AIIntegrationTest:
      type: object
      required: [at, ok, message]
      properties:
        at: { type: string, format: date-time }
        ok: { type: boolean }
        message: { type: string }
        model_available: { type: boolean }
    AmbiguityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ambiguity' }
    Ambiguity:
      type: object
      required: [id, message_id, kind, candidates, created_at]
      properties:
        id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        kind: { type: string, enum: [conversation, group] }
        candidates:
          type: array
          items:
            type: object
            properties:
              topic_id: { type: string, format: uuid }
              title: { type: string }
              score: { type: number }
              signals: { type: array, items: { type: object } }
        created_at: { type: string, format: date-time }
    Topic:
      type: object
      required: [id, title, status, privacy_policy, source, legacy_unsegmented, last_activity_at, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        intent: { type: string }
        category: { type: string }
        status: { type: string, enum: [open, resolved, archived] }
        privacy_policy: { type: string, enum: [public, private_recommended, private_required] }
        source: { type: string, enum: [manual, rule, ai, handoff, legacy_backfill] }
        routing_confidence: { type: number, minimum: 0, maximum: 1 }
        legacy_unsegmented: { type: boolean }
        primary_contact_id: { type: string, format: uuid }
        origin_conversation_id: { type: string, format: uuid }
        last_activity_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        merged_into_topic_id: { type: string, format: uuid, description: 'Set on a topic that was merged into another (it is archived)' }
        split_from_topic_id: { type: string, format: uuid, description: 'Set on a topic created by splitting another' }
        message_count: { type: integer }
        ticket_count: { type: integer }
        last_message_at: { type: string, format: date-time }
    TopicList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Topic' }
    CreateTopicRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        intent: { type: string }
        category: { type: string }
        privacy_policy: { type: string, enum: [public, private_recommended, private_required] }
        message_ids:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
    UpdateTopicRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        intent: { type: string }
        category: { type: string }
        privacy_policy: { type: string, enum: [public, private_recommended, private_required] }
        status: { type: string, enum: [open, resolved] }
    TopicMessage:
      type: object
      required: [id, conversation_id, direction, message_type, status, created_at, relation, decision_source]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        message_type: { type: string }
        body: { type: string }
        mime_type: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        relation: { type: string, enum: [primary, secondary, supporting, ambiguous] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        decision_source: { type: string, enum: [explicit, handoff, reply, entity, rule, ai, agent, customer, legacy] }
    TopicMessagePage:
      type: object
      required: [items, has_more, count, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TopicMessage' }
        has_more: { type: boolean }
        next_cursor: { type: string }
        count: { type: integer }
        limit: { type: integer }
    TopicTicket:
      type: object
      required: [id, status, priority, subject, relation, linked_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        priority: { type: string }
        subject: { type: string }
        provider: { type: string }
        external_ticket_id: { type: string }
        relation: { type: string, enum: [primary, related, child, merged] }
        linked_at: { type: string, format: date-time }
    TopicTicketList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TopicTicket' }
    MessageItem:
      type: object
      required: [id, conversation_id, direction, message_type, status, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        channel_connection_id: { type: string, format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        message_type: { type: string, enum: [text, image, video, audio, document, sticker] }
        body: { type: string }
        media_ref: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [received, queued, sent, delivered, read, failed, uncertain] }
        created_at: { type: string, format: date-time }
        media_status:
          type: string
          enum: [pending, quarantined, clean, infected, rejected, source_gone, failed]
          description: |
            State of the attachment pipeline (ADR-0016); absent for messages without media. Only `clean` can be
            downloaded; `pending`/`quarantined` mean the file is still being checked.
        media_text:
          type: string
          description: |
            Text derived from the attachment, today the audio transcript made locally (ADR-0016). Untrusted data:
            show it as plain text, never as markup or links. It stays on the message after the file is removed.
        media_text_status: { type: string, enum: [pending, done, empty, failed] }
        media_text_suspicious:
          type: boolean
          description: The text looks like it is giving instructions to an AI model.
    MessagePage:
      type: object
      required: [items, has_more, count, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MessageItem' }
        has_more: { type: boolean }
        next_cursor: { type: string }
        count: { type: integer }
        limit: { type: integer }
    SendMessageRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4096 }
    QueuedMessage:
      type: object
      required: [id, conversation_id, direction, body, status, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        direction: { type: string, enum: [outbound] }
        body: { type: string }
        status: { type: string, enum: [queued, sent, delivered, read, failed, uncertain] }
        created_at: { type: string, format: date-time }
    AssignRequest:
      type: object
      properties:
        assignee_user_id:
          type: string
          format: uuid
          description: Optional. Absent = claim for yourself. Requires `conversation.manage` for another agent.
    AssignResult:
      type: object
      required: [conversation_id, assigned_to_user_id, changed]
      properties:
        conversation_id: { type: string, format: uuid }
        assigned_to_user_id: { type: string, format: uuid, nullable: true }
        changed: { type: boolean }
    ParticipantTargetRequest:
      type: object
      required: [target_user_id]
      properties:
        target_user_id:
          type: string
          format: uuid
          description: The agent being invited or transferred to. Must be an eligible agent of this tenant.
    InviteResult:
      type: object
      required: [participant_id, target_user_id, role, changed]
      properties:
        participant_id: { type: string, format: uuid }
        target_user_id: { type: string, format: uuid }
        role: { type: string, description: "Participant role, e.g. `INVITED`" }
        changed: { type: boolean, description: "false when the invitation already existed (idempotent no-op)" }
    TransferResult:
      type: object
      required: [changed]
      properties:
        previous_assignee: { type: string, format: uuid, nullable: true }
        new_assignee: { type: string, format: uuid, nullable: true }
        changed: { type: boolean, description: "false when the target already owned the conversation" }
    AcceptInviteResult:
      type: object
      required: [participant_id]
      properties:
        participant_id: { type: string, format: uuid }
        joined_at: { type: string, format: date-time, nullable: true }
    RealtimeEvent:
      type: object
      required: [type, id, timestamp]
      properties:
        type: { type: string, enum: [message_received, message_status, conversation_updated] }
        id: { type: string, format: uuid, description: conversation id }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          description: 'References only. message_received {message_id, direction, status}; message_status {message_id, status}; conversation_updated {reason, assigned_to_user_id, status}.'
          additionalProperties: true
    CreateConnectionRequest:
      type: object
      required: [risk_acknowledged]
      properties:
        risk_acknowledged: { type: boolean, description: 'Must be true' }
    CreateGenericConnectionRequest:
      type: object
      required: [provider]
      additionalProperties: false
      properties:
        provider: { type: string, example: waha }
        inputs:
          type: object
          additionalProperties: { type: string }
          description: Write-only values accepted by the selected provider descriptor; never returned.
        risk_acknowledged: { type: boolean, description: 'Required and true for unofficial providers' }
    ProviderDescriptor:
      type: object
      required: [id, name, channel, kind, connect_method, capabilities, enabled, inputs, displays]
      properties:
        id: { type: string, example: waha }
        name: { type: string, example: 'WhatsApp (não oficial)' }
        channel: { type: string, example: whatsapp }
        kind: { type: string, enum: [official, unofficial] }
        connect_method: { type: string, enum: [qr_session, credentials, oauth_redirect] }
        risk_notice: { type: string }
        capabilities: { type: array, items: { type: string } }
        enabled: { type: boolean }
        unavailable_reason: { type: string }
        inputs:
          type: array
          items: { $ref: '#/components/schemas/ProviderInputDescriptor' }
        displays:
          type: array
          items: { $ref: '#/components/schemas/ProviderDisplayDescriptor' }
    ProviderInputDescriptor:
      type: object
      required: [key, label, type, required, secret]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, secret, select, phone] }
        required: { type: boolean }
        pattern: { type: string }
        help: { type: string }
        example: { type: string }
        secret: { type: boolean }
        options: { type: array, items: { type: string } }
    ProviderDisplayDescriptor:
      type: object
      required: [key, label, copyable, sensitive]
      properties:
        key: { type: string }
        label: { type: string }
        value_template: { type: string }
        copyable: { type: boolean }
        sensitive: { type: boolean }
        help: { type: string }
    ChannelConnection:
      type: object
      required: [id, provider, provider_kind, status, capabilities, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, example: waha }
        provider_kind: { type: string, enum: [official, unofficial] }
        status: { type: string, enum: [pending, active, degraded, disconnected, failed, revoked] }
        session_status: { type: string, enum: [missing, starting, needs_qr, working, stopped, failed], description: 'Only on GET / start / stop' }
        external_account_id: { type: string, description: Paired account (digits) }
        capabilities: { type: array, items: { type: string } }
        risk_acknowledged_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    QRImage:
      type: object
      required: [mimetype, data]
      properties:
        mimetype: { type: string, example: image/png }
        data: { type: string, description: base64 }
    WahaWebhook:
      type: object
      required: [id, event, session, payload]
      properties:
        id: { type: string, description: 'Event id — deduplication key' }
        event: { type: string, enum: [message, message.any, message.ack, session.status] }
        session: { type: string, description: 'Must equal omnira_<connection_id>' }
        payload: { type: object, additionalProperties: true }
