        reply: { type: string }
        missing_info: { type: array, items: { type: string } }
        needs_human: { type: boolean }
        warnings:
          type: array
          items: { type: string, enum: [link_not_in_context, email_not_in_context, phone_not_in_context, number_not_in_context, amount_mentioned, claims_action_done, contains_promise] }
        answered_message_id: { type: string, format: uuid }
        based_on_messages: { type: integer }
        confirmed_summary_version: { type: integer, nullable: true }
        model: { type: string }
        prompt_version: { type: string }
        sent: { type: boolean, enum: [false] }
    AIUsage:
      type: object
      required: [month, budget_usd, spent_usd, remaining_usd, items]
      properties:
        month: { type: string, example: '2026-10' }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        budget_usd: { type: number }
        spent_usd: { type: number }
        remaining_usd: { type: number }
        items:
          type: array
          items:
            type: object
            required: [provider, model, task, calls, failures, input_tokens, output_tokens, estimated_cost_usd]
            properties:
              provider: { type: string }
              model: { type: string }
              task: { type: string }
              calls: { type: integer }
              failures: { type: integer }
              input_tokens: { type: integer }
              output_tokens: { type: integer }
              estimated_cost_usd: { type: number }
    TopicHandoff:
      type: object
      required: [id, status, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, redeemed, revoked, expired] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        source_group_id: { type: string, format: uuid }
