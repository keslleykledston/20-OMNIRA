          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/RealtimeEvent' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
        '503': { description: "Realtime unavailable (no NATS)", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/inbox/conversations/{conversation_id}/events:
    get:
      operationId: streamConversationEvents
      tags: [Realtime]
      summary: Server-Sent Events for one conversation
      description: *sse
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200':
          description: "Stream of `data: <RealtimeEvent JSON>` frames"
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/RealtimeEvent' }
        '400': { $ref: '#/components/responses/Text400' }
        '401': { $ref: '#/components/responses/Text401' }
        '404': { $ref: '#/components/responses/Text404' }
        '503': { description: "Realtime unavailable (no NATS)", content: { text/plain: { schema: { type: string } } } }
  /tenants/{tenant_id}/channels/providers:
    get:
      operationId: listChannelProviders
