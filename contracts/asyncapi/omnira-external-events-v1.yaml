asyncapi: 2.6.0
info:
  title: OMNIRA external events (Headless)
  version: 1.0.0-lab
  description: |
    The facts an external application (a CRM) receives about the conversations it may see (ADR-0048). Two ways to get the same facts, with the same envelope:

    * **Pull** — `GET /api/v1/external/events?after=<seq>` (see `omnira-external-v1.yaml`). Durable, ordered per company by `seq`, kept for the retention period (30 days by
      default). This is the source of truth: a receiver that was down reads what it missed from here. `410 resync_required` when the cursor is older than what is kept.
    * **Push** — signed HTTPS webhooks to the endpoints the company's administrator configured. At least once: a fact may arrive more than once and out of order across
      conversations; deduplicate by `event_id`, order one conversation's facts by `aggregate_version`.

    **Service facts (ADR-0049)** — protocols, occurrences, tasks and ERP records (`service_*`, `external_record.*`, `external_request.*`) — are delivered only to an installation that holds the scope `service.read`. One tied to a conversation follows that conversation's visibility and the installation's queue/line limits; one with no conversation (an occurrence, a task, an ERP record) is delivered only to an installation with NO limit. Their `data` carries `links` (ids), `actor_type` and the module's own payload (ids, enums, counts); the note a person typed never leaves.

    **The envelope never carries content.** No message text, no phone number, no name, no attachment: only identifiers, kinds, statuses and counters. Fetch the content with
    the read API (`GET /external/conversations/{id}/messages`, `/contacts/{id}`, `/media/{id}`) — which re-checks, at that moment, that the installation may see it.
    Only facts of conversations the installation may see are sent; a conversation that stops being visible simply stops producing facts.

    **Bootstrap without gaps:** read `GET /external/sync/checkpoint` FIRST, then page the snapshot (`/external/conversations`, `/messages`), then read the events after the
    checkpoint's `seq_head`. A fact already reflected in the snapshot and replayed is harmless (it is a reference), and a fact after the checkpoint is always replayed.

    ## Signature
    `X-Omnira-Signature: v1=<hex>` where `<hex>` = HMAC-SHA256(secret, `<X-Omnira-Timestamp>` + `.` + RAW BODY BYTES). Verify the raw bytes you received (do not parse and
    re-serialize). During a secret rotation the header carries two values separated by a comma (`v1=<new>,v1=<old>`); accept if either matches. Reject a timestamp more than
    5 minutes away from your clock (replay). A worked, verifiable example is `contracts/samples/external/webhook-delivery.sample.json`.

    ## Headers of every call
    `X-Omnira-Event-ID` (the `event_id`, stable for ever), `X-Omnira-Delivery-ID` (stable across retries of one delivery), `X-Omnira-Timestamp`, `X-Omnira-Signature`,
    `X-Omnira-Key-ID` (which secret signed it), `Content-Type: application/json`.

    ## Answers and retries
    Answer 2xx to acknowledge. Anything else (or no answer within the timeout) is retried with exponential backoff (5 s doubling to 1 h, ±20 % jitter) for 72 hours; after that the
    delivery goes to the dead-letter list, where the administrator can re-send it. A redirect is **not** followed (it counts as a failure). The endpoint must be `https`, on a public
    address, with no credentials in the URL, on port 443 or 8443; the address is checked again at every connection.
  license: { name: Proprietary }
defaultContentType: application/json
channels:
  customer-webhook:
    description: The HTTPS endpoint of the application. OMNIRA POSTs one fact per call.
    bindings:
      http: { type: request, method: POST }
    publish:
      operationId: receiveExternalEvent
      summary: A fact about a conversation, message, contact or ticket the installation may see
      message:
        oneOf:
          - $ref: '#/components/messages/ConversationCreated'
          - $ref: '#/components/messages/ConversationControlChanged'
          - $ref: '#/components/messages/ConversationClosed'
          - $ref: '#/components/messages/MessageCreated'
          - $ref: '#/components/messages/MessageStatusChanged'
          - $ref: '#/components/messages/ContactUpdated'
          - $ref: '#/components/messages/TicketLinked'
          - $ref: '#/components/messages/ServiceSessionOpened'
          - $ref: '#/components/messages/ServiceSessionClassified'
          - $ref: '#/components/messages/ServiceSessionStatusChanged'
          - $ref: '#/components/messages/ServiceSessionClosed'
          - $ref: '#/components/messages/ServiceSessionReopened'
          - $ref: '#/components/messages/ServiceCaseCreated'
          - $ref: '#/components/messages/ServiceCaseUpdated'
          - $ref: '#/components/messages/ServiceCaseResolved'
          - $ref: '#/components/messages/ServiceCaseAssigned'
          - $ref: '#/components/messages/ServiceCaseSessionLinked'
          - $ref: '#/components/messages/ServiceTaskCreated'
          - $ref: '#/components/messages/ServiceTaskUpdated'
          - $ref: '#/components/messages/ServiceTaskStatusChanged'
          - $ref: '#/components/messages/ServiceTaskCompleted'
          - $ref: '#/components/messages/ServiceTaskAssigned'
          - $ref: '#/components/messages/ExternalRecordLinked'
          - $ref: '#/components/messages/ExternalRecordUnlinked'
          - $ref: '#/components/messages/ExternalRecordStatusChanged'
          - $ref: '#/components/messages/ExternalRequestCreated'
          - $ref: '#/components/messages/ExternalRequestStateChanged'
components:
  messageTraits:
    signed:
      headers:
        type: object
        required: [X-Omnira-Signature, X-Omnira-Timestamp, X-Omnira-Event-ID, X-Omnira-Delivery-ID, X-Omnira-Key-ID]
        properties:
          X-Omnira-Signature: { type: string, example: 'v1=ba29bcae4c7101a52658c2ef2eb1a7b26f55a4547c84909da224acb26bc51eda' }
          X-Omnira-Timestamp: { type: string, description: Unix seconds }
          X-Omnira-Event-ID: { type: string, format: uuid }
          X-Omnira-Delivery-ID: { type: string, format: uuid }
          X-Omnira-Key-ID: { type: string }
  messages:
    ConversationCreated:
      name: conversation.created.v1
      title: A conversation was created
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-conversation.created.v1.json' } }]
    ConversationControlChanged:
      name: conversation.control_changed.v1
      title: Who holds the conversation changed (claim, release, transfer, takeover, lease expiry, close)
      description: "`aggregate_version` is the new control version; `origin.mine` is true when THIS installation caused it, so it can recognise its own echo and still follow later statuses."
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-conversation.control_changed.v1.json' } }]
    ConversationClosed:
      name: conversation.closed.v1
      title: The attendance was finalized
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-conversation.closed.v1.json' } }]
    MessageCreated:
      name: message.created.v1
      title: A message was received or queued (no content)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-message.created.v1.json' } }]
    MessageStatusChanged:
      name: message.status_changed.v1
      title: The delivery status of a message changed (queued, sent, delivered, read, failed...)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-message.status_changed.v1.json' } }]
    ContactUpdated:
      name: contact.updated.v1
      title: Fields of a contact changed (WHICH fields, never their values)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-contact.updated.v1.json' } }]
    TicketLinked:
      name: ticket.linked.v1
      title: A conversation's ticket was linked to the ERP
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-ticket.linked.v1.json' } }]
    ServiceSessionOpened:
      name: service_session.opened.v1
      title: Protocol opened (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_session.opened.v1.json' } }]
    ServiceSessionClassified:
      name: service_session.classified.v1
      title: Attendance classified (category) (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_session.classified.v1.json' } }]
    ServiceSessionStatusChanged:
      name: service_session.status_changed.v1
      title: Protocol status changed (in progress / waiting) (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_session.status_changed.v1.json' } }]
    ServiceSessionClosed:
      name: service_session.closed.v1
      title: Protocol closed (result) (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_session.closed.v1.json' } }]
    ServiceSessionReopened:
      name: service_session.reopened.v1
      title: Protocol reopened (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_session.reopened.v1.json' } }]
    ServiceCaseCreated:
      name: service_case.created.v1
      title: Occurrence opened (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_case.created.v1.json' } }]
    ServiceCaseUpdated:
      name: service_case.updated.v1
      title: Occurrence changed or its status moved (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_case.updated.v1.json' } }]
    ServiceCaseResolved:
      name: service_case.resolved.v1
      title: Occurrence resolved (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_case.resolved.v1.json' } }]
    ServiceCaseAssigned:
      name: service_case.assigned.v1
      title: Occurrence assigned (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_case.assigned.v1.json' } }]
    ServiceCaseSessionLinked:
      name: service_case.session_linked.v1
      title: Occurrence linked to a protocol (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_case.session_linked.v1.json' } }]
    ServiceTaskCreated:
      name: service_task.created.v1
      title: Task created (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_task.created.v1.json' } }]
    ServiceTaskUpdated:
      name: service_task.updated.v1
      title: Task changed (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_task.updated.v1.json' } }]
    ServiceTaskStatusChanged:
      name: service_task.status_changed.v1
      title: Task status changed (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_task.status_changed.v1.json' } }]
    ServiceTaskCompleted:
      name: service_task.completed.v1
      title: Task completed (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
