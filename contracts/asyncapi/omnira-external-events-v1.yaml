      examples: [{ payload: { $ref: '../samples/external/event-service_task.completed.v1.json' } }]
    ServiceTaskAssigned:
      name: service_task.assigned.v1
      title: Task assigned (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-service_task.assigned.v1.json' } }]
    ExternalRecordLinked:
      name: external_record.linked.v1
      title: ERP record linked (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-external_record.linked.v1.json' } }]
    ExternalRecordUnlinked:
      name: external_record.unlinked.v1
      title: ERP record unlinked (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
      payload: { $ref: '../jsonschema/external-event.v1.schema.json' }
      examples: [{ payload: { $ref: '../samples/external/event-external_record.unlinked.v1.json' } }]
    ExternalRecordStatusChanged:
      name: external_record.status_changed.v1
      title: ERP record status changed (needs the scope service.read)
      traits: [{ $ref: '#/components/messageTraits/signed' }]
