server {
  listen 80;
  server_name omnira.devops.k3gsolutions.com.br;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  # Cache assets com hash
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Backend-internal endpoints (health/metrics/modules) must never be reachable from the public side.
  location /internal/ {
    return 404;
  }

  # SSE (inbox realtime): never buffer, keep the connection open (the API sends a heartbeat every 20s)
  location ~ ^/api/v1/tenants/[^/]+/inbox/(conversations/[^/]+/)?events$ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # Proxy /api para backend
  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # SPA: rota /index.html para rotas desconhecidas
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
  }

}
