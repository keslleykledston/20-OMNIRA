server {
  listen 80;
  server_name omnira.devops.k3gsolutions.com.br;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  # The API is reached through a VARIABLE on purpose. With a literal `proxy_pass http://api:8080`, nginx resolves `api` once, at
  # start, and keeps that IP: recreating the api container (new IP) left this nginx pointing at a dead address, so the Meta
  # webhook answered 502 and inbound messages were lost (2026-10-07). With a variable, nginx asks Docker's embedded DNS again
  # (at most every `valid`), so replacing the api container needs no reload. Because the variable form passes the request URI
  # through untouched, no URI is written after the variable; every proxied location below keeps the same path it had before.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream api:8080;

  # Cache assets com hash
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The stock mime.types has no entry for .webmanifest (it was served as application/octet-stream); a `types` block here would
  # replace the whole table, so this one file gets its type directly. Short cache: the manifest is not content-hashed.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires 1d;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Backend-internal endpoints (health/metrics/modules) must never be reachable from the public side.
  location /internal/ {
    return 404;
  }

  # SSE (inbox realtime): never buffer, keep the connection open (the API sends a heartbeat every 20s)
  location ~ ^/api/v1/tenants/[^/]+/inbox/(conversations/[^/]+/)?events$ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # The Hub's change signal (SSE, no content): same treatment as the inbox streams above
  location ~ ^/api/v1/hubs/[^/]+/events$ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # Meta Cloud (WhatsApp oficial) webhook: verification challenge + inbound events, validated by signature in the API.
  # Only this exact path is exposed (the WAHA webhook stays on the internal network).
  location = /webhooks/v1/whatsapp/meta {
    proxy_pass http://$api_upstream;   # exact-match location: the request URI (with the hub.* query) is already /webhooks/v1/whatsapp/meta
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
  }

  # Proxy /api para backend
  location /api/ {
    proxy_pass http://$api_upstream;   # /api/ -> /api/: the original URI is already the upstream URI
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # ADR-0041: console de administração = segunda entrada do build (admin.html). O mesmo host, o mesmo cookie e o mesmo login do app do agente; o
  # proxy do host já encaminha tudo para este contêiner. Os arquivos estáticos continuam em /assets/ (regra acima).
  location = /admin { return 301 /admin/; }
  location /admin/ {
    try_files /admin.html =404;
    expires -1;
    add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Ajuda (wiki para clientes e integradores): página estática gerada de docs/wiki (python3 docs/wiki/_site/gerar.py --publico) e copiada de
  # public/ajuda para o build. Sem fallback para o SPA: um caminho errado em /ajuda/ é 404, não a tela de login. JS e CSS vêm de arquivos (a CSP
  # não permite script embutido); as imagens e os arquivos levam ?v=<hash> no endereço, então o cache longo da regra de ativos acima é seguro.
  location = /ajuda { return 301 /ajuda/; }
  location /ajuda/ {
    try_files $uri $uri/ =404;
    expires -1;
    add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA: rota /index.html para rotas desconhecidas
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
  }

}
