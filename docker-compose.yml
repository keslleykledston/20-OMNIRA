version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnira-postgres
    environment:
      POSTGRES_USER: omnira
      POSTGRES_PASSWORD: omnira
      POSTGRES_DB: omnira_dev
    ports:
      - "55434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnira -d omnira_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: omnira-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: -js -sd /data
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: omnira-otel
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    volumes:
      - ./config/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    command: ["--config=/etc/otel-collector-config.yml"]
    environment:
      - GOGC=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnira-api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=omnira
      - DB_PASSWORD=omnira
      - DB_NAME=omnira_dev
      - NATS_URL=nats://nats:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OMNIRA_CREDENTIALS_KEY=${OMNIRA_CREDENTIALS_KEY-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: omnira-web
    networks:
      - omnira-network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: omnira-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - omnira-network
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  nats_data:
    driver: local

networks:
  omnira-network:
    driver: bridge
