# Runtime environment shared by api and worker. The application connects as
# omnira_app (NOT the owner): the owner is a superuser and would bypass RLS; the
# services refuse to start with a privileged role. Migrations run as the owner in the
# one-shot `migrate` service (tools/migrate-sql.sh), which api and worker wait for.
x-omnira-runtime: &omnira-runtime
  OMNIRA_DATABASE_URL: postgres://omnira_app:${OMNIRA_APP_DB_PASSWORD:-omnira_app}@postgres:5432/${OMNIRA_DB_NAME:-omnira_dev}?sslmode=disable
  OMNIRA_NATS_URL: nats://nats:4222
  OMNIRA_OTEL_ENDPOINT: http://otel-collector:4317
  OMNIRA_ENV: ${OMNIRA_ENV-development}
  OMNIRA_AUTH_MODE: ${OMNIRA_AUTH_MODE-mock}
  # Sem isto não existe rota de login de desenvolvimento: a API a registra
  # apenas com a flag ligada num ambiente permitido.
  OMNIRA_DEV_AUTH_ENABLED: ${OMNIRA_DEV_AUTH_ENABLED-true}
  OMNIRA_AUTH_ISSUER: ${OMNIRA_AUTH_ISSUER-http://keycloak:8080/realms/omnira}
  OMNIRA_AUTH_AUDIENCE: ${OMNIRA_AUTH_AUDIENCE-omnira-web}
  OMNIRA_AUTH_CLIENT_ID: ${OMNIRA_AUTH_CLIENT_ID-omnira-web}
  OMNIRA_AUTH_CLIENT_SECRET: ${OMNIRA_AUTH_CLIENT_SECRET-}
  OMNIRA_AUTH_REDIRECT_URL: ${OMNIRA_AUTH_REDIRECT_URL-http://localhost:8080/api/v1/auth/oidc/callback}
  OMNIRA_AUTH_POST_LOGIN_URL: ${OMNIRA_AUTH_POST_LOGIN_URL-/login?oidc=complete}
  OMNIRA_AUTH_COOKIE_SECURE: ${OMNIRA_AUTH_COOKIE_SECURE-false}
  OMNIRA_CREDENTIALS_KEY: ${OMNIRA_CREDENTIALS_KEY-}
  OMNIRA_PUBLIC_BASE_URL: ${OMNIRA_PUBLIC_BASE_URL-}
  # Convites por e-mail (vazio = sem envio; em dev o admin copia o link). Dev: profile "dev" sobe o
  # Mailpit; use OMNIRA_SMTP_HOST=mailpit, OMNIRA_SMTP_PORT=1025, OMNIRA_SMTP_TLS=none.
  OMNIRA_WEB_BASE_URL: ${OMNIRA_WEB_BASE_URL-}
  OMNIRA_SMTP_HOST: ${OMNIRA_SMTP_HOST-}
  OMNIRA_SMTP_PORT: ${OMNIRA_SMTP_PORT-587}
  OMNIRA_SMTP_USERNAME: ${OMNIRA_SMTP_USERNAME-}
  OMNIRA_SMTP_PASSWORD: ${OMNIRA_SMTP_PASSWORD-}
  OMNIRA_SMTP_FROM: ${OMNIRA_SMTP_FROM-}
  OMNIRA_SMTP_REPLY_TO: ${OMNIRA_SMTP_REPLY_TO-}
  OMNIRA_SMTP_TLS: ${OMNIRA_SMTP_TLS-starttls}
  OMNIRA_WAHA_ENABLED: ${OMNIRA_WAHA_ENABLED-false}
  OMNIRA_WAHA_BASE_URL: ${OMNIRA_WAHA_BASE_URL-http://waha:3000}
  OMNIRA_WAHA_API_KEY: ${OMNIRA_WAHA_API_KEY-}
  OMNIRA_WAHA_ENGINE: ${OMNIRA_WAHA_ENGINE-GOWS}

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnira-postgres
    environment:
      POSTGRES_USER: omnira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnira}
      POSTGRES_DB: ${OMNIRA_DB_NAME:-omnira_dev}
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnira -d ${OMNIRA_DB_NAME:-omnira_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: omnira-nats
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    command: -js -sd /data
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    restart: unless-stopped

  keycloak-postgres:
    image: postgres:16-alpine
    container_name: omnira-keycloak-postgres
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: keycloak
    ports:
      - "127.0.0.1:55435:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: omnira-keycloak
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost:8888}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    volumes:
      - ./deploy/keycloak/omnira-realm.json:/opt/keycloak/data/import/omnira-realm.json:ro
    command: start --import-realm --optimized
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - omnira-network
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: omnira-otel
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./config/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    command: ["--config=/etc/otel-collector-config.yml"]
    environment:
      - GOGC=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:gows-2026.8.2
    profiles:
      - whatsapp-unofficial
    environment:
      WHATSAPP_DEFAULT_ENGINE: ${OMNIRA_WAHA_ENGINE-GOWS}
      WAHA_API_KEY: ${WAHA_API_KEY-}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    expose:
      - "3000"
    healthcheck:
      # The WAHA image ships curl (no wget) and /health requires the API key; /ping is public.
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ping >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - omnira-network
    restart: unless-stopped

  # One-shot, idempotent schema migration as the OWNER role (records versions in schema_migrations).
  # First adoption of a database whose schema was applied by hand: OMNIRA_MIGRATE_BASELINE=<last applied prefix>.
  migrate:
    image: postgres:16-alpine
    container_name: omnira-migrate
    entrypoint: ["/bin/sh", "/tools/migrate-sql.sh", "up"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: omnira
      PGPASSWORD: ${POSTGRES_PASSWORD:-omnira}
      PGDATABASE: ${OMNIRA_DB_NAME:-omnira_dev}
      APP_DB_PASSWORD: ${OMNIRA_APP_DB_PASSWORD-}
      BASELINE_UP_TO: ${OMNIRA_MIGRATE_BASELINE-}
    volumes:
      - ./migrations:/migrations:ro
      - ./tools/migrate-sql.sh:/tools/migrate-sql.sh:ro
    networks:
      - omnira-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # DEVELOPMENT ONLY (profile "dev"): seeds the users known to the mock login (test@omnira.local as
  # agent, admin@omnira.local as tenant admin) and one tenant. There is no real IdP yet.
  seed:
    image: postgres:16-alpine
    container_name: omnira-seed
    profiles: ["dev"]
    entrypoint: ["psql", "-X", "-q", "-v", "ON_ERROR_STOP=1", "-f", "/tools/seed-dev.sql"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: omnira
      PGPASSWORD: ${POSTGRES_PASSWORD:-omnira}
      PGDATABASE: ${OMNIRA_DB_NAME:-omnira_dev}
    volumes:
      - ./tools/seed-dev.sql:/tools/seed-dev.sql:ro
    networks:
      - omnira-network
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # DEVELOPMENT ONLY (profile "dev"): captura os e-mails de convite. UI em http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: omnira-mailpit
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - omnira-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: omnira-api
    ports:
      # loopback only: the API also serves the unauthenticated provider webhook; expose publicly only via a
      # reverse proxy that does NOT forward /webhooks or /internal (see web/nginx.conf, omnira-nginx.conf)
      - "127.0.0.1:8080:8080"
    environment:
      <<: *omnira-runtime
      OMNIRA_HTTP_ADDR: ":8080"
    healthcheck:
      # Runtime image is alpine: wget (busybox) exists, curl does not.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  # Publishes the Outbox to NATS and runs the routing and outbound-delivery
  # consumers. Without it no job (routing, WhatsApp send) is ever processed.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: omnira-worker
    environment:
      <<: *omnira-runtime
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - omnira-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: omnira-web
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      # 127.0.0.1, not localhost: the nginx image listens on IPv4 only and localhost may resolve to ::1
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - omnira-network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Edge TLS proxy — NOT part of the default stack. The `web` service already serves the SPA and
  # proxies /api; production TLS terminates on the host nginx (omnira-nginx.conf, see
  # docs/architecture/DEPLOYMENT-NGINX.md). Enable with `--profile edge` only with a matching conf.
  nginx:
    profiles: ["edge"]
    image: nginx:alpine
    container_name: omnira-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - omnira-network
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  nats_data:
    driver: local
  keycloak_postgres_data:
    driver: local
  waha_sessions:
    driver: local
  waha_media:
    driver: local

networks:
  omnira-network:
    driver: bridge
