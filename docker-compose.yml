# Runtime environment shared by api and worker. The application connects as
# omnira_app (NOT the owner): the owner is a superuser and would bypass RLS; the
# services refuse to start with a privileged role. Migrations run as the owner in the
# one-shot `migrate` service (tools/migrate-sql.sh), which api and worker wait for.
x-omnira-runtime: &omnira-runtime
  OMNIRA_DATABASE_URL: postgres://omnira_app:${OMNIRA_APP_DB_PASSWORD:-omnira_app}@postgres:5432/${OMNIRA_DB_NAME:-omnira_dev}?sslmode=disable
  OMNIRA_NATS_URL: nats://nats:4222
  OMNIRA_VALKEY_URL: redis://valkey:6379/0
  OMNIRA_OTEL_ENDPOINT: http://otel-collector:4317
  OMNIRA_ENV: ${OMNIRA_ENV-development}
  OMNIRA_AUTH_MODE: ${OMNIRA_AUTH_MODE-mock}
  # Sem isto não existe rota de login de desenvolvimento: a API a registra
  # apenas com a flag ligada num ambiente permitido.
  OMNIRA_DEV_AUTH_ENABLED: ${OMNIRA_DEV_AUTH_ENABLED-true}
  OMNIRA_AUTH_ISSUER: ${OMNIRA_AUTH_ISSUER-http://keycloak:8080/realms/omnira}
  OMNIRA_AUTH_AUDIENCE: ${OMNIRA_AUTH_AUDIENCE-omnira-web}
  OMNIRA_AUTH_CLIENT_ID: ${OMNIRA_AUTH_CLIENT_ID-omnira-web}
  OMNIRA_AUTH_CLIENT_SECRET: ${OMNIRA_AUTH_CLIENT_SECRET-}
  OMNIRA_AUTH_REDIRECT_URL: ${OMNIRA_AUTH_REDIRECT_URL-http://localhost:8080/api/v1/auth/oidc/callback}
  OMNIRA_AUTH_POST_LOGIN_URL: ${OMNIRA_AUTH_POST_LOGIN_URL-/login?oidc=complete}
  OMNIRA_AUTH_COOKIE_SECURE: ${OMNIRA_AUTH_COOKIE_SECURE-false}
  # Native app credentials (ADR-0022). Off unless ENABLED=true; needs OIDC mode and a redirect URI allowlist (comma separated).
  OMNIRA_AUTH_MOBILE_ENABLED: ${OMNIRA_AUTH_MOBILE_ENABLED-}
  OMNIRA_AUTH_MOBILE_CLIENT_ID: ${OMNIRA_AUTH_MOBILE_CLIENT_ID-}
  OMNIRA_AUTH_MOBILE_REDIRECT_URIS: ${OMNIRA_AUTH_MOBILE_REDIRECT_URIS-}
  OMNIRA_CREDENTIALS_KEY: ${OMNIRA_CREDENTIALS_KEY-}
  OMNIRA_PUBLIC_BASE_URL: ${OMNIRA_PUBLIC_BASE_URL-}
  # Convites por e-mail (vazio = sem envio; em dev o admin copia o link). Dev: profile "dev" sobe o
  # Mailpit; use OMNIRA_SMTP_HOST=mailpit, OMNIRA_SMTP_PORT=1025, OMNIRA_SMTP_TLS=none.
  OMNIRA_WEB_BASE_URL: ${OMNIRA_WEB_BASE_URL-}
  OMNIRA_SMTP_HOST: ${OMNIRA_SMTP_HOST-}
  OMNIRA_SMTP_PORT: ${OMNIRA_SMTP_PORT-587}
  OMNIRA_SMTP_USERNAME: ${OMNIRA_SMTP_USERNAME-}
  OMNIRA_SMTP_PASSWORD: ${OMNIRA_SMTP_PASSWORD-}
  OMNIRA_SMTP_FROM: ${OMNIRA_SMTP_FROM-}
  OMNIRA_SMTP_REPLY_TO: ${OMNIRA_SMTP_REPLY_TO-}
  OMNIRA_SMTP_TLS: ${OMNIRA_SMTP_TLS-starttls}
  OMNIRA_WAHA_ENABLED: ${OMNIRA_WAHA_ENABLED-false}
  OMNIRA_WAHA_BASE_URL: ${OMNIRA_WAHA_BASE_URL-http://waha:3000}
  OMNIRA_WAHA_API_KEY: ${OMNIRA_WAHA_API_KEY-}
  OMNIRA_WAHA_ENGINE: ${OMNIRA_WAHA_ENGINE-GOWS}
  # ADR-0016: inbound media. Files live in OMNIRA_MEDIA_DIR (the worker writes, the API reads only cleared
  # files); clamd is the clamav service. Both fail closed: no antivirus, nothing is published.
  OMNIRA_MEDIA_DIR: ${OMNIRA_MEDIA_DIR-/var/lib/omnira/media}
  OMNIRA_CLAMAV_ADDR: ${OMNIRA_CLAMAV_ADDR-clamav:3310}
  # ADR-0024: files operators send to customers. Off until the live smoke passes (docs/ops/OUTBOUND-MEDIA.md). Needs the antivirus above.
  OMNIRA_OUTBOUND_MEDIA_ENABLED: ${OMNIRA_OUTBOUND_MEDIA_ENABLED-}
  # Read-only Service Hub API. Off until migrations 093-095 are applied and a Hub is provisioned.
  OMNIRA_HUB_API_ENABLED: ${OMNIRA_HUB_API_ENABLED-}
  OMNIRA_HUB_ADMIN_API_ENABLED: ${OMNIRA_HUB_ADMIN_API_ENABLED-}
  OMNIRA_HUB_ACCESS_API_ENABLED: ${OMNIRA_HUB_ACCESS_API_ENABLED-}
  OMNIRA_HUB_PROJECTOR_ENABLED: ${OMNIRA_HUB_PROJECTOR_ENABLED-}
  OMNIRA_HUB_PROJECTOR_INTERVAL_SECONDS: ${OMNIRA_HUB_PROJECTOR_INTERVAL_SECONDS-}
  OMNIRA_TICKET_OPEN_NOTICE_ENABLED: ${OMNIRA_TICKET_OPEN_NOTICE_ENABLED-}
  # ADR-0016 M2: local speech-to-text (systemd unit omnira-whisper on the host, GPU). Reached through the docker0
  # gateway; the host firewall only lets the OMNIRA compose network in. Empty disables transcription.
  OMNIRA_WHISPER_URL: ${OMNIRA_WHISPER_URL-http://172.17.0.1:18181}
  # WhatsApp oficial (Meta Cloud API): per-connection credentials live encrypted in the DB (no global secret).
  # Off by default; docs/ops/META.md.
  OMNIRA_META_ENABLED: ${OMNIRA_META_ENABLED-false}
  # Flow Builder (ADR-0019): conversational flows API + runtime. Off by default; docs/flows/OPERATIONS.md.
  OMNIRA_FLOWS_ENABLED: ${OMNIRA_FLOWS_ENABLED-false}
  # Flow AI nodes (classify/extract/summarize) also need OMNIRA_AI_ENABLED + a model; off by default (nodes take their error port).
  OMNIRA_FLOWS_AI_ENABLED: ${OMNIRA_FLOWS_AI_ENABLED-false}
  # ADR-0020: the copilot also sees the contact's earlier attendances and open follow-ups. Off by default (also needs OMNIRA_COPILOT_ENABLED).
  OMNIRA_COPILOT_CONTACT_MEMORY_ENABLED: ${OMNIRA_COPILOT_CONTACT_MEMORY_ENABLED-false}
  # Platform AI (summary, copilot, closing suggestion, flow AI nodes). OMNIRA_AI_PROVIDER = openai (default) | gemini. Off unless
  # OMNIRA_AI_ENABLED=true AND provider, model and key are set. For gemini the key may be OMNIRA_AI_API_KEY or OMNIRA_GEMINI_API_KEY.
  # Empty = the code default (never a value invented here). Per-task models override OMNIRA_AI_MODEL.
  OMNIRA_AI_ENABLED: ${OMNIRA_AI_ENABLED-}
  OMNIRA_AI_PROVIDER: ${OMNIRA_AI_PROVIDER-}
  OMNIRA_AI_MODEL: ${OMNIRA_AI_MODEL-}
  OMNIRA_AI_API_KEY: ${OMNIRA_AI_API_KEY-}
  OMNIRA_GEMINI_API_KEY: ${OMNIRA_GEMINI_API_KEY-}
  OMNIRA_AI_TIMEOUT_SECONDS: ${OMNIRA_AI_TIMEOUT_SECONDS-}
  OMNIRA_AI_MODEL_TOPIC_CLASSIFY: ${OMNIRA_AI_MODEL_TOPIC_CLASSIFY-}
  OMNIRA_AI_MODEL_TOPIC_SUMMARY: ${OMNIRA_AI_MODEL_TOPIC_SUMMARY-}
  OMNIRA_AI_MODEL_COPILOT: ${OMNIRA_AI_MODEL_COPILOT-}
  OMNIRA_AI_MODEL_CLOSING_SUGGEST: ${OMNIRA_AI_MODEL_CLOSING_SUGGEST-}
  # Conversation Intelligence switches (ADR-0017). Empty = the code default (topics on, everything else off).
  OMNIRA_COPILOT_ENABLED: ${OMNIRA_COPILOT_ENABLED-}
  OMNIRA_AI_TOOL_GATEWAY_ENABLED: ${OMNIRA_AI_TOOL_GATEWAY_ENABLED-}
  OMNIRA_TOPIC_THREADS_ENABLED: ${OMNIRA_TOPIC_THREADS_ENABLED-}
  OMNIRA_TOPIC_AUTO_ROUTING_ENABLED: ${OMNIRA_TOPIC_AUTO_ROUTING_ENABLED-}
  OMNIRA_TOPIC_AI_ROUTING_ENABLED: ${OMNIRA_TOPIC_AI_ROUTING_ENABLED-}
  OMNIRA_TOPIC_SUMMARIES_ENABLED: ${OMNIRA_TOPIC_SUMMARIES_ENABLED-}
  OMNIRA_PRIVATE_HANDOFF_ENABLED: ${OMNIRA_PRIVATE_HANDOFF_ENABLED-}
  OMNIRA_MULTIMODAL_ANALYSIS_ENABLED: ${OMNIRA_MULTIMODAL_ANALYSIS_ENABLED-}
  OMNIRA_AUTO_TICKET_POLICY_ENABLED: ${OMNIRA_AUTO_TICKET_POLICY_ENABLED-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnira-postgres
    environment:
      POSTGRES_USER: omnira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnira}
      POSTGRES_DB: ${OMNIRA_DB_NAME:-omnira_dev}
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnira -d ${OMNIRA_DB_NAME:-omnira_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: omnira-nats
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    # -m 8222 (PILOT.4D): enables the internal HTTP monitoring listener only
    # (/healthz, /varz, /jsz, ...) — no cluster/auth/storage change. The port
    # was already published loopback-only (127.0.0.1:8222) before this; never
    # bind it to 0.0.0.0 or expose it through the public Nginx edge.
    command: -js -sd /data -m 8222
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    restart: unless-stopped

  # Presence (IAM4.2-A, ADR-0010): ephemeral realtime store only. Never a
  # source of durable/critical data (docs/adr/0006, docs/operations/DISASTER-RECOVERY.md) —
  # last_seen_at checkpoints live in Postgres, coalesced.
  valkey:
    image: valkey/valkey:8-alpine
    container_name: omnira-valkey
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - omnira-network
    restart: unless-stopped

  keycloak-postgres:
    image: postgres:16-alpine
    container_name: omnira-keycloak-postgres
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: keycloak
    ports:
      - "127.0.0.1:55435:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: omnira-keycloak
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # PILOT.1: the OIDC `iss` claim must be byte-identical for both the
      # browser (host) and the API (inside the docker network) — otherwise
      # JWT issuer validation fails on one side. "localhost:8888" only
      # resolves on the host; "keycloak:8080" only resolves in-network, and
      # the two ports differ anyway (8888 is just the host's published-port
      # translation of the container's internal 8080). Using a dedicated
      # hostname (network alias below + a host /etc/hosts entry, both
      # pointing at 127.0.0.1) with the SAME port on both sides (achieved by
      # also making Keycloak itself listen on 8888 via KC_HTTP_PORT) gives
      # both sides one identical, resolvable issuer URL.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://keycloak-pilot:8888}
      KC_HTTP_PORT: "8888"
      # PILOT.1: strict=false lets Keycloak auto-detect the hostname from
      # the inbound request instead of always honoring KC_HOSTNAME, which
      # produced a wrong/inconsistent issuer. strict=true forces the
      # configured KC_HOSTNAME on every response.
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      # PILOT.1: health endpoints (/health/ready, /health/live) are not
      # exposed unless explicitly enabled.
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/omnira-realm.json:/opt/keycloak/data/import/omnira-realm.json:ro
    # PILOT.1: `--optimized` assumes the image was already re-augmented at
    # build time with these exact options (KC_DB=postgres included). This
    # image never went through that build step, so `--optimized` silently
    # falls back to its original build-time config (non-postgres driver)
    # and ignores KC_DB/KC_DB_URL supplied here at runtime — causing
    # "Driver does not support the provided URL". Dropping `--optimized`
    # makes Keycloak re-run its build/augmentation on every start using the
    # runtime env vars actually provided, at the cost of a slightly slower
    # startup. No change to auth architecture.
    command: start --import-realm
    # PILOT.1: this image has neither curl nor wget. Health endpoints live
    # on the management interface (port 9000, confirmed from container
    # startup logs: "Management interface listening on http://0.0.0.0:9000"),
    # not on 8080. Uses bash's /dev/tcp (the approach Keycloak's own docs
    # recommend for this image) instead of adding a package/base-image change.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          timeout 3 cat <&3 | grep -m 1 "HTTP/1.1 200" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      omnira-network:
        aliases:
          - keycloak-pilot
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: omnira-otel
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./config/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    command: ["--config=/etc/otel-collector-config.yml"]
    environment:
      - GOGC=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:gows-2026.8.2
    profiles:
      - whatsapp-unofficial
    environment:
      WHATSAPP_DEFAULT_ENGINE: ${OMNIRA_WAHA_ENGINE-GOWS}
      WAHA_API_KEY: ${WAHA_API_KEY-}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    expose:
      - "3000"
    healthcheck:
      # The WAHA image ships curl (no wget) and /health requires the API key; /ping is public.
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ping >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - omnira-network
    restart: unless-stopped

  # One-shot, idempotent schema migration as the OWNER role (records versions in schema_migrations).
  # First adoption of a database whose schema was applied by hand: OMNIRA_MIGRATE_BASELINE=<last applied prefix>.
  migrate:
    image: postgres:16-alpine
    container_name: omnira-migrate
    entrypoint: ["/bin/sh", "/tools/migrate-sql.sh", "up"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: omnira
      PGPASSWORD: ${POSTGRES_PASSWORD:-omnira}
      PGDATABASE: ${OMNIRA_DB_NAME:-omnira_dev}
      APP_DB_PASSWORD: ${OMNIRA_APP_DB_PASSWORD-}
      BASELINE_UP_TO: ${OMNIRA_MIGRATE_BASELINE-}
    volumes:
      - ./migrations:/migrations:ro
      - ./tools/migrate-sql.sh:/tools/migrate-sql.sh:ro
    networks:
      - omnira-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # DEVELOPMENT ONLY (profile "dev"): seeds the users known to the mock login (test@omnira.local as
  # agent, admin@omnira.local as tenant admin) and one tenant. There is no real IdP yet.
  seed:
    image: postgres:16-alpine
    container_name: omnira-seed
    profiles: ["dev"]
    entrypoint: ["psql", "-X", "-q", "-v", "ON_ERROR_STOP=1", "-f", "/tools/seed-dev.sql"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: omnira
      PGPASSWORD: ${POSTGRES_PASSWORD:-omnira}
      PGDATABASE: ${OMNIRA_DB_NAME:-omnira_dev}
    volumes:
      - ./tools/seed-dev.sql:/tools/seed-dev.sql:ro
    networks:
      - omnira-network
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # DEVELOPMENT ONLY (profile "dev"): captura os e-mails de convite. UI em http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: omnira-mailpit
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - omnira-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: omnira-api
    ports:
      # loopback only: the API also serves the unauthenticated provider webhook; expose publicly only via a
      # reverse proxy that does NOT forward /webhooks or /internal (see web/nginx.conf, omnira-nginx.conf)
      - "127.0.0.1:8080:8080"
    environment:
      <<: *omnira-runtime
      OMNIRA_HTTP_ADDR: ":8080"
    volumes:
      # read-only: the API only ever opens files the antivirus cleared
      - ${OMNIRA_MEDIA_HOST_PATH:-media_data}:/var/lib/omnira/media:ro
      # ADR-0024: the ONLY writable area of the API - operator uploads after the antivirus cleared them. Nested over the read-only inbound
      # mount, so the API still cannot write into clean/ or quarantine/. Point OMNIRA_OUTBOUND_MEDIA_HOST_PATH at <media host path>/outbound.
      - ${OMNIRA_OUTBOUND_MEDIA_HOST_PATH:-media_outbound}:/var/lib/omnira/media/outbound
    healthcheck:
      # Runtime image is alpine: wget (busybox) exists, curl does not.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omnira-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Publishes the Outbox to NATS and runs the routing and outbound-delivery
  # consumers. Without it no job (routing, WhatsApp send) is ever processed.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: omnira-worker
    environment:
      <<: *omnira-runtime
    volumes:
      - ${OMNIRA_MEDIA_HOST_PATH:-media_data}:/var/lib/omnira/media
      - ${OMNIRA_OUTBOUND_MEDIA_HOST_PATH:-media_outbound}:/var/lib/omnira/media/outbound
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - omnira-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Antivirus for inbound attachments (ADR-0016). Internal network only, no published port. Signatures are
  # refreshed by the image's freshclam daemon; the image ships its own healthcheck (clamdcheck.sh).
  clamav:
    image: clamav/clamav:1.4
    container_name: omnira-clamav
    mem_limit: 2g
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - omnira-network
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: omnira-web
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      # 127.0.0.1, not localhost: the nginx image listens on IPv4 only and localhost may resolve to ::1
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - omnira-network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Edge TLS proxy — NOT part of the default stack. The `web` service already serves the SPA and
  # proxies /api; production TLS terminates on the host nginx (omnira-nginx.conf, see
  # docs/architecture/DEPLOYMENT-NGINX.md). Enable with `--profile edge` only with a matching conf.
  nginx:
    profiles: ["edge"]
    image: nginx:alpine
    container_name: omnira-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - omnira-network
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  nats_data:
    driver: local
  keycloak_postgres_data:
    driver: local
  waha_sessions:
    driver: local
  waha_media:
    driver: local
  # Inbound media files (worker writes, API reads cleared ones). Override OMNIRA_MEDIA_HOST_PATH with an
  # absolute path to keep them on a roomier partition.
  media_data:
    driver: local
  # Operator uploads waiting to be sent, and sent files within retention (ADR-0024).
  media_outbound:
    driver: local
  clamav_db:
    driver: local

networks:
  omnira-network:
    driver: bridge
