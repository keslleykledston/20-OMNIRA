success_criteria:
  - "All 15 phases completed"
  - "40 acceptance tests PASS (MT-AT-001..040)"
  - "Zero P0 security findings"
  - "Codex adversarial review PASS"
  - "E2E migration successful"
  - "Performance benchmarks within SLO"
  - "Documentation complete"
  - "Feature flags allow gradual rollout"

risks:
  - id: "risk-01"
    severity: "P0"
    title: "RLS bypass during Hub access"
    mitigation: "Codex adversarial review mandatory before Phase 5"

  - id: "risk-02"
    severity: "P0"
    title: "Hub agent gains system_admin accidentally"
    mitigation: "No system_admin grant to hub_agent role; code review + tests"

  - id: "risk-03"
    severity: "P0"
    title: "Projection stale, auth revoked, but item still visible"
    mitigation: "RLS enforces revocation; reconciliation sweeps stale items"

  - id: "risk-04"
    severity: "P1"
    title: "Hub Inbox O(n) query per tenant (performance cliff)"
    mitigation: "Materialized view + cursor pagination; benchmark before deploy"

  - id: "risk-05"
    severity: "P1"
    title: "External write double-creation on retry"
    mitigation: "Idempotency key + deduplication; local attempt tracking"

notes: |
  - Branch: feat/multitenant-service-hub
  - No changes to main until Phase 14+ readiness
  - Feature flags gate all Hub functionality
  - Codex review mandatory at Phases 4, 7, 13
  - Lovable MCP used for frontend (Phase 9)
  - LLM local used for context packs + summary
  - Migration strategy: expand/contract (no big-bang)
  - Preserve all existing single-tenant functionality

